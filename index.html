function makeStaff(name,role,post,lines){
  return {id:uid++,def:BY['oes'],name,role,post,lines,staff:true,pals:{},bestPal:null,
    with:null,meet:null,socialT:0,
    size:2,char:{k:'sociable',label:'sociable'},wish:'garden',likes:[],found:{},
    hearts:5,stays:0,comfort:0,room:null,resident:true,
    f:0,u:post,facing:1,state:'idle',st:rnd(2,5),blink:rnd(1,5),
    wag:Math.random()*6,head:0,legs:[],tgt:null,onArrive:null,bub:null,bubT:rnd(3,9),
    homeU:post, homeF:0};
}
S.staff=[];
/* Betsy's brother. He is not hired from the applicant list — he simply turns up
   when there is a bar to keep, which is the sort of thing that runs in that
   family. Same breed as his sister, for obvious reasons. */
function bringBooks(room){
  if(!room||(S.staff||[]).some(s=>s.role==='barkeep')) return;
  const b=makeStaff('Books','barkeep',room.s+.5,STAFF_LINES.barkeep);
  b.f=room.f; b.u=room.s+.5; b.homeU=room.s+.5; b.homeF=room.f; b.facing=1;
  S.staff.push(b);
  say('<em>Books has turned up to keep the bar. Betsy says he is her brother.</em>');
}
function placeStaff(){
  const lob=S.rooms.find(r=>r.kind==='lobby');
  const ent=entryRoom();
  const deskU=lob?lob.s+.62:1.6;
  const doorU2=ent?ent.s+ent.parts.length-.72:4.2;
  S.staff=[
    makeStaff('Maggie','concierge',doorU2,[
      '"Evening. Mind the step — it catches everyone once."',
      '"We have had worse weather. Not much worse, mind."',
      '"Anyone asks, I have been here since before the lift."',
      '"That revolving door and I have an understanding."',
      '"I like to know who is coming in. Habit."']),
    makeStaff('Books','barkeep',postU('barkeep'),STAFF_LINES.barkeep),
    makeStaff('Betsy','reception',deskU,[
      '"Room is ready whenever they are."',
      '"I keep the book. I do not lose the book."',
      '"Somebody has been at the biscuits again."',
      '"Third floor is quieter, if anyone asks."',
      '"We are nearly full. I do enjoy nearly full."'])
  ];
}
placeStaff();
function stepStaff(dt){
  for(const d of S.staff){
    if(d.with){ d.blink-=dt; if(d.blink<=0) d.blink=rnd(2.2,6.5);
      d.wag+=dt*2.4; continue; }
    d.blink-=dt; if(d.blink<=0) d.blink=rnd(2.2,6.5);
    d.wag+=dt*(1.6+(d.state==='watch'?2.4:0));
    d.head+=((d.state==='watch'?1:0)-d.head)*Math.min(1,dt*5);
    travel(d,dt);
    if(d.tgt) continue;
    if(d.role==='keeper') continue;            // the housekeeper has her own rounds
    d.st-=dt;
    if(d.st<=0){
      const r=Math.random();
      /* d.homeF, not a hardcoded 0. Every staff member used to live on the
         ground floor, so sending them "home" meant floor zero. The barkeep works
         upstairs, and the hardcoded floor had him calling the lift on every idle
         tick and riding it down — which monopolised the only lift in the
         building and quietly stopped guests reaching the shared rooms at all. */
      if(r<.34) goTo(d,d.homeF|0,d.homeU+rnd(-.16,.16),dd=>setState(dd,pick(['idle','sit']),rnd(4,9)));
      else setState(d,pick(['idle','idle','sit']),rnd(4,10));
    }
  }
}



/* ================================= sound ==================================
   No files. Everything here is synthesised, which keeps the whole game one
   HTML page. The bed is ambient and always running; one-shots are small and
   dry so they sit under the room tone rather than on top of it.
   ========================================================================== */
const SND={ctx:null,on:true,master:null,bedGain:null,fireGain:null,
  cityGain:null,started:false,vol:.55};
function noiseBuffer(ctx,secs){
  const n=ctx.sampleRate*secs, b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  return b;
}
function startAudio(){
  if(SND.started) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  const ctx=new AC(); SND.ctx=ctx; SND.started=true;
  const master=ctx.createGain(); master.gain.value=SND.on?SND.vol:0;
  master.connect(ctx.destination); SND.master=master;

  const src=ctx.createBufferSource();
  src.buffer=noiseBuffer(ctx,4); src.loop=true; src.start();

  // city hum: heavily filtered noise, the traffic three streets away
  const cityF=ctx.createBiquadFilter(); cityF.type='lowpass';
  cityF.frequency.value=220; cityF.Q.value=.6;
  const cityG=ctx.createGain(); cityG.gain.value=.16;
  src.connect(cityF); cityF.connect(cityG); cityG.connect(master);
  SND.cityGain=cityG;
  // a slow swell so it never sits perfectly still
  const lfo=ctx.createOscillator(), lfoG=ctx.createGain();
  lfo.frequency.value=.045; lfoG.gain.value=.05;
  lfo.connect(lfoG); lfoG.connect(cityG.gain); lfo.start();


  // fire: low crackle, only audible when you are near a lit hearth
  const fireF=ctx.createBiquadFilter(); fireF.type='bandpass';
  fireF.frequency.value=520; fireF.Q.value=.8;
  const fireG=ctx.createGain(); fireG.gain.value=0;
  src.connect(fireF); fireF.connect(fireG); fireG.connect(master);
  SND.fireGain=fireG;
}
function env(node,peak,a,d){
  const t=SND.ctx.currentTime, g=node.gain;
  g.cancelScheduledValues(t); g.setValueAtTime(0.0001,t);
  g.exponentialRampToValueAtTime(Math.max(.0001,peak),t+a);
  g.exponentialRampToValueAtTime(.0001,t+a+d);
}
function tone(freq,peak,a,d,type,slideTo){
  if(!SND.ctx||!SND.on) return;
  const ctx=SND.ctx, o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,ctx.currentTime);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,ctx.currentTime+a+d);
  o.connect(g); g.connect(SND.master);
  env(g,peak,a,d); o.start(); o.stop(ctx.currentTime+a+d+.05);
}
function noiseHit(peak,a,d,f,q,type){
  if(!SND.ctx||!SND.on) return;
  const ctx=SND.ctx, s=ctx.createBufferSource(), bp=ctx.createBiquadFilter(), g=ctx.createGain();
  s.buffer=noiseBuffer(ctx,.5);
  bp.type=type||'bandpass'; bp.frequency.value=f; bp.Q.value=q||1;
  s.connect(bp); bp.connect(g); g.connect(SND.master);
  env(g,peak,a,d); s.start(); s.stop(ctx.currentTime+a+d+.05);
}
/* --- the voices of the hotel ---------------------------------------------
   Two rules keep this sparse. Everything has a place in the building, and you
   only hear what is near the camera. And every sound has a cooldown, with a
   global limiter on top, so the hotel never chatters over itself.
   ------------------------------------------------------------------------- */
function heard(at){
  if(!at) return 1;                              // player actions are always full
  const dx=Math.abs(at.u-cam.cx), dy=Math.abs(at.f-cam.cy)*1.7;
  const near=Math.max(0,1-Math.hypot(dx,dy)/3.0);
  return Math.pow(near,1.5)*Math.min(1,cam.k*1.2); // and almost nothing from the map
}
const COOL={ding:4.5,doors:5,lift:9,bark:4,paws:3,coin:.25,heart:1.4,
  build:.6,splash:1.2,scrub:1.8,pop:.15,bell:3,night:20,horn:1,creak:1};
const lastAt={}; let lastAny=0;
function SFXbase(k,g){
  const F={
    ding(v){ tone(1318,.14*v,.004,.85,'sine'); tone(1976,.05*v,.004,.6,'sine'); },
    doors(v){ noiseHit(.09*v,.03,.30,400,1.2); },
    lift(v){ tone(74,.030*v,.5,1.6,'sine'); },
    bark(v){ tone(330,.10*v,.006,.10,'sawtooth',185);
      setTimeout(()=>tone(305,.06*v,.006,.08,'sawtooth',175),115); },
    paws(v){ noiseHit(.028*v,.002,.05,900,2); },
    coin(v){ tone(1046,.09*v,.004,.14,'triangle');
      setTimeout(()=>tone(1568,.07*v,.004,.2,'triangle'),70); },
    heart(v){ tone(659,.09*v,.01,.28,'sine');
      setTimeout(()=>tone(880,.08*v,.01,.4,'sine'),110); },
    build(v){ noiseHit(.13*v,.005,.2,260,.8);
      setTimeout(()=>tone(196,.08*v,.01,.5,'sine',147),40); },
    splash(v){ noiseHit(.08*v,.01,.28,1800,.6); },
    scrub(v){ noiseHit(.026*v,.01,.10,2200,.9); },
    pop(v){ tone(880,.06*v,.003,.08,'sine',1320); },
    bell(v){ tone(2093,.11*v,.003,1.1,'sine'); tone(3136,.04*v,.003,.8,'sine'); },
    night(v){ tone(220,.05*v,.4,1.6,'sine');
      setTimeout(()=>tone(165,.04*v,.4,1.8,'sine'),260); },
    horn(v){ tone(196,.035*v,.06,.5,'sawtooth');
      setTimeout(()=>tone(147,.028*v,.06,.6,'sawtooth'),180); },
    creak(v){ tone(320,.018*v,.18,.5,'sine',248); }
  };
  (F[k]||(()=>{}))(g);
}
function sfx(k,opt){
  if(!SND.on||!SND.ctx) return;
  const now=SND.ctx.currentTime;
  const cd=COOL[k]!==undefined?COOL[k]:1;
  if(lastAt[k]!==undefined&&now-lastAt[k]<cd) return;
  if(now-lastAny<.055) return;                   // never let two land together
  let gain=1;
  if(opt&&opt.at){ gain=heard(opt.at); if(gain<.06) return; }
  if(opt&&opt.gain!==undefined) gain*=opt.gain;
  lastAt[k]=now; lastAny=now;
  SFXbase(k,gain);
}

/* the ambient bed moves about on its own so it never sits still */
let ambT=8, gustT=0, windGain=null;
function stepAudio(dt){
  if(!SND.ctx) return;
  const now=SND.ctx.currentTime;

  // hearths near the camera
  let fire=0;
  for(const r of S.rooms) r.parts.forEach((p,i)=>{
    if(p!=='fire'||!S.fires[key(r.f,r.s+i)]) return;
    const d=Math.hypot((r.s+i)-cam.cx,(r.f-cam.cy)*1.5);
    fire=Math.max(fire,Math.max(0,1-d/2.0));
  });
  SND.fireGain.gain.setTargetAtTime(fire*.07*Math.min(1,cam.k*1.5),now,.6);

  // the street below, and the wind up top
  const height=Math.max(0,cam.cy);
  SND.cityGain.gain.setTargetAtTime((.045+.09/(1+height*.9))*Math.min(1,cam.k*1.4+.25),now,1.4);

  // sparse one-offs, so the bed has punctuation rather than a texture
  ambT-=dt;
  if(ambT<=0){
    ambT=rnd(18,52);
    const outside=1-Math.min(1,cam.k*1.2);        // zoomed out you are in the street
    const inside=Math.min(1,cam.k*1.2);
    const r=Math.random();
    if(r<.5&&cam.cy<3) sfx('horn',{gain:.25+outside*.55});
    else if(r<.8) sfx('creak',{gain:.25+inside*.5});
    // otherwise nothing at all, which is the point
  }
}
/* browsers need a gesture before any of this is allowed to make noise */
function armAudio(){
  startAudio();
  if(SND.ctx&&SND.ctx.state==='suspended') SND.ctx.resume();
}
addEventListener('pointerdown',armAudio,{once:false});

/* ================================ saving ==================================
   One continuous save, autosaved on the day roll and whenever you build.
   Everything goes through SaveAdapter, and serialize/deserialize are pure —
   swapping localStorage for a server later is one new object, not a rewrite.
   ========================================================================== */
const SAVE_KEY='doghotel.save';
const SAVE_VERSION=5;
/* Schema history — bump on every change to what serialize() writes.
     1  rooms, dogs, lobby, pool, friends, lift
     2  + bonds and per-dog pals (friendships between guests)
     3  + staff with roles, and applicants looking for work
     4  key renamed off the version so the version lives in the payload
   MIGRATE holds a step per old version; anything older than the oldest
   migration is discarded rather than half-loaded. */
const MIGRATE={
  1(o){ o.bonds=o.bonds||{};
        for(const l of [o.dogs,o.lobby,o.pool]) for(const d of (l||[])){ d.pl=d.pl||{}; d.bp=null; }
        return o; },
  2(o){ o.staff=null; o.applicants=[]; return o; },   // rebuild the default staff
  3(o){ return o; },
  /* Auto check-in became the default, but serialize() has always written the
     field, so an existing save is indistinguishable from a deliberate "off".
     Flip it on once. Anyone who actually wants the front desk manual can turn it
     back and that choice will stick, because there is no migration after this. */
  4(o){ o.auto=true; return o; }
};
/* Preferences live in their own key. They are not game state — wiping a save
   should not move your zoom slider back to the other hand — and keeping them out
   of serialize() means none of this costs a SAVE_VERSION bump. */
const PREFS_KEY='doghotel.prefs';
const PREFS={zoomBar:true, zoomSide:'right'};
function loadPrefs(){
  try{ const raw=localStorage.getItem(PREFS_KEY); if(raw) Object.assign(PREFS,JSON.parse(raw)); }
  catch(e){}
}
function savePrefs(){
  try{ localStorage.setItem(PREFS_KEY,JSON.stringify(PREFS)); }catch(e){}
}
const SaveAdapter={
  read(){ try{
    const cur=localStorage.getItem(SAVE_KEY);
    if(cur) return cur;
    const old=localStorage.getItem('doghotel.v1');   // saves from before the rename
    if(old){ localStorage.setItem(SAVE_KEY,old); localStorage.removeItem('doghotel.v1'); return old; }
    return null;
  }catch(e){ return null; } },
  write(s){ try{ localStorage.setItem(SAVE_KEY,s); return true; }catch(e){ return false; } },
  clear(){ try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem('doghotel.v1'); }catch(e){} }
};
function packDog(d){
  return {i:d.id,b:d.def.id,n:d.name,z:d.size,c:d.char.k,w:d.wish,
    lk:d.likes,fd:d.found,h:d.hearts,st:d.stays,cf:d.comfort,
    ni:d.nights,lf:d.left,rs:!!d.resident,gw:!!d.gotWish,wp:!!d.wishPaid,
    r:d.room?d.room.id:0,f:d.f,u:d.u,pt:d.potty,ri:d.returnIn,pl:d.pals||{},bp:d.bestPal,
    lt:d.lobbyT,dd:d.did||null,tl:d.told||null,gr:!!d.grumbled};
}
function unpackDog(o){
  const b=BY[o.b]||BREEDS[0];
  return warmLook({id:o.i,def:b,name:o.n,size:o.z,
    char:CHARS.find(c=>c.k===o.c)||CHARS[0],wish:o.w,
    likes:o.lk||[],found:o.fd||{},hearts:o.h||0,stays:o.st||0,comfort:o.cf||0,
    nights:o.ni||0,left:o.lf||0,resident:!!o.rs,gotWish:!!o.gw,wishPaid:!!o.wp,
    room:null,_r:o.r||0,f:o.f||0,u:o.u||1.5,potty:o.pt||rnd(14,30),
    returnIn:o.ri,lobbyT:o.lt||rnd(28,54),did:o.dd||{},told:o.tl||{},
    grumbled:!!o.gr,pals:o.pl||{},bestPal:o.bp||null,with:null,meet:null,socialT:0,
    facing:1,state:'idle',st:rnd(2,5),blink:rnd(1,5),
    wag:Math.random()*6,head:0,legs:[],tgt:null,onArrive:null,bub:null,bubT:rnd(3,9),
    leaving:false,focus:false});
}
function serialize(){
  return JSON.stringify({
    v:SAVE_VERSION, coins:S.coins, day:S.day, t:S.t, dayT:S.dayT, auto:S.auto, bonds:S.bonds,
    uid, roomId,
    rooms:S.rooms.map(r=>({id:r.id,f:r.f,s:r.s,p:r.parts,k:r.kind,cap:r.cap,
      sh:r.shared,sty:r.style,n:r.name,beds:r.beds,
      soil:(r.soil||[]).map(x=>[x.s,+x.x.toFixed(3),x.k,x.tidy?1:0])})),
    dogs:S.dogs.map(packDog), lobby:S.lobby.map(packDog), pool:S.pool.map(packDog),
    friends:S.friends.map(d=>d.id),
    staff:(S.staff||[]).map(s=>({...packDog(s),role:s.role,homeU:s.homeU,homeF:s.homeF|0})),
    applicants:(S.applicants||[]).map(a=>({...packDog(a),wr:a.wantRole,at:a.applyT})),
    lift:{f:S.lift.f,target:S.lift.target,state:S.lift.state,
      riders:S.lift.riders.map(d=>d.id),doorT:S.lift.doorT}
  });
}
function migrate(o){
  let v=o.v|0;
  if(v<1||v>SAVE_VERSION) return null;         // unknown or from the future
  while(v<SAVE_VERSION){
    const step=MIGRATE[v];
    if(!step) return null;                     // no path forward — start fresh
    o=step(o); v++; o.v=v;
  }
  return o;
}
function deserialize(txt){
  let o=JSON.parse(txt);
  if(!o) return false;
  if(o.v!==SAVE_VERSION){
    o=migrate(o);
    if(!o){ console.warn('save is from an incompatible version — starting fresh'); return false; }
  }
  S.coins=o.coins; S.day=o.day; S.t=o.t||0; S.dayT=o.dayT||0; S.auto=!!o.auto;
  S.bonds=o.bonds||{};
  uid=o.uid||1; roomId=o.roomId||1;
  S.rooms=o.rooms.map(r=>({id:r.id,f:r.f,s:r.s,parts:r.p,kind:r.k,cap:r.cap,
    shared:r.sh,style:r.sty,name:r.n,beds:r.beds,
    soil:(r.soil||[]).map(a=>({s:a[0],x:a[1],k:a[2],tidy:!!a[3]}))}));
  const byId={};
  const rehome=list=>list.map(p=>{ const d=unpackDog(p); byId[d.id]=d; return d; });
  S.dogs=rehome(o.dogs); S.lobby=rehome(o.lobby); S.pool=rehome(o.pool);
  for(const d of S.dogs){
    const r=S.rooms.find(x=>x.id===d._r);
    if(r){ d.room=r; r.guest=d; }
    delete d._r;
  }
  for(const d of [...S.lobby,...S.pool]) delete d._r;
  S.friends=(o.friends||[]).map(id=>byId[id]).filter(Boolean);
  S.lift={f:o.lift?o.lift.f:0,target:o.lift?o.lift.target:0,
    state:o.lift?o.lift.state:'idle',doorT:o.lift?o.lift.doorT:0,
    riders:(o.lift&&o.lift.riders||[]).map(id=>byId[id]).filter(Boolean)};
  for(const d of S.lift.riders) d.state='ride';
  rebuild(); cache.clear();
  if(o.staff&&o.staff.length){
    S.staff=o.staff.map(p=>{ const d=unpackDog(p); d.staff=true; d.role=p.role;
      d.homeU=p.homeU!==undefined?p.homeU:postU(p.role);
      /* Not everyone works on the ground floor any more. Restoring with f=0 put
         the barkeep in the lobby and left the bar unattended. */
      const room=p.role==='barkeep'?S.rooms.find(r=>r.shared==='lounge'):null;
      d.homeF=p.homeF!==undefined?p.homeF:(room?room.f:0);
      d.roams=(d.role==='keeper');
      d.lines=STAFF_LINES[d.role]||STAFF_LINES.reception;
      d.resident=true; d.f=d.homeF; d.u=d.homeU; byId[d.id]=d; return d; });
  } else placeStaff();
  S.applicants=(o.applicants||[]).map(p=>{ const d=unpackDog(p);
    d.wantRole=p.wr||'keeper'; d.applyT=p.at||60; return d; });
  return true;
}
let saveT=0, saveFlash=0;
function saveNow(){
  if(SaveAdapter.write(serialize())) saveFlash=performance.now()+900;
}
function loadGame(){
  const txt=SaveAdapter.read();
  if(!txt) return false;
  const snapshot=serialize();                  // the pristine new-hotel state
  try{
    if(deserialize(txt)) return true;
    deserialize(snapshot); return false;
  } catch(e){
    console.warn('save unreadable, starting fresh',e);
    try{ deserialize(snapshot); }catch(_){}     // roll back a partial load
    return false;
  }
}
function resetGame(){ SaveAdapter.clear(); location.reload(); }
addEventListener('visibilitychange',()=>{ if(document.hidden) saveNow(); });
addEventListener('pagehide',saveNow);



/* ================================= staff ==================================
   Staff raise the ceiling; they never replace the floor. A housekeeper tidies
   slowly and imperfectly — you can always beat her to a mess and pocket the
   tip yourself. Nobody here does the services, because the services are yours.
   ========================================================================== */
const ROLES={
  concierge:{n:'Concierge',   icon:'🎩',wage:52,post:'door',
    d:'brings a better class of guest to the door'},
  reception:{n:'Receptionist',icon:'🔔',wage:44,post:'desk',
    d:'checks guests in so you do not have to'},
  keeper   :{n:'Housekeeper', icon:'🧹',wage:38,post:'roam',
    d:'does the rounds and clears up after the guests'},
  porter   :{n:'Porter',      icon:'🧳',wage:32,post:'door',
    d:'meets arrivals and settles them in quicker'},
  chef     :{n:'Chef',        icon:'🍳',wage:48,post:'kitchen',needs:'kitchen',
    d:'needs a kitchen · everyone settles in faster'},
  barkeep  :{n:'Barkeep',     icon:'🍸',wage:46,post:'lounge',needs:'lounge',
    d:'needs a lounge · keeps the room talking'}
};
const QUARTERS_PER=3, NO_BED_MULT=1.6;
function staffOf(role){ return (S.staff||[]).filter(s=>s.role===role); }
function bedsForStaff(){
  return S.rooms.filter(r=>r.kind==='quarters')
    .reduce((a,r)=>a+Math.round(r.parts.length),0);
}
function staffHoused(s){
  const i=(S.staff||[]).indexOf(s);
  return i>=0&&i<bedsForStaff();
}
function wageOf(s){
  return Math.round(ROLES[s.role].wage*(staffHoused(s)?1:NO_BED_MULT));
}
function payroll(){ return (S.staff||[]).reduce((a,s)=>a+wageOf(s),0); }
function hasKitchen(){ return S.rooms.some(r=>r.shared==='kitchen'); }
function chefBoost(){ return hasKitchen()?Math.min(.5,staffOf('chef').length*.25):0; }
function porterBoost(){ return Math.min(.24,staffOf('porter').length*.12); }
function canAutoCheckIn(){ return staffOf('reception').length>0; }

function hire(d,role){
  const R=ROLES[role]; if(!R) return false;
  if(R.needs==='kitchen'&&!hasKitchen()) return false;
  S.lobby=S.lobby.filter(x=>x!==d);
  S.applicants=(S.applicants||[]).filter(x=>x!==d);
  S.pool=S.pool.filter(x=>x!==d);
  d.staff=true; d.role=role; d.room=null; d.resident=true;
  d.roams=(role==='keeper');            // the housekeeper works the whole building
  d.legs=[]; d.tgt=null; d.onArrive=null; d.with=null; d.bub=null;
  d.lines=STAFF_LINES[role]||STAFF_LINES.reception;
  d.homeU=postU(role); d.f=0; d.u=d.homeU;
  S.staff.push(d);
  say('<em>'+d.name+'</em> has taken the '+R.n.toLowerCase()+' post.');
  sfx('bell'); saveNow();
  return true;
}
function dismiss(s){
  S.staff=S.staff.filter(x=>x!==s);
  s.staff=false; s.role=null; s.resident=false; s.hearts=Math.max(1,s.hearts);
  s.returnIn=1; S.pool.push(s);
  say(s.name+' has gone back to being a guest.');
  saveNow();
}
function postU(role){
  const lob=S.rooms.find(r=>r.kind==='lobby');
  const ent=entryRoom();
  const kit=S.rooms.find(r=>r.shared==='kitchen');
  if(role==='desk'||role==='reception') return lob?lob.s+.62:1.6;
  if(role==='chef'&&kit) return kit.s+.5;
  if(role==='barkeep'){ const bar=S.rooms.find(r=>r.shared==='lounge'); if(bar) return bar.s+.5; }
  if(role==='keeper') return lob?lob.s+1.6:2.6;
  return ent?ent.s+ent.parts.length-.72:4.2;
}

/* applicants turn up looking for work whether or not you need them */
function makeApplicant(){
  const d=makeDog();
  d.wantRole=pick(Object.keys(ROLES));
  d.applyT=rnd(70,150);
  return d;
}
function stepStaffSystem(dt){
  S.applicants=S.applicants||[];
  S.applyT=(S.applyT===undefined?12:S.applyT)-dt;
  if(S.applyT<=0){
    S.applyT=rnd(30,70);
    if(S.applicants.length<3) S.applicants.push(makeApplicant());
  }
  for(let i=S.applicants.length-1;i>=0;i--){
    S.applicants[i].applyT-=dt;
    if(S.applicants[i].applyT<=0) S.applicants.splice(i,1);
  }
}

/* the housekeeper actually walks to the mess and deals with it */
function stepKeepers(dt){
  for(const s of staffOf('keeper')){
    if(s.with) continue;
    if(s.tgt&&s.state!=='wait') continue;   // walking or riding: let her get there
    s.jobT=(s.jobT===undefined?2:s.jobT)-dt;
    if(s.jobT>0) continue;
    s.jobT=rnd(1.2,2.6);
    if(s.job&&s.job.r&&(!s.job.r.soil||!s.job.r.soil.length)) s.job=null;   // someone beat her to it
    if(s.job){                                  // arrived — do the whole room
      const r=s.job.r;
      if(r&&r.soil&&r.soil.length){
        r.soil.splice(0,3);                     // a proper go at it, not one at a time
        sfx('scrub',{at:{f:s.f,u:s.u}});
        if(!r.soil.length) for(const g of S.dogs) if(g.room===r) g.grumbled=false;
        if(r.soil.length){ s.jobT=1.1; continue; }   // stay and finish the job
      }
      s.job=null; continue;
    }
    let best=null,bd=1e9;
    for(const r of S.rooms){
      if(!r.soil) continue;
      for(const p of r.soil){
        const d2=Math.abs(r.f-dfloor(s))*3+Math.abs((p.s+p.x)-s.u);
        if(d2<bd){ bd=d2; best={r,p}; }
      }
    }
    if(best){ s.job=best; goTo(s,best.r.f,best.p.s+best.p.x,()=>{ s.jobT=1.1; }); }
    else if(Math.abs(s.u-s.homeU)>.5||dfloor(s)!==0) goTo(s,0,s.homeU);
  }
}

function nightlyFor(d){
  if(!d.room) return 0;
  return Math.round(90*(1+d.hearts*.16)*(1+d.room.f*.06)
    *(d.gotWish?1.35:1)*(1-soilLevel(d.room)*.3));
}
function books(){
  const occupied=S.dogs.filter(d=>d.room&&!d.leaving);
  const gross=occupied.reduce((a,d)=>a+90*(1+d.room.f*.06),0);
  const net=occupied.reduce((a,d)=>a+nightlyFor(d),0);
  const wishes=occupied.filter(d=>d.gotWish).length;
  const dirty=dirtyRooms().length;
  const beds=guestRooms().reduce((a,r)=>a+beds_(r),0);
  return {occupied,gross,net,wishes,dirty,beds,
    vac:vacancies().length,cleanBill:cleanAllCost()};
}
function beds_(r){ return r.beds||1; }

/* ----------------------------- focus on a guest ----------------------------
   Tap a resident and the camera comes in close and stays there. They stop
   wandering, turn to face you, and hold your attention until you leave. All
   the services live here, so you never lose them mid-fuss.
   ---------------------------------------------------------------------------- */
let FOCUS=null;
const ASK_LIKE={ball:'a ball to chase',treat:'a good treat',water:'fresh water',
  fire:'a fire to lie by',bell:'the sound of that bell'};
function enterFocus(d){
  if(!d||!d.room) return showCard(d);        // a guest with no room gets the check-in card
  FOCUS=d; d.focus=true; d.facing=1;
  if(!d.tgt){ d.state='watch'; d.st=999; }   // in transit? let them finish the trip
  hideCard(); closeHere();
  document.getElementById('focus').classList.add('on');
  sayBubble('');
  FSEC=null;                                 // open on the choices, not on a wall of text
  renderFocus(); aimFocus();
}
function exitFocus(){
  if(!FOCUS) return;
  FOCUS.focus=false; FOCUS.st=1; FOCUS.state='idle'; FOCUS=null;
  document.getElementById('focus').classList.remove('on');
  sayBubble('');
  const c=cur(); enterRoom(c.f,c.s);
}
function aimFocus(){
  if(!FOCUS) return;
  const d=FOCUS, l=LAY(), K=1.85;
  cam.tk=K;
  cam.tx=d.u-.5;
  const wy=(FLOORS-1-d.f)*SH+l.stand;
  const camYw=wy-(SH*.60-SH/2)/K;
  cam.ty=(FLOORS-1)+.5-camYw/SH;
}
/* ------------------------------- the bio tab -------------------------------
   Everything here is read out of state the game already keeps — nothing new is
   simulated and nothing is written. That distinction matters: the design log
   rejected the old trait system because it generated chores, and a page you
   only read cannot. Lines are picked deterministically from the dog's numbers,
   so the bio reads as a record that grows over a stay rather than a shuffle
   that changes every time you open it.
   ---------------------------------------------------------------------------- */
function nightsIn(d){ return Math.max(0,(d.nights||0)-(d.left||0)); }
function servicesToday(d){
  return Object.keys(d.did||{}).filter(k=>d.did[k]===S.day).length;
}
function bioLead(d){
  return 'A '+SIZEN[d.size]+' '+d.def.n+', '+d.char.label+'.';
}
function bioWhy(d){
  const w=WISH[d.wish];
  if(d.resident) return w.icon+' Stopped asking for anything. This is home now.';
  if(d.gotWish)  return w.icon+' Came wanting '+w.text+' — and found it here.';
  return w.icon+' Came wanting '+w.text+'. The hotel has not got one.';
}
/* the throughline: where they are in the stay, how far they have unpacked,
   what they make of you, and who they have fallen in with */
function bioStory(d){
  const out=[], n=nightsIn(d), cm=d.comfort;
  if(d.resident)   out.push('Comes and goes as they please now.');
  else if(n<=0)    out.push('Checked in today.');
  else             out.push('Night '+n+' of '+d.nights+'.');
  out.push(cm<.2?'Still on best behaviour — the room is exactly as it was found.':
           cm<.5?'Beginning to relax. The duvet has shifted.':
           cm<.8?'Has made themselves at home; a slipper has been dealt with.':
                 'Utterly at home. The room is a nest, and they are not sorry.');
  out.push(['You are still a stranger, politely tolerated.',
            'Warming to you.',
            'Pleased to see you coming down the corridor.',
            'Waits by the door when you are on this floor.',
            'Would follow you into the lift.',
            'Yours, entirely.'][Math.min(5,d.hearts)]);
  if(!d.resident&&d.stays>1)
    out.push('Has stayed '+(d.stays-1)+' time'+(d.stays>2?'s':'')+' before.');
  const pal=palName(d);
  if(pal) out.push('Inseparable from '+pal+'.');
  if(soilLevel(d.room)>.15) out.push('Would rather not mention the state of the room.');
  return out.join(' ');
}
function bioLikes(d){
  const chips=(d.likes||[]).map(k=>d.found[k]
    ? '<span class="chip">'+ASK_LIKE[k]+'</span>'
    : '<span class="chip unk">not found out yet</span>');
  return chips.join('')||'<span class="chip unk">nothing known</span>';
}
/* Their life before the door. Nothing here is a task — it is what the hearts
   were for. The heading stays vague until they have actually told you enough
   to name it, so the panel never spoils a story it has not given you. */
function bioPastTitle(d){
  return storyHeard(d).length>=2 ? 'Before here: '+storyOf(d).t : 'Before here';
}
function bioPast(d){
  const heard=storyHeard(d), out=[];
  for(const i of heard) out.push('<p class="past">&ldquo;'+storyOf(d).f[i]+'&rdquo;</p>');
  const next=storyNext(d);
  if(next>=0) out.push('<p class="past hint">Willing to tell you something. Ask them.</p>');
  else if(!d.hearts) out.push('<p class="past hint">Will not go into it with someone they have just met.</p>');
  else if(heard.length>=5) out.push('<p class="past hint">That is the lot. You have the whole of it.</p>');
  else out.push('<p class="past hint">There is more, further back. Another heart would do it.</p>');
  return out.join('');
}
function bioHTML(d){
  const st=[], add=(k,v,cls)=>st.push('<div><i>'+k+'</i><b'+
    (cls?' class="'+cls+'"':'')+'>'+v+'</b></div>');
  add('Breed',d.def.n);
  add('Visits',d.stays||1);
  add('This stay',d.resident?'lives here':nightsIn(d)+' of '+d.nights);
  add('Hearts',d.hearts?'♥'.repeat(d.hearts):'—','heart');
  add('Settled',Math.round((d.comfort||0)*100)+'%');
  add('Room',d.room?d.room.name:'—');
  add('Pals',Object.keys(d.pals||{}).length||'—');
  add('Today',servicesToday(d)+' of '+Object.keys(SERVICES).length);
  return '<p class="lead">'+bioLead(d)+'</p>'+
         '<p class="why">'+bioWhy(d)+'</p>'+
         '<p class="story">'+bioStory(d)+'</p>'+
         '<h4>'+bioPastTitle(d)+'</h4>'+bioPast(d)+
         '<h4>What you have found out</h4>'+
         '<div class="chips">'+bioLikes(d)+'</div>'+
         '<h4>The details</h4><div class="st">'+st.join('')+'</div>';
}
/* --------------------------- the dog panel --------------------------------
   A menu, not a dossier. The header carries a name, hearts and one line; every
   other fact lives inside the section it belongs to. Each row states the one
   thing that would make you open it — a mess in the room, something they are
   willing to tell you — so the collapsed panel is still worth reading, and the
   dog stays visible above it.

   Sections are declared in one table. Adding a verb later (suggesting somewhere
   to go, say) is a row here, not a redesign.
   ---------------------------------------------------------------------------- */
let FSEC=null;                              // which section is open; null = none
function svcOffers(d){
  return Object.keys(SERVICES).filter(k=>canService(d,k)).length;
}
const FSECS=[
  {k:'talk', icon:'\uD83D\uDCAC', title:'Have a word',
   sum:d=> storyNext(d)>=0 ? 'They are willing to tell you something'
         : !d.hearts        ? 'Not much for talking yet'
         : 'See how they are getting on',
   body:(d,host)=>{
     const b=document.createElement('button');
     b.id='fAsk'; b.textContent='Ask how they are getting on';
     b.onclick=askDog;
     host.appendChild(b);
   }},
  {k:'care', icon:'\uD83E\uDDB4', title:'Look after them',
   sum:d=>{
     const mess=d.room&&soilLevel(d.room)>.15, n=svcOffers(d);
     if(mess) return 'The room wants cleaning' + (n?' \u00B7 '+n+' to offer':'');
     return n ? n+' thing'+(n===1?'':'s')+' you could offer' : 'Nothing needed just now';
   },
   body:(d,host)=>{
     const acts=document.createElement('div'); acts.id='fActs';
     for(const k of Object.keys(SERVICES)){
       const sv=SERVICES[k], b=document.createElement('button');
       const ok=canService(d,k);
       b.disabled=!ok;
       b.innerHTML='<i>'+sv.icon+'</i><b>'+sv.n.split(' ')[0]+'</b><s>'+(ok?'+'+sv.base:'done')+'</s>';
       b.onclick=()=>startService(d,k);
       acts.appendChild(b);
     }
     const cost=d.room?soilCost(d.room):0, cb=document.createElement('button');
     cb.className='cleanb';
     cb.disabled=!cost||S.coins<cost;
     cb.innerHTML='<i>\uD83E\uDDFD</i><b>Clean</b><s>'+(cost?'\u2212'+cost:'tidy')+'</s>';
     cb.title='or tap each mess yourself for a small tip';
     cb.onclick=()=>{ if(d.room&&cleanRoom(d.room)){ renderFocus(); syncCoins(); saveNow(); } };
     acts.appendChild(cb);
     host.appendChild(acts);
   }},
  {k:'about', icon:'\uD83D\uDCD6', title:'About them',
   sum:d=> WISH[d.wish].icon+' wants '+WISH[d.wish].text
         + (d.resident?' \u00B7 lives here':' \u00B7 '+d.left+' night'+(d.left===1?'':'s')+' left'),
   body:(d,host)=>{ const w=document.createElement('div'); w.id='fBio';
     w.className='on'; w.innerHTML=bioHTML(d); host.appendChild(w); }}
];
function renderFocus(){
  const d=FOCUS; if(!d) return;
  document.getElementById('fName').textContent=d.name;
  document.getElementById('fHearts').textContent='\u2665'.repeat(d.hearts);
  /* One line. Everything that used to be crammed in here — the wish, the nights
     left, how settled they are, the state of the room, who they have taken to —
     now lives in the row it belongs to. */
  document.getElementById('fSub').innerHTML=
    d.def.n+' \u00B7 '+d.char.label+
    (palName(d)?' \u00B7 <span style="color:#E8807E">pals with '+palName(d)+'</span>':'');
  const list=document.getElementById('fList'); list.innerHTML='';
  for(const s of FSECS){
    const open=FSEC===s.k;
    const row=document.createElement('button');
    row.className='frow'+(open?' open':'');
    row.dataset.sec=s.k;
    row.innerHTML='<i>'+s.icon+'</i><div class="t"><b>'+s.title+'</b><em>'+
      s.sum(d)+'</em></div><span class="ch">\u203A</span>';
    row.onclick=()=>{ FSEC=open?null:s.k; renderFocus(); };
    list.appendChild(row);
    if(open){
      const body=document.createElement('div'); body.className='fbody';
      s.body(d,body);
      list.appendChild(body);
    }
  }
}
function sayBubble(txt){
  const b=document.getElementById('fBubble');
  document.getElementById('fSay').textContent=txt;
  b.classList.toggle('on',!!txt);
}
/* asking is the other way to learn a dog — kinder and slower than experimenting */
function askDog(){
  const d=FOCUS; if(!d) return;
  const all=['ball','treat','water','fire','bell'];
  const unLiked=d.likes.filter(k=>!d.found[k]);
  d.told=d.told||{};
  const unDis=all.filter(k=>!d.likes.includes(k)&&!d.told[k]);
  const lines=[];
  if(unLiked.length){
    const k=unLiked[0];
    lines.push({w:5,t:'"Between you and me, there is nothing like '+ASK_LIKE[k]+'."',
      do:()=>{ d.found[k]=1; heart(d); }});
  }
  if(unDis.length&&Math.random()<.6){
    const k=unDis[Math.floor(Math.random()*unDis.length)];
    lines.push({w:3,t:'"I could take or leave '+ASK_LIKE[k]+', honestly."',
      do:()=>{ d.told[k]=1; }});
  }
  /* history: they will go one piece further back per heart. An unheard piece
     outweighs everything else so it surfaces on the next ask or two; after that
     they are simply willing to tell you one again. */
  const sIdx=storyNext(d), sHeard=storyHeard(d);
  if(sIdx>=0){
    lines.push({w:16,t:'"'+storyOf(d).f[sIdx]+'"',
      do:()=>{ d.told=d.told||{}; d.told['s'+sIdx]=1; }});
  } else if(sHeard.length&&Math.random()<.5){
    lines.push({w:3,t:'"'+storyOf(d).f[sHeard[Math.floor(Math.random()*sHeard.length)]]+'"'});
  } else if(!d.hearts){
    lines.push({w:2,t:'"I do not really go into all that with people I have just met."'});
  }
  const met=wishMet(d,d.room);
  lines.push({w:met?3:5,t:met
    ?'"I have to say, this place suits me. '+WISH[d.wish].text.replace(/^a /,'A ')+' — perfect."'
    :'"It is lovely here. I do keep thinking about '+WISH[d.wish].text+', though."'});
  const lv=soilLevel(d.room);
  if(lv>.5) lines.push({w:8,t:'"I will say this once: somebody needs to see to the floor in here."'});
  else if(lv>.2) lines.push({w:5,t:'"There has been a small accident. I am not saying who."'});
  if(d.room.parts.includes('turf')&&lv>.1)
    lines.push({w:4,t:'"I have been using the grass, mostly. Mostly."'});
  if(d.comfort>.6) lines.push({w:3,t:'"I hope you do not mind the state of the room. I got comfortable."'});
  if(d.hearts>=3) lines.push({w:3,t:'"I always ask for this place by name, you know."'});
  if(palName(d)) lines.push({w:6,t:'"'+palName(d)+' is here, you know. We get on."'});
  if(d.stays>1) lines.push({w:2,t:'"Good to be back. It smells exactly the same. That is a compliment."'});
  lines.push({w:2,t:'"Do you think anyone would notice if I slept all afternoon?"'});
  lines.push({w:2,t:'"That lift makes a noise I have opinions about."'});
  let tot=0; for(const l of lines) tot+=l.w;
  let r=Math.random()*tot, chosen=lines[0];
  for(const l of lines){ r-=l.w; if(r<=0){ chosen=l; break; } }
  if(chosen.do) chosen.do();
  sayBubble(chosen.t);
  renderFocus();
}

document.getElementById('fX').onclick=exitFocus;

/* ---------------------- building from inside the frame ----------------------
   Standing in a bare slice, you can choose what goes there. The floor plan
   still matters for wishes, so each option says what its floor already has.
   ---------------------------------------------------------------------------- */
const hereEl=document.getElementById('here');
let hereAt=null;
function whyNot(item,f,s){
  const c=costOf(item,f);
  if(S.coins<c) return 'need '+(c-Math.round(S.coins))+' more';
  if(item.ext){
    const r=extTarget(f,s);
    if(!r) return 'needs a room to the left';
    if(r.parts.includes(item.part)) return 'already has one';
    if(r.parts.length>=6) return 'room is full';
    return null;
  }
  if(s+item.slices>SLOTS) return 'not enough width';
  for(let i=0;i<item.slices;i++) if(at(f,s+i)) return 'needs '+item.slices+' clear slots';
  if(f>0&&!S.rooms.some(r=>r.f===f-1)) return 'nothing underneath';
  return null;
}
function floorNote(item,f){
  if(item.kind==='shared') return item.note;
  if(item.ext) return item.note;
  const sh=S.rooms.filter(r=>r.f===f&&r.kind==='shared').map(r=>r.n||r.name);
  return item.note+(sh.length?' · floor has '+sh.join(', '):' · nothing shared on this floor yet');
}
function openHere(f,s){
  hereAt={f,s};
  document.getElementById('hereWhere').textContent='Floor '+f+' · slot '+s;
  const list=document.getElementById('hereList'); list.innerHTML='';
  for(const it of BUILD){
    const bad=whyNot(it,f,s);
    const price=costOf(it,f);
    const b=document.createElement('button');
    b.className='hr'+(bad?' no':'');
    b.innerHTML=`<i>${it.icon}</i><div class="t"><b>${it.n}</b>`+
      `<em>${it.ext?'extension':it.slices+' slices'} · ${floorNote(it,f)}</em></div>`+
      `<s>${bad?bad:price}</s>`;
    if(!bad) b.onclick=()=>{ closeHere(); place(it,f,s); syncCoins(); };
    list.appendChild(b);
  }
  hereEl.classList.add('on');
}
function closeHere(){ hereEl.classList.remove('on'); hereAt=null; }
document.getElementById('hereX').onclick=closeHere;

/* ------------------------- the one-handed zoom ---------------------------
   Position on the track maps to zoom LOGARITHMICALLY: equal travel is equal
   ratio, which is also what a pinch does naturally, so the two controls feel
   like the same gesture. Linear would leave the map end cramped and the room
   end sluggish.

   Grabbing the rail does not teleport the zoom to your thumb. It records the
   offset between thumb and knob and decays that to zero over ~140ms, so the
   knob comes to meet your thumb and then tracks it exactly. Both ends stay
   reachable however you grabbed it.

   It sets cam.k and nothing else. Pinch has to re-solve the camera centre
   against an anchor every frame; this does not, which is why it is the
   steadier of the two.
   ---------------------------------------------------------------------------- */
const zbar=document.getElementById('zbar'), zrail=document.getElementById('zrail'),
      zknob=document.getElementById('zknob'), zfit=document.getElementById('zfit');
let zDrag=false, zOff=0, zOff0=0, zAge=0, zY=0, zShown=-1;
const Z_CATCHUP=.16;   // seconds for the knob to come up to your thumb
const zSpan=()=>Math.log(K_SLICE/kOut());
const zT=()=>Math.max(0,Math.min(1,Math.log(cam.k/kOut())/zSpan()));
const kFromT=t=>kOut()*Math.exp(Math.max(0,Math.min(1,t))*zSpan());
function zTFromY(y){
  const r=zrail.getBoundingClientRect();        // the rail, not the whole widget
  return Math.max(0,Math.min(1,(r.bottom-y)/Math.max(1,r.height)));   // up is in
}
function zApply(){
  cam.k=clampK(kFromT(zTFromY(zY)-zOff));
  cam.tk=null;                                  // the thumb is the authority
}
zrail.addEventListener('pointerdown',e=>{
  if(FOCUS||MG.on) return;
  e.preventDefault(); e.stopPropagation();
  zrail.setPointerCapture(e.pointerId);
  zDrag=true; zY=e.clientY; zOff0=zOff=zTFromY(e.clientY)-zT(); zAge=0;
  zbar.classList.add('grabbing');
});
zrail.addEventListener('pointermove',e=>{
  if(!zDrag) return;
  e.preventDefault(); e.stopPropagation();
  zY=e.clientY; zApply();
});
function zEnd(e){
  if(!zDrag) return;
  e.stopPropagation();
  zDrag=false; zOff=0; zbar.classList.remove('grabbing');
  try{ zrail.releasePointerCapture(e.pointerId); }catch(err){}
  settle();
}
zrail.addEventListener('pointerup',zEnd);
zrail.addEventListener('pointercancel',zEnd);

const Z_NOTCH=.09;                              // about 1.27x per press
let zRep=null, zHold=null;
function zNudge(dir){
  cam.k=clampK(kFromT(zT()+dir*Z_NOTCH));
  cam.tk=null;
}
function zArrow(btn,dir){
  btn.addEventListener('pointerdown',e=>{
    if(FOCUS||MG.on) return;
    e.preventDefault(); e.stopPropagation();
    zNudge(dir);
    zHold=setTimeout(()=>{ zRep=setInterval(()=>zNudge(dir),90); },330);
  });
  const stop=e=>{
    if(e) e.stopPropagation();
    clearTimeout(zHold); clearInterval(zRep); zHold=zRep=null;
    settle();
  };
  btn.addEventListener('pointerup',stop);
  btn.addEventListener('pointercancel',stop);
  btn.addEventListener('pointerleave',stop);
}
zArrow(document.getElementById('zUp'),1);
zArrow(document.getElementById('zDn'),-1);

function zStep(dt){
  if(zDrag&&zOff!==0){
    /* Smoothstep over a fixed 160ms, NOT an exponential decay. An exponential
       sheds half the offset in the first frame, which is the teleport this
       exists to prevent; smoothstep starts at exactly zero velocity, so the
       knob visibly travels up to meet your thumb. */
    zAge+=dt;
    const u=Math.min(1,zAge/Z_CATCHUP), s=u*u*(3-2*u);
    zOff=zOff0*(1-s);
    if(u>=1) zOff=0;
    zApply();
  }
  const on=PREFS.zoomBar&&!FOCUS&&!MG.on;
  zbar.classList.toggle('off',!on);
  zbar.classList.toggle('left',PREFS.zoomSide==='left');
  if(!on) return;
  const t=zT();
  if(Math.abs(t-zShown)>.002){
    zShown=t;
    zknob.style.bottom=(t*100)+'%';
  }
  const ft=Math.max(0,Math.min(1,Math.log(fitK()/kOut())/zSpan()));
  zfit.style.bottom=(ft*100)+'%';
}

/* ------------------------------- settings --------------------------------
   The toggle cannot live inside the thing it toggles — switch the slider off
   from the slider and there is no way back. Hence a gear, which also gives
   later preferences somewhere to go. */
const optsEl=document.getElementById('opts');
function optRow(icon,title,sub,state,on){
  const b=document.createElement('button');
  b.className='hr'; b.style.borderColor=state?'rgba(226,183,106,.65)':'';
  b.innerHTML='<i>'+icon+'</i><div class="t"><b>'+title+'</b><em>'+sub+'</em></div>'+
    '<div style="font-family:Archivo Black;font-size:9.5px;letter-spacing:.1em;color:'+
    (state?'#E2B76A':'#A79A88')+'">'+(state?'ON':'OFF')+'</div>';
  b.onclick=on;
  return b;
}
function renderOpts(){
  const L=document.getElementById('optsList'); L.innerHTML='';
  L.appendChild(optRow('\u21C5','Zoom slider',
    PREFS.zoomBar?'on the '+PREFS.zoomSide:'pinch only',
    PREFS.zoomBar,()=>{ PREFS.zoomBar=!PREFS.zoomBar; savePrefs(); renderOpts(); }));
  const side=document.createElement('button');
  side.className='hr'+(PREFS.zoomBar?'':' no');
  side.innerHTML='<i>\u270B</i><div class="t"><b>Which hand</b><em>'+
    (PREFS.zoomSide==='right'?'slider on the right':'slider on the left')+
    '</em></div><div style="font-family:Archivo Black;font-size:9.5px;letter-spacing:.1em;color:#E2B76A">'+
    PREFS.zoomSide.toUpperCase()+'</div>';
  side.onclick=()=>{ if(!PREFS.zoomBar) return;
    PREFS.zoomSide=PREFS.zoomSide==='right'?'left':'right'; savePrefs(); renderOpts(); };
  L.appendChild(side);
}
function openOpts(){ renderOpts(); optsEl.classList.add('on'); }
function closeOpts(){ optsEl.classList.remove('on'); }
document.getElementById('gearBtn').onclick=()=>{
  optsEl.classList.contains('on')?closeOpts():openOpts();   // press again to close
};
document.getElementById('optsX').onclick=closeOpts;
loadPrefs();

/* --------------------------------- loop --------------------------------- */
let prev=performance.now(), acc=0; const STEP=1/60;

/* --------------------------------- menu -----------------------------------
   The sim is held while the menu or the how-to is up, so a returning player
   does not lose a night to reading. Everything is loaded by this point either
   way — Continue simply uncovers it.
   ---------------------------------------------------------------------------- */
let MENU_ON=true;
const HOW_ROWS=[
  ['\uD83D\uDD28','Build','Rooms give guests somewhere to sleep. Shared rooms — a garden, a pool, the bar — are what bring new breeds to the door and let you grant what a dog is wishing for.'],
  ['\uD83D\uDC3E','Check in','Guests wait in the lobby. Give them a room that suits them and they settle faster. Betsy will do it for you unless you would rather choose.'],
  ['\u2665','Tend','Tap a dog to sit with them. Scratch them, throw a ball, ask how they are getting on. Do it well and they warm to you.'],
  ['\u2665','Hearts','Five hearts and a dog moves in for good. They tell you a little more of where they came from with each one.']
];
const HOW_MOVE=[
  ['\u2195','Getting about','Drag to move. Pinch, or use the slider on the right, to zoom. At full zoom, swipe up or down to change floor.'],
  ['\u2317','The whole hotel','Two fingers tapped together, or the Map button, pulls back to show everything.'],
  ['\u2699','Settings','The gear moves the zoom slider to your other hand, or turns it off.']
];
function hasSave(){ try{ return !!SaveAdapter.read(); }catch(e){ return false; } }
function renderHow(){
  const b=document.getElementById('howBody'); b.innerHTML='';
  const add=(list,label)=>{
    if(label){ const h=document.createElement('div'); h.className='sub'; h.textContent=label; b.appendChild(h); }
    for(const [ic,t,d] of list){
      const r=document.createElement('div'); r.className='row';
      r.innerHTML='<i>'+ic+'</i><div><b>'+t+'</b><span>'+d+'</span></div>';
      b.appendChild(r);
    }
  };
  add(HOW_ROWS,'What you do');
  add(HOW_MOVE,'Moving around');
}
function openMenu(){
  MENU_ON=true;
  /* No explanatory text on the menu at all — Continue simply greys out when
     there is nothing to continue, and New game does its warning in the confirm
     rather than under the button. */
  const has=hasSave();
  const c=document.getElementById('mCont'), n=document.getElementById('mNew');
  c.disabled=!has;
  c.classList.toggle('go',has);
  n.classList.toggle('go',!has);
  document.getElementById('menu').classList.remove('off');
}
function closeMenu(){ MENU_ON=false; document.getElementById('menu').classList.add('off'); prev=0; }
function bindMenu(){
  document.getElementById('mCont').onclick=()=>{ if(hasSave()) closeMenu(); };
  document.getElementById('mNew').onclick=()=>{
    /* Destructive, so it asks — but only when there is something to lose. */
    if(hasSave()&&!confirm('Start a new hotel? The one you have now will be lost.')) return;
    if(hasSave()){ resetGame(); return; }
    closeMenu();
  };
  document.getElementById('mHow').onclick=()=>{
    renderHow(); document.getElementById('howto').classList.add('on'); };
  document.getElementById('howX').onclick=()=>
    document.getElementById('howto').classList.remove('on');
}
bindMenu(); openMenu();

function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-prev)/1000)); prev=now;
  // the hotel waits while the menu is up
  if(!MENU_ON){ acc+=dt; let n=0; while(acc>=STEP&&n<8){ step(STEP); acc-=STEP; n++; } }
  else acc=0;
  if(!ptrs.size&&!zDrag&&!FOCUS&&cam.tx===null){
    if(Math.abs(panV)>.0004){
      cam.cx+=panV*dt*60/16;
      cam.cx=ROOM?clampPan(cam.cx,.14):Math.max(-.5,Math.min(SLOTS-.5,cam.cx));
      panV*=Math.pow(.90,dt*60/16);
    } else panV=0;
    if(ROOM){
      const t2=clampPan(cam.cx,0);             // spring back inside the walls
      if(t2!==cam.cx){ cam.cx+=(t2-cam.cx)*Math.min(1,dt*14); panV=0;
        if(Math.abs(t2-cam.cx)<.002) cam.cx=t2; }
      const lt=lockT();                        // fades in; nothing at all below K_LOCK
      if(lt>0) cam.cy+=(ROOM.f-cam.cy)*Math.min(1,dt*14)*lt;
    }
  }
  if(!ptrs.size&&!zDrag){
    const E=1-Math.pow(.0016,dt);              // ~150ms to settle, framerate-independent
    if(cam.tx!==null&&cam.tx!==undefined){ cam.cx+=(cam.tx-cam.cx)*E;
      if(Math.abs(cam.tx-cam.cx)<.004) cam.cx=cam.tx; }
    if(cam.ty!==null&&cam.ty!==undefined){ cam.cy+=(cam.ty-cam.cy)*E;
      if(Math.abs(cam.ty-cam.cy)<.004) cam.cy=cam.ty; }
    if(cam.tk!==null&&cam.tk!==undefined){ cam.k+=(cam.tk-cam.k)*E;
      if(Math.abs(cam.tk-cam.k)<.004) cam.k=cam.tk; }
  }
  zStep(dt);
  if(FOCUS){ if(FOCUS.room&&!FOCUS.leaving) aimFocus(); else exitFocus(); }
  if(MG.on){ miniStep(dt); miniDraw(S.t); }
  try{ draw(S.t); }
  catch(err){
    if(!frame.warned){ frame.warned=true; console.warn('render fault',err); }
    // put the camera somewhere sane and carry on rather than freezing
    if(!isFinite(cam.cx)) cam.cx=1; if(!isFinite(cam.cy)) cam.cy=0;
    if(!isFinite(cam.k)||cam.k<=0) cam.k=1;
    cam.tx=cam.cx; cam.ty=cam.cy; cam.tk=cam.k;
    for(const d of allDogs()){
      if(!isFinite(d.u)) d.u=1.5;
      if(!isFinite(d.f)) d.f=0;
    }
  }
  setChrome();
  if(!isMap()) renderWhere();
  syncCoins();
  document.getElementById('cap').innerHTML=S.caption;
  if(hintT&&now>hintT){ document.getElementById('hint').classList.remove('on'); hintT=0; }
  requestAnimationFrame(frame);
}
const LOADED=loadGame();
if(LOADED){
  // the staff and the starting guests are only seeded on a fresh hotel
  say('Welcome back. Day '+S.day+'.');
} else {
  { const a=makeDog('mastiff'); a.name='Barnaby'; a.likes=['fire','treat']; a.char=CHARS[3];
    a.wish='view'; const r=guestRooms()[0]; a.room=r; r.guest=a; a.f=r.f; a.u=r.s+.5;
    a.hearts=2; a.stays=3; S.dogs.push(a); }
  for(let i=0;i<4;i++) addToLobby();
}
resize(); enterRoom(0,1);
cam.cx=(SLOTS-1)/2; cam.cy=(FLOORS-1)/2; cam.k=fitK();
cam.tx=cam.cx; cam.ty=cam.cy; cam.tk=fitK(); ROOM=null;
renderWhere(); syncCoins(); syncNav(); syncBadges();
say('');
hint(LOADED?'welcome back':'tap a room to go inside');
requestAnimationFrame(frame);
</script>
</body>
</html>
