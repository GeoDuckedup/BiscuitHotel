  #mBtns{flex:0 0 auto;width:100%;max-width:440px;display:flex;flex-direction:column;
    gap:11px;margin-top:24px}
  /* the word fills the button — nothing else lives in here */
  .mBtn{width:100%;padding:0 12px;height:clamp(58px,9.4vh,76px);border-radius:6px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:1px solid var(--line);color:var(--ink);
    font-family:'Archivo Black',system-ui,sans-serif;
    font-size:clamp(19px,5.6vw,26px);letter-spacing:-.01em;text-transform:uppercase;
    line-height:1;white-space:nowrap}
  .mBtn.go{background:var(--brass);border-color:var(--brass);color:#1A1206}
  .mBtn:disabled{opacity:.34;cursor:default}
  .mBtn:active{transform:scale(.99)}

  #howto{position:fixed;inset:0;z-index:57;background:#0D0A09;display:none;
    flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 18px) 22px calc(env(safe-area-inset-bottom) + 20px)}
  #howto.on{display:flex}
  #howto h2{font-family:'Archivo Black';font-size:20px;margin:0 0 4px;color:var(--paper)}
  #howto .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
    flex:1;margin:10px 0}
  #howto .row{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  #howto .row i{font-style:normal;font-size:21px;width:26px;text-align:center;flex:none}
  #howto .row b{display:block;font-family:'Archivo Black';font-size:13px;color:var(--paper)}
  #howto .row span{display:block;font-size:12px;line-height:1.5;color:#B9A895;margin-top:3px}

const guestRooms=()=>S.rooms.filter(r=>r.kind==='room'||r.kind==='suite');
const builtShared=()=>new Set(S.rooms.filter(r=>r.kind==='shared').map(r=>r.shared));
const unlockedBreeds=()=>{ const sh=builtShared();
  return BREEDS.filter(b=>!b.needs||sh.has(b.needs)); };
const vacancies=()=>guestRooms().filter(r=>!r.guest);
const residents=()=>S.dogs.filter(d=>d.resident);

function uniqueName(){
  const taken=new Set([...S.dogs,...S.lobby,...S.pool,...(S.staff||[])].map(d=>d.name));
  const free=NAMES.filter(n=>!taken.has(n));
  return free.length?pick(free):pick(NAMES)+' II';
}

/* --------------------------------- wishes ---------------------------------
   Mostly things this hotel can actually give them, so granting a wish is a
   regular pleasure rather than a lottery — with a minority wanting what you
   have not built yet, which is what pulls you into building it.
   ---------------------------------------------------------------------------- */
function grantableWishes(){
  const sh=builtShared(), out=[];
  for(const w of WISHES){
    if(['garden','library','pool','spa','kitchen','agility'].includes(w.k)){
      if(sh.has(w.k)) out.push(w);
    }
    else if(w.k==='turf'&&guestRooms().some(r=>r.parts.includes('turf'))) out.push(w);
    else if(w.k==='bath'&&guestRooms().some(r=>r.parts.includes('bathroom'))) out.push(w);
    else if(w.k==='view'&&guestRooms().some(r=>r.f>=2||r.parts.includes('balcony'))) out.push(w);
  }
  return out;
}
function pickWish(){
  const can=grantableWishes();
  const cant=WISHES.filter(w=>!can.includes(w));
  // about three in five want something you can give them today; the rest are
  // why you keep building
  if(can.length&&(Math.random()<.60||!cant.length)) return pick(can).k;
  return pick(cant.length?cant:WISHES).k;
}
function roomsFor(sizeIdx){
  return guestRooms().filter(r=>!r.guest&&sizeIdx<=(r.cap||1)).length;
}
/* Pick a breed that suits the rooms standing empty. Mostly guests you can
   house — with a minority you cannot, so a Suite is something to want. */
function breedForHotel(){
  const un=unlockedBreeds();
  const weighted=[];
  for(const b of un){
    const fits=roomsFor(b.size);
    const w=fits>0?6:1;                       // the odd one out still turns up
    for(let i=0;i<w;i++) weighted.push(b);
  }
  return pick(weighted.length?weighted:un);
}
function makeDog(id){
  const b=id?BY[id]:breedForHotel();
  return warmLook({id:uid++,def:b,name:uniqueName(),size:b.size,char:pick(CHARS),
    wish:pickWish(),
    likes:[...new Set([pick(['ball','treat','water','fire','bell']),
                       pick(['ball','treat','water','fire','bell'])])].slice(0,2),
    hearts:0,found:{},stays:0,f:0,u:1.5,facing:1,state:'idle',st:rnd(2,6),
    blink:rnd(1,5),wag:Math.random()*6,head:0,legs:[],tgt:null,onArrive:null,room:null,
    lobbyT:rnd(28,54),nights:0,left:0,comfort:0,gotWish:false,resident:false,
    potty:rnd(14,30),grumbled:false,pals:{},bestPal:null,with:null,meet:null,socialT:0});
}
/* Coat, build and markings are pure functions of the id. Settling them at birth
   keeps the per-frame {...d} copies in the painter from rehashing every frame. */
function warmLook(d){ coatOf(d); buildOf(d); markCol(d); tempo(d); return d; }

/* -------------------------------- demand ---------------------------------
   The hotel's reputation decides how many dogs are at the door, and it scales
   with the building: more beds means more arrivals, so a big hotel is busy and
   a small one is quiet. The lobby holds a few more than you can house, so
   there is always a choice rather than a queue of one.
   ---------------------------------------------------------------------------- */
const AVG_STAY=4.5;                  // nights, roughly
function totalBeds(){ return guestRooms().reduce((a,r)=>a+(r.beds||1),0); }
function lobbyCap(){ return Math.max(3,Math.min(8,Math.round(totalBeds()*.45)+2)); }
function demandPerDay(){
  const beds=totalBeds();
  const need=beds/AVG_STAY;                      // just enough to keep it full
  const draw=1+staffOf('concierge').length*.22   // a concierge pulls a crowd
    +S.rooms.filter(r=>r.kind==='shared').length*.10
    +Math.min(.4,S.friends.length*.05);
  return Math.max(.6,need*1.55*draw);            // a margin, so you get to choose
}
function arrivalGap(){
  const perDay=demandPerDay();
  const dayLen=16;                               // seconds of real time in a day
  return Math.max(1.6,dayLen/perDay)*rnd(.65,1.35);
}
function addToLobby(){
  if(S.lobby.length>=lobbyCap()) return;
  // anyone whose time is up comes back first, fondest first
  /* A hotel needs both: familiar faces coming back, and new ones at the door.
     Returners used to win outright, which quietly hid every breed you unlocked —
     so roughly half of arrivals are always strangers. */
  const due=S.pool.filter(x=>(x.returnIn||0)<=0).sort((a,b)=>b.hearts-a.hearts);
  const unmet=unlockedBreeds().filter(b=>
    !allDogs().some(x=>x.def.id===b.id)&&!S.pool.some(x=>x.def.id===b.id));
  let d;
  const conc=staffOf('concierge').length;
  const wantNew=unmet.length? .78 : .45+conc*.05;   // a breed you have never met jumps the queue
  if(Math.random()<wantNew||!due.length){
    d=makeDog(unmet.length&&Math.random()<.6?pick(unmet).id:null);
  } else {
    d=due[0]; S.pool=S.pool.filter(x=>x!==d);
  }
  // a returning dog wants something new most visits — it is a dog, not a standing order
  if(d.stays>0&&Math.random()<.7) d.wish=pickWish();
  d.f=0; d.u=doorU();                   // in through the revolving door, on foot
  d.room=null; d.legs=[]; d.tgt=null; d.onArrive=null;
  d.lobbyT=rnd(34,70)+d.hearts*26+(vacancies().length?24:0); d.leaving=false; d.focus=false; d.bub=null;
  S.lobby.push(d);
  goTo(d,0,lobbySpot());
}
function entryRoom(){ return S.rooms.find(r=>r.kind==='entrance'); }
function doorU(){ const e=entryRoom(); return e?e.s+.35:3.3; }
function lobbySpot(){
  const lob=S.rooms.find(r=>r.kind==='lobby');
  return lob?lob.s+.2+Math.random()*(lob.parts.length-.4):1.5;
}

function say(t){ S.caption=t; S.capT=S.t+4.6; }
function heart(d){ d.hearts=Math.min(5,d.hearts+1);
  sfx('heart',{at:d.staff?null:{f:d.f,u:d.u}});
  S.fx.push({f:d.f,u:d.u,life:1.3});
  if(d.hearts===5) say('<em>'+d.name+' has decided you are family.</em>'); }
const allDogs=()=>[...S.dogs,...S.lobby,...(S.staff||[])];

function wishMet(d,r){
  if(!r) return false;
  const sh=builtShared();
  if(['garden','library','pool','spa','kitchen','agility','diner','lounge'].includes(d.wish))
    return sh.has(d.wish);
  if(d.wish==='turf') return r.parts.includes('turf');
  if(d.wish==='bath') return r.parts.includes('bathroom');
  if(d.wish==='view') return r.f>=2||r.parts.includes('balcony');
  return false;
}
function score(r,d){ let s=-((r.cap||1)-d.size)*10+r.f*.6; if(wishMet(d,r)) s+=90; return s; }
function beds(r){ return r.beds||1; }
function bestVacancy(d){
  const v=vacancies().filter(r=>!r.guest&&d.size<=(r.cap||1));
  if(!v.length) return null;
  v.sort((a,b)=>score(b,d)-score(a,d)); return v[0];
}
function checkIn(d){
  const r=bestVacancy(d); if(!r) return false;
  S.lobby=S.lobby.filter(x=>x!==d);
  r.guest=d; d.room=r; d.stays++;
  d.nights=Math.round(rnd(3,6))+(d.resident?3:0);
  d.left=d.nights; d.gotWish=wishMet(d,r);
  if(d.gotWish&&!d.wishPaid){ d.wishPaid=true; heart(d);
    setTimeout(()=>say('<em>'+d.name+'</em> got exactly what they wanted.'),900); }
  d.comfort=Math.min(.5,d.hearts*.07+porterBoost());   // regulars and a good porter settle in faster
  S.dogs.push(d);
  goTo(d,r.f,r.s+.5);
  sfx('bell',{at:{f:0,u:d.u},gain:.8});
  say('<em>'+d.name+'</em> is checking in to '+r.name+'.');
  return true;
}

/* ------------------------------- building ------------------------------- */

/* ------------------------------- the money -------------------------------
   The doc's rule, finally implemented: what you build costs more the higher
   and the more of it you have. Income grows with the hotel, so flat prices
   turn building from "save up" into an avalanche — this keeps the cadence
   roughly steady however big you get. Coins never go below zero: a bad week
   slows you down, it never takes anything away.
   ---------------------------------------------------------------------------- */
function costOf(item,f){
  const built=S.rooms.filter(r=>r.kind===item.kind).length;
  const height=1+Math.max(0,(f||0))*.11;       // steel and lifts cost more up top
  const scarcity=Math.pow(1.10,built);         // your tenth room is dearer than your first
  return Math.round(item.cost*height*scarcity);
}
function spend(n){
  const paid=Math.min(S.coins,n);
  S.coins=Math.max(0,S.coins-n);
  return paid;
}
function freeRun(f,s,n){
  if(s+n>SLOTS) return false;
  for(let i=0;i<n;i++) if(at(f,s+i)) return false;
  if(f>0&&!S.rooms.some(r=>r.f===f-1)) return false;      // needs a floor below
  return true;
}
function extTarget(f,s){
  // an extension slot is the free slot immediately right of a guest room
  if(at(f,s)) return null;
  const left=at(f,s-1);
  if(left&&(left.room.kind==='room'||left.room.kind==='suite')
     &&left.part===left.room.parts.length-1) return left.room;
  return null;
}
function canPlace(item,f,s){
  if(S.coins<costOf(item,f)) return false;
  if(item.ext){ const r=extTarget(f,s);
    return !!r && !r.parts.includes(item.part) && r.parts.length<6; }
  return freeRun(f,s,item.slices);
}
function place(item,f,s){
  if(!canPlace(item,f,s)) return false;
  const wasMap=cam.k<.55;
  spend(costOf(item,f)); sfx('build');
  if(item.ext){
    const r=extTarget(f,s);
    r.parts.push(item.part); r.born=S.t; r._look=null;
    rebuild(); cache.clear();
    say('<em>'+item.n+'</em> added to '+r.name+'.');
    if(wasMap) hint(item.n+' added to '+r.name);
    afterBuild(); return true;
  }
  const n=guestRooms().length+1;
  const r=addRoom({f,s,parts:[...item.parts],kind:item.kind,cap:item.cap,
    shared:item.shared,style:item.style||ROOMSTYLE[(S.rooms.length)%ROOMSTYLE.length],
    name:item.kind==='shared'?'The '+item.n:(item.kind==='suite'?'Suite '+n:'Room '+n),
    born:S.t});
  if(!S.rooms.some(x=>x.f===f&&x.kind==='landing'))
    addRoom({f,s:0,parts:['lift'],style:'slate',kind:'landing',name:'Lift'});
  rebuild(); cache.clear();
  say('<em>'+r.name+'</em> built.');
  if(wasMap) hint(r.name+' built · '+S.coins.toLocaleString()+' left');
  if(item.shared) setTimeout(()=>say('New guests will start turning up — '+item.note+'.'),1500);
  if(item.shared==='lounge') setTimeout(()=>bringBooks(r),3200);
  afterBuild();
  return true;
}
function afterBuild(){
  // stay exactly where you are — building several in a row shouldn't fight the camera
  if(armed&&S.coins<armed.cost) armed=null;
  buildSig=''; renderBuild(); lastWhere=''; syncNav(); saveNow();
}


/* ---------------------------- getting about --------------------------------
   Dogs hold a continuous position in the world: `u` is their place along the
   floor in slot units, `f` is the floor and goes fractional while they are in
   the lift. They never blink out and reappear — if a dog is at the pool, you
   watched it walk there.
   ---------------------------------------------------------------------------- */
const LIFT_U=.40, LIFT_WAIT=.90, LIFT_X0=.05, LIFT_X1=.76;
const WALK_SP=.62, LIFT_SP=1.35, DOOR_DWELL=.85;
/* One car, but a taller hotel runs a bigger one — otherwise a busy tower
   gridlocks at the doors rather than merely making you wait. */
function liftCap(){ return Math.min(6,3+Math.floor(FLOORS/4)); }
const dslot=d=>Math.max(0,Math.min(SLOTS-1,Math.floor(d.u)));
const dfloor=d=>Math.max(0,Math.min(FLOORS-1,Math.round(d.f)));

/* -------------------------------- the lift ---------------------------------
   One car, three at a time. Dogs walk to the landing, wait for it, ride, and
   step out — so a busy hotel really does get a queue by the doors, and a tall
   one really does mean a longer trip.
   ---------------------------------------------------------------------------- */
S.lift={f:0,target:0,state:'idle',riders:[],doorT:0};
function nextCall(){
  const L=S.lift, here=Math.round(L.f);
  let best=null,bd=1e9;
  for(const d of L.riders){ const dd=Math.abs(d.wantF-here);
    if(dd<bd){ bd=dd; best=d.wantF; } }
  if(best!==null) return best;
  for(const d of allDogs()){
    if(d.state!=='wait') continue;
    const fl=Math.round(d.f), dd=Math.abs(fl-here);
    if(dd<bd){ bd=dd; best=fl; } }
  return best;
}
function liftDoors(){
  const L=S.lift, fl=Math.round(L.f);
  L.state='doors'; L.doorT=DOOR_DWELL;
  let moved=0;
  for(let i=L.riders.length-1;i>=0;i--){
    const d=L.riders[i];
    if(d.wantF===fl){ L.riders.splice(i,1); d.f=fl; d.u=LIFT_WAIT; nextLeg(d); moved++; }
  }
  for(const d of allDogs()){
    if(L.riders.length>=liftCap()) break;
    if((d.staff&&!d.roams)||d.state!=='wait'||Math.round(d.f)!==fl) continue;
    L.riders.push(d); d.state='ride'; d.facing=1;
    d.u=LIFT_U+(L.riders.length-1-liftCap()/2)*.10; moved++;
  }
  // silence unless someone actually came or went
  if(moved){
    sfx('ding',{at:{f:fl,u:LIFT_U}});
    setTimeout(()=>sfx('doors',{at:{f:fl,u:LIFT_U}}),150);
  }
}
function stepLift(dt){
  const L=S.lift;
  if(L.state==='doors'){
    L.doorT-=dt;
    if(L.doorT<=0) L.state='idle';
    for(const d of L.riders) d.f=L.f;
    return;
  }
  if(L.state==='moving'){
    const df=L.target-L.f, sp=LIFT_SP*dt;
    if(Math.abs(df)<=sp){ L.f=L.target; liftDoors(); }
    else L.f+=Math.sign(df)*sp;
    for(const d of L.riders) d.f=L.f;
    return;
  }
  const t=nextCall();
  if(t===null) return;
  if(t===Math.round(L.f)) liftDoors();
  else { L.target=t; L.state='moving';
    if(Math.abs(t-L.f)>1.5) sfx('lift',{at:{f:L.f,u:LIFT_U},gain:.7}); }
}
function goTo(d,f,u,then){
  d.legs=[];
  if(Math.round(d.f)!==f){
    const q=allDogs().filter(o=>o!==d&&o.state==='wait'&&Math.round(o.f)===Math.round(d.f)).length;
    d.legs.push({f:Math.round(d.f),u:LIFT_WAIT+q*.085+rnd(-.02,.02)});  // queue at the doors
    d.legs.push({f,lift:true});
  }
  d.legs.push({f,u});
  d.onArrive=then||null;
  nextLeg(d);
}
function nextLeg(d){
  if(!d.legs.length){
    d.tgt=null;
    const cb=d.onArrive; d.onArrive=null;
    if(cb) cb(d); else { d.state='idle'; d.st=rnd(2,5); }
    return;
  }
  d.tgt=d.legs.shift();
  if(d.tgt.lift){ d.state='wait'; d.wantF=d.tgt.f; d.facing=-1; }
  else d.state='walk';
}
function travel(d,dt){
  if(!d.tgt) return false;
  if(d.state==='wait'){
    d.head+=(((Math.sin(S.t*.7+d.id)>.6)?1:0)-d.head)*Math.min(1,dt*4);
    return true;                              // the car will come
  }
  if(d.state==='ride'){ d.f=S.lift.f; return true; }
  if(d.tgt.lift||d.tgt.u===undefined){       // a lift leg reached by any other path
    d.state='wait'; d.wantF=d.tgt.f; return true; }
  const du=d.tgt.u-d.u, sp=WALK_SP*tempo(d).pace*dt;
  if(Math.abs(du)>.004) d.facing=du>0?1:-1;
  if(Math.abs(du)<=sp){ d.u=d.tgt.u; nextLeg(d); }
  else d.u+=Math.sign(du)*sp;
  return true;
}


/* ------------------------------- company ---------------------------------
   Dogs notice each other. Two in the same room drift together, sniff, play or
   just settle down near one another, and the ones who keep doing it become
   pals — a relationship you did not author and cannot directly cause, which
   is exactly why it is worth having.
   ---------------------------------------------------------------------------- */
const SEEKS={sociable:1,playful:.85,nosy:.7,sleepy:.25,homebody:.15};
/* How much more likely a dog is to head for a given shared room, and how much
   more willing it is to go and say hello once it is in there. A bar that nobody
   talks in is just a room with a counter. */
const SOCIAL={diner:1.7, lounge:2.1};
const SOCIAL_KIND={lobby:.8};   // worth loitering in, but not a destination
function socialHere(d){
  const g=at(dfloor(d),dslot(d));
  if(!g||!g.room) return 1;
  return SOCIAL[g.room.shared]||SOCIAL_KIND[g.room.kind]||1;
}
const MEET={
  sniff  :{ic:'👃',t:'is having a good sniff at'},
  play   :{ic:'🎾',t:'is bouncing around'},
  settle :{ic:'☺', t:'has settled down beside'},
  chat   :{ic:'♪', t:'is passing the time with'},
  wary   :{ic:'·', t:'is keeping half an eye on'}
};
const PAL_AT=9;                       // seconds of company before they are pals
function palKey(a,b){ return a.id<b.id?a.id+'_'+b.id:b.id+'_'+a.id; }
function palName(d){ return d&&d.bestPal&&d.pals?(d.pals[d.bestPal]||null):null; }
function palDog(d){ return d&&d.bestPal?allDogs().find(o=>o.id===d.bestPal):null; }
function nearbyDogs(d,range){
  const f=dfloor(d), out=[];
  for(const o of allDogs()){
    if(o===d||o.tgt||o.state==='ride'||o.state==='wait') continue;
    if(dfloor(o)!==f) continue;
    if(Math.abs(o.u-d.u)>range) continue;
    out.push(o);
  }
  return out;
}
function beginMeet(a,b){
  if(a.with||b.with) return;
  const both=[a.char.k,b.char.k];
  let kind='chat';
  if(both.includes('playful')&&Math.random()<.6) kind='play';
  else if(both.every(k=>SEEKS[k]<.4)) kind='wary';
  else if(Math.random()<.4) kind='sniff';
  else if(Math.random()<.4) kind='settle';
  const dur=rnd(5,11);
  for(const [x,y] of [[a,b],[b,a]]){
    x.with=y; x.meet=kind; x.socialT=dur; x.legs=[]; x.tgt=null;
    x.facing=(y.u>x.u)?1:-1;
    x.state=kind==='settle'?'lie':(kind==='play'?'idle':'sit');
    x.st=dur;
  }
  if(!a.staff&&!b.staff&&Math.random()<.35) sfx('paws',{at:{f:a.f,u:a.u}});
}
function endMeet(d){
  const o=d.with;
  d.with=null; d.meet=null; d.socialT=0;
  if(o&&o.with===d){ o.with=null; o.meet=null; o.socialT=0; o.st=rnd(2,5); }
  d.st=rnd(2,5);
}
function stepSocial(dt){
  const list=allDogs();
  // keep company going, and bank the time
  for(const d of list){
    if(!d.with) continue;
    const o=d.with;
    if(!o||o.with!==d||dfloor(o)!==dfloor(d)||Math.abs(o.u-d.u)>.75){ endMeet(d); continue; }
    d.socialT-=dt;
    d.facing=(o.u>d.u)?1:-1;
    if(d.id<o.id){                       // count once per pair
      const k=palKey(d,o);
      S.bonds[k]=(S.bonds[k]||0)+dt;
      if(S.bonds[k]>=PAL_AT&&!(d.pals||{})[o.id]){
        d.pals=d.pals||{}; o.pals=o.pals||{};
        d.pals[o.id]=o.name; o.pals[d.id]=d.name;
        d.bestPal=o.id; o.bestPal=d.id;
        S.fx.push({f:d.f,u:(d.u+o.u)/2,life:1.4,ch:'♥'});
        sfx('heart');
        say('<em>'+d.name+'</em> and <em>'+o.name+'</em> have taken to each other.');
      }
    }
    if(d.socialT<=0) endMeet(d);
  }
  // notice someone new
  for(const d of list){
    if(d.with||d.tgt||d.focus||d.leaving) continue;
    if(d.state==='ride'||d.state==='wait') continue;
    d.noticeT=(d.noticeT===undefined?rnd(1,4):d.noticeT)-dt;
    if(d.noticeT>0) continue;
    d.noticeT=rnd(2.5,6);
    const seek=(d.staff?.5:SEEKS[d.char.k])*socialHere(d);
    const close=nearbyDogs(d,.42).filter(o=>!o.with&&!o.focus);
    if(close.length&&Math.random()<seek){ beginMeet(d,pick(close)); continue; }
    if(d.staff) continue;                        // staff stay at their post
    // drift over to someone a little further off — the noticing itself
    const near=nearbyDogs(d,1.6).filter(o=>!o.with&&!o.focus);
    if(near.length&&Math.random()<seek*.5){
      const o=pick(near);
      const side=o.u>d.u?-.3:.3;
      goTo(d,dfloor(d),Math.max(.2,o.u+side),dd=>{
        const c=nearbyDogs(dd,.5).filter(x=>!x.with&&!x.focus);
        if(c.length) beginMeet(dd,c[0]); else setState(dd,'idle',rnd(2,5));
      });
    }
  }
}

/* ----------------------------- behaviour ----------------------------- */
/* The lobby counts as somewhere to spend time, not only somewhere to pass
   through on the way to the lift. Maggie and Betsy are down there and it is the
   floor you look at first — it should not be the emptiest room in the hotel. */
function sharedRooms(){ return S.rooms.filter(r=>r.kind==='shared'||r.kind==='lobby'); }
function setState(d,s,dur){ d.state=s; d.st=dur||rnd(3,8); d.tgt=null; d.legs=[]; }
/* --------------------------- how they carry on ---------------------------
   Personality used to decide only who a dog would walk over to. Everything you
   could actually SEE — how it sat, how fast it crossed a room, where it settled
   — was identical for all five. These four tables are the fingerprint: they
   read with no panel open, which is the whole point of them.

   Each is nudged per dog off the id, so two sleepy dogs are not the same sleepy
   dog. Staff keep the base pace; they are working, and a slow housekeeper is a
   soil problem rather than a character note.
   ---------------------------------------------------------------------------- */
const PACE ={sociable:1.00,playful:1.22,homebody:.92,sleepy:.80,nosy:1.08};
const DWELL={sociable:.95,playful:.55,homebody:1.30,sleepy:1.75,nosy:.70};
const POSE ={sociable:[2,3.5,3],playful:[1,2,5],homebody:[4,3,2],
             sleepy:[7,1.5,1],nosy:[1.2,4,3.5]};   // weights: lie · sit · up
const SPOT ={sociable:.55,playful:.62,homebody:.22,sleepy:.12,nosy:.86}; // 0 bed → 1 far end
function tempo(d){
  if(d._tempo) return d._tempo;
  const k=(d.char&&d.char.k)||'sociable', j=(i,a)=>1+(idRand(d.id,i)-.5)*a;
  return d._tempo={
    pace : d.staff?1:(PACE[k]||1)*j(31,.16),
    dwell:(DWELL[k]||1)*j(32,.30),
    spot :Math.max(.05,Math.min(.95,(SPOT[k]===undefined?.5:SPOT[k])+(idRand(d.id,33)-.5)*.24))
  };
}
function poseFor(d){
  const w=POSE[(d.char&&d.char.k)]||[2,2,2];
  let r=Math.random()*(w[0]+w[1]+w[2]);
  if((r-=w[0])<0) return 'lie';
  return (r-=w[1])<0?'sit':'idle';
}
function holdFor(d,a,b){ return rnd(a,b)*tempo(d).dwell; }
/* where in their own room they choose to be: the sleepy one never leaves the
   bed slice, the nosy one sits at the far end watching the corridor */
function spotIn(d,room){
  const span=room.parts.length-.5;
  const t=Math.max(0,Math.min(1,tempo(d).spot+(Math.random()-.5)*.5));
  return room.s+.25+t*span;
}
function chooseIdle(d){
  if(d.focus){ d.state='watch'; d.st=999; return; }
  if(d.with) return;
  const r=Math.random();
  // nobody joins a scrum at the lift doors
  const queue=allDogs().filter(x=>x.state==='wait').length;
  const busy=queue>=liftCap()*1.5;
  const home=d.room;
  if(S.fires[key(dfloor(d),dslot(d))]&&d.likes.includes('fire')&&r<.45)
    return setState(d,'lie',rnd(10,20));
  const out={sociable:.85,playful:.78,homebody:.28,sleepy:.3,nosy:.68}[d.char.k];
  // go and find a pal if one is about
  if(home&&d.bestPal&&!busy&&r<.16){
    const pal=palDog(d);
    if(pal&&!pal.tgt&&!pal.staff&&(dfloor(pal)!==dfloor(d)||Math.abs(pal.u-d.u)>1)){
      return goTo(d,dfloor(pal),Math.max(.2,pal.u+(Math.random()<.5?-.3:.3)),dd=>{
        const c=nearbyDogs(dd,.6).filter(x=>!x.with&&!x.focus);
        if(c.length) beginMeet(dd,c[0]); else setState(dd,'idle',rnd(3,7));
      });
    }
  }
  const shared=sharedRooms();
  if(home&&shared.length&&!busy&&r<out*.26){
    /* Weighted rather than uniform: the restaurant and the bar are where dogs go
       to be among other dogs, so they should actually fill up. */
    const wts=shared.map(x=>SOCIAL[x.shared]||SOCIAL_KIND[x.kind]||1);
    let pick2=Math.random()*wts.reduce((a,b)=>a+b,0), i2=0;
    while(i2<shared.length-1&&(pick2-=wts[i2])>0) i2++;
    const sr=shared[i2];
    return goTo(d,sr.f,sr.s+.3+Math.random()*(sr.parts.length-.6),dd=>{
      setState(dd,poseFor(dd),holdFor(dd,8,20)); });
  }
  if(home&&r<.72){
    // somewhere else in their own room
    return goTo(d,home.f,spotIn(d,home),dd=>{
      setState(dd,poseFor(dd),holdFor(dd,5,13)); });
  }
  if(!home){
    return goTo(d,0,lobbySpot(),dd=>{ setState(dd,poseFor(dd),holdFor(dd,4,10)); });
  }
  const p=poseFor(d);
  return setState(d,p,p==='lie'?holdFor(d,8,15):holdFor(d,4,9));
}
function moveDog(d,dt){
  if(d.focus&&!d.tgt){ d.state='watch'; d.st=999; }
  d.blink-=dt; if(d.blink<=0) d.blink=rnd(2.2,6.5);
  const ex=(d.state==='watch'?2.4:0)+(d.state==='play'?3.4:0)+(d.state==='eat'?3:0);
  d.wag+=dt*(1.3+d.hearts*.5+ex);
  // a nosy dog keeps looking up to see who has come in
  const nosy=!d.focus&&!d.with&&d.state!=='lie'&&(d.char&&d.char.k)==='nosy';
  const look=d.state==='watch'?1:(nosy&&Math.sin(S.t*.42+d.id*1.7)>.45?1:0);
  d.head+=(look-d.head)*Math.min(1,dt*5);
  travel(d,dt);
}

/* ------------------------- the nightly turn-over -------------------------
   Stays end. A guest who was happy leaves fond of you, comes back later, and
   settles in faster each time. Nobody is ever lost: a rough stay just means a
   quiet absence for a while.
   -------------------------------------------------------------------------- */
function nightly(){
  for(const d of S.pool) if(d.returnIn!==undefined) d.returnIn-=1;
  let take=0;
  for(let i=S.dogs.length-1;i>=0;i--){
    const d=S.dogs[i];
    if(!d.room||d.leaving) continue;
    const dirt=soilLevel(d.room);
    take+=Math.round(90*(1+d.hearts*.16)*(1+d.room.f*.06)*(d.gotWish?1.35:1)*(1-dirt*.3));
    d.comfort=Math.min(1,d.comfort+(.16+(d.gotWish?.07:0)+d.hearts*.02)*(1+chefBoost())*(1-dirt*.6));
    if(--d.left<=0) checkOut(d);
  }
  const wages=payroll();
  S.coins+=take;
  const unpaid=Math.max(0,wages-S.coins);
  spend(wages);
  const bits=[];
  if(take) bits.push('+'+take);
  if(wages) bits.push('−'+wages+' wages'+(unpaid?' (short)':''));
  if(unpaid) bits.push('the staff were understanding');
  const settled=S.dogs.filter(d=>d.room&&d.gotWish).length;
  if(settled) bits.push(settled+' settled');
  const dirty=dirtyRooms().length;
  if(dirty) bits.push(dirty+' room'+(dirty>1?'s':'')+' to see to');
  if(S.lobby.length) bits.push(S.lobby.length+' waiting');
  say('<em>Day '+S.day+'</em> · '+(bits.join(' · ')||'a quiet night'));
  if(take>0) sfx('night',{gain:.5});           // only when the night earned something
}
function checkOut(d){
  const happy=d.gotWish||d.hearts>0;
  if(happy) d.hearts=Math.min(5,d.hearts+1);
  if(d.gotWish&&d.comfort>.86) d.hearts=Math.min(5,d.hearts+1);  // a really good stay
  const r=d.room;
  if(d.hearts>=5&&!d.resident){
    d.resident=true;
    if(!S.friends.includes(d)) S.friends.push(d);
    say('<em>'+d.name+' has moved in for good.</em>');
    // they live here now, so the guest room goes back into service and they
    // come and go as they please rather than occupying a bed forever
    d.left=0; d.nights=Math.round(rnd(5,9));
  }
  d.leaving=true; d.room=null; if(r) r.guest=null;
  if(FOCUS===d) exitFocus();
  goTo(d,0,doorU(),dd=>departed(dd));       // they walk out through the doors
  say(happy?d.name+' checked out, tail going.':d.name+' checked out.');
}
function departed(d){
  S.dogs=S.dogs.filter(x=>x!==d);
  d.leaving=false; d.comfort=0; d.legs=[]; d.tgt=null; d.bub=null;
  // the fonder they are, the sooner they are back — this is what closes the loop
  d.returnIn=d.resident?rnd(.4,1.2):Math.max(.5,rnd(1.2,3.2)-d.hearts*.45);
  if(d.hearts>0||Math.random()<.6) S.pool.push(d);
}

function step(dt){
  S.t+=dt; S.phase=(S.t/180)%1;
  { const lit=S.phase>.46;                       // the staff see to the fireplaces
    for(const r of S.rooms) r.parts.forEach((p,i)=>{
      if(p==='fire') S.fires[key(r.f,r.s+i)]=lit; }); }
  S.dayT+=dt;
  if(S.dayT>16){ S.dayT=0; S.day++; nightly(); saveNow(); }
  for(const d of S.lobby){
    d.lobbyT-=dt; moveDog(d,dt);
    if(d.tgt) continue;
    d.st-=dt;
    if(d.st<=0){
      if(Math.random()<.5) goTo(d,0,lobbySpot(),dd=>setState(dd,pick(['idle','sit']),rnd(4,9)));
      else setState(d,pick(['idle','sit','lie']),rnd(4,9));
    }
  }
  for(let i=S.lobby.length-1;i>=0;i--) if(S.lobby[i].lobbyT<=0){
    const g=S.lobby.splice(i,1)[0]; S.pool.push(g);
    say(g.name+' has wandered off. Someone else will be along.'); }
  S.rotate-=dt;
  if(S.rotate<=0){
    S.rotate=arrivalGap();
    addToLobby();
    // a big hotel gets more than one at a time when it is busy
    if(vacancies().length>2&&Math.random()<.45) addToLobby();
  }
  // the desk fills vacancies on its own, picking whoever fits best
  if(S.auto&&canAutoCheckIn()){
    S.autoT-=dt;
    if(S.autoT<=0){
      S.autoT=Math.max(.5,1.6-staffOf('reception').length*.5);
      if(vacancies().length&&S.lobby.length){
        let best=null,bs=-1e9;
        for(const g of S.lobby){ const v=bestVacancy(g);
          if(!v) continue;
          const sc=score(v,g)+g.hearts*40;      // fond guests get first refusal
          if(sc>bs){ bs=sc; best=g; } }
        if(best) checkIn(best);
      }
    }
  }
  for(const d of S.dogs){
    moveDog(d,dt);
    if(d.room&&!d.leaving){
      d.potty-=dt;
      if(d.potty<=0){ d.potty=rnd(16,34)*(d.room.parts.includes('bathroom')?1.7:1); addSoil(d); }
      const lv=soilLevel(d.room);
      if(lv>=.5&&!d.grumbled){ d.grumbled=true;
        say('<em>'+d.name+'</em> would rather not discuss the state of the room.'); }
    }
    if(d.tgt) continue;
    d.st-=dt;
    if(d.st<=0) chooseIdle(d);
  }
  stepLift(dt);
  stepStaff(dt);
  stepStaffSystem(dt);
  stepKeepers(dt);
  stepSocial(dt);
  stepAudio(dt);
  stepBubbles(dt);
  for(let i=S.fx.length-1;i>=0;i--){ S.fx[i].life-=dt; if(S.fx[i].life<=0) S.fx.splice(i,1); }
  if(S.t>S.capT&&cam.k>.8){
    const c=cur(), here=allDogs().filter(d=>dfloor(d)===c.f&&dslot(d)===c.s&&!d.tgt);
    if(here.length){ const d=here[0];
      if(d.with){ const m=MEET[d.meet]||MEET.chat;
        S.caption=d.name+' '+m.t+' '+d.with.name+'.'; }
      else{
      const L={idle:'is standing about',walk:'is on the move',lift:'is in the lift',
        sit:'has sat down',lie:'is stretched out',watch:'is looking right at you',
        play:'has the ball',eat:'took that very gently'};
      S.caption=d.name+' '+(L[d.state]||'is here')+(d.room?'.':' — waiting in the lobby.'); }
    } else S.caption=''; }
}

/* -------------------------------- canvas -------------------------------- */
const cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,SH=0; const BARH=116;
/* --------------------------- the play area -------------------------------
   A room slice is W wide and SH tall in world units, and the art inside is laid
   out in fractions of both. When W and SH were simply the window, the slice took
   the window's shape: on a wide desktop every room, every stick of furniture and
   the whole map stretched sideways. The play area is now the largest rectangle
   of PLAY_AR that fits, letterboxed and centred, so the art has ONE shape on
   every device. On a phone the loss is a few pixels; on a monitor it is the
   difference between a hotel and a smear.
   ---------------------------------------------------------------------------- */
/* A room slice is W wide by SH tall, and its art is laid out in fractions of
   both — so when W was simply the window, a wide desktop window stretched every
   room sideways. W is capped at MAX_AR of the height and the canvas is centred,
   with OX the offset.

   Only the WIDTH is capped, deliberately. An earlier attempt letterboxed both
   axes to a fixed ratio, which put bars on tall phones too. A phone is already
   narrower than the cap, so this changes nothing on one; it only stops a desktop
   window from getting wider than a game screen ought to be. */
const MAX_AR=.62;
let OX=0;

/* Portrait only on phones. The lock API is attempted because it genuinely works
   in an installed PWA or fullscreen; everywhere else it throws and we fall back
   to covering the screen. Desktop is never covered — a wide window there is
   normal, and the width cap already handles it. */
const coarse=()=>{ try{ return matchMedia('(pointer:coarse)').matches; }catch(e){ return false; } };
function tryLockPortrait(){
  try{
    if(screen&&screen.orientation&&screen.orientation.lock)
      screen.orientation.lock('portrait').catch(()=>{});
  }catch(e){}
}
function checkOrient(){
  const sideways=coarse()&&innerWidth>innerHeight;
  document.getElementById('rotate').classList.toggle('on',sideways);
  return sideways;
}
addEventListener('orientationchange',()=>setTimeout(checkOrient,120));
function resize(){ DPR=Math.min(devicePixelRatio||1,2.5);
  H=innerHeight; SH=H-BARH;
  W=Math.min(innerWidth,Math.round(SH*MAX_AR));
  OX=Math.round((innerWidth-W)/2);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px'; cv.style.left=OX+'px';
  document.documentElement.style.setProperty('--ox',OX+'px');
  ctx.setTransform(DPR,0,0,DPR,0,0); cache.clear(); checkOrient(); }
addEventListener('resize',resize);
const LAY=()=>({ceil:SH*.05,wallB:SH*.66,stand:SH*.80,bot:SH});
function rr2(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2);
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); g.stroke(); }
function rr(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2);
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); g.fill(); }
function rrp(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2);
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }


/* --------------------------- room character ------------------------------
   Every room gets a seed from its id, so no two are twins: the wallpaper
   pattern, how warm the walls are, where the rug sits and which pictures
   hang are all decided once and stay put.
   ---------------------------------------------------------------------------- */
function roomRand(room){
  let sd=(room.id*2654435761)>>>0;
  return ()=>(sd=(sd*1664525+1013904223)>>>0)/4294967296;
}
function shiftHex(hex,dl,ds){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g2=(n>>8)&255,b=n&255;
  const mx=Math.max(r,g2,b),mn=Math.min(r,g2,b);
  let h,s,L=(mx+mn)/510;
  const dd=(mx-mn)/255;
  s=dd===0?0:dd/(1-Math.abs(2*L-1));
  if(dd===0) h=0;
  else if(mx===r) h=((g2-b)/255/dd)%6;
  else if(mx===g2) h=(b-r)/255/dd+2;
  else h=(r-g2)/255/dd+4;
  h*=60; if(h<0) h+=360;
  L=Math.max(.04,Math.min(.92,L+dl)); s=Math.max(0,Math.min(1,s+ds));
  return `hsl(${h.toFixed(0)} ${(s*100).toFixed(0)}% ${(L*100).toFixed(0)}%)`;
}
const WALLPAPER=['plain','stripe','damask','panelled','check'];
function roomLook(room){
  if(room._look) return room._look;
  const r=roomRand(room), st=STYLES[room.style];
  const look={
    paper:WALLPAPER[Math.floor(r()*WALLPAPER.length)],
    wall:shiftHex(st.wall,(r()-.5)*.09,(r()-.5)*.12),
    hi:shiftHex(st.hi,(r()-.5)*.09,(r()-.5)*.10),
    pan:shiftHex(st.pan,(r()-.5)*.07,0),
    rug:shiftHex(st.rug,(r()-.5)*.12,(r()-.5)*.14),
    rugD:shiftHex(st.rugD,(r()-.5)*.10,0),
    floor:shiftHex(st.floor,(r()-.5)*.08,(r()-.5)*.08),
    bed:['#B8896B','#8E6E7E','#6E7E8E','#8E8464','#7E6E5E'][Math.floor(r()*5)],
    quilt:['#D9C6A4','#C6B4C4','#B4C4CC','#CCC4A4','#D2B8A8'][Math.floor(r()*5)],
    rugAt:.02+r()*.06,
    pics:1+Math.floor(r()*3),
    picY:r(),
    lamp:r()<.5
  };
  room._look=look; return look;
}
function paper(g,look,x,y,w,h,st){
  g.fillStyle='rgba(255,255,255,.045)';
  if(look.paper==='stripe'){
    for(let px=x;px<x+w;px+=17) g.fillRect(px,y,7,h);
  } else if(look.paper==='check'){
    for(let px=x;px<x+w;px+=26) for(let py=y;py<y+h;py+=26) g.fillRect(px,py,13,13);
  } else if(look.paper==='damask'){
    g.fillStyle='rgba(255,255,255,.05)';
    for(let px=x+13;px<x+w;px+=34) for(let py=y+11;py<y+h;py+=30){
      g.beginPath(); g.ellipse(px,py,5,8,0,0,7); g.fill(); }
  } else if(look.paper==='panelled'){
    g.strokeStyle='rgba(255,255,255,.07)'; g.lineWidth=1.5;
    for(let px=x+12;px<x+w-24;px+=64) g.strokeRect(px,y+10,48,Math.max(10,h-22));
  }
}
function paintShell(g,room,RW){
  const l=LAY(), st=STYLES[room.style], lk=roomLook(room);
  const inset=Math.min(26,RW*.02);            // the far wall sits back from the cut
  // ceiling and its cornice
  g.fillStyle='#1C2422'; g.fillRect(0,0,RW,l.ceil);
  g.fillStyle='#2A3230'; g.fillRect(0,l.ceil-3,RW,3);

  // --- back wall: a plane set into the room, so there is a far side ---
  const wg=g.createLinearGradient(0,l.ceil,0,l.wallB);
  wg.addColorStop(0,lk.hi); wg.addColorStop(1,lk.wall);
  g.fillStyle=wg; g.fillRect(0,l.ceil,RW,l.wallB-l.ceil);
  paper(g,lk,0,l.ceil,RW,l.wallB-l.ceil,st);
  // the returns: side walls catching a little more light
  const rg=g.createLinearGradient(0,l.ceil,0,l.wallB);
  rg.addColorStop(0,'rgba(255,240,210,.07)'); rg.addColorStop(1,'rgba(0,0,0,.16)');
  g.fillStyle=rg; g.fillRect(0,l.ceil,RW,inset*.5);
  g.fillStyle='rgba(0,0,0,.20)'; g.fillRect(0,l.ceil,RW,4);

  // wainscot
  const wy=l.wallB-(l.wallB-l.ceil)*.34;
  g.fillStyle=lk.pan; g.fillRect(0,wy,RW,l.wallB-wy);
  g.fillStyle=st.trim; g.fillRect(0,wy-4,RW,5);
  g.fillStyle='rgba(255,236,200,.14)'; g.fillRect(0,wy-4,RW,1.5);
  for(let x=10;x<RW-10;x+=54){
    g.fillStyle='rgba(255,255,255,.05)'; g.fillRect(x,wy+9,44,l.wallB-wy-19);
    g.fillStyle='rgba(30,18,10,.26)'; g.fillRect(x+3,wy+12,38,l.wallB-wy-25); }
  g.fillStyle=st.trim; g.fillRect(0,l.ceil+(l.wallB-l.ceil)*.10,RW,3);
  g.fillStyle='rgba(255,236,200,.12)'; g.fillRect(0,l.ceil+(l.wallB-l.ceil)*.10,RW,1);

  // skirting where wall meets floor
  g.fillStyle=st.trim; g.fillRect(0,l.wallB-6,RW,6);
  g.fillStyle='rgba(255,236,200,.14)'; g.fillRect(0,l.wallB-6,RW,1.5);
  g.fillStyle='rgba(16,10,4,.5)'; g.fillRect(0,l.wallB,RW,2);

  // --- floor ---
  g.fillStyle=lk.floor; g.fillRect(0,l.wallB,RW,l.bot-l.wallB);
  const fg=g.createLinearGradient(0,l.wallB,0,l.bot);
  fg.addColorStop(0,'rgba(0,0,0,.30)'); fg.addColorStop(.5,'rgba(0,0,0,0)');
  fg.addColorStop(1,'rgba(0,0,0,.16)');
  g.fillStyle=fg; g.fillRect(0,l.wallB,RW,l.bot-l.wallB);
  g.strokeStyle='rgba(56,34,18,.30)'; g.lineWidth=1;
  for(let i=1;i<7;i++){ const y=l.wallB+(l.bot-l.wallB)*(i/7);
    g.beginPath(); g.moveTo(0,y); g.lineTo(RW,y); g.stroke(); }
  for(let x=-40;x<RW+40;x+=64){ g.beginPath();
    g.moveTo(x,l.wallB); g.lineTo(x-26,l.bot); g.stroke(); }

  // runner rug, offset a little differently in every room
  const ry=l.stand-8, rh=(l.bot-l.stand)*1.5, ins=RW*lk.rugAt;
  g.fillStyle=lk.rugD;
  g.beginPath(); g.moveTo(ins,ry); g.lineTo(RW-ins,ry);
  g.lineTo(RW-ins*.4,ry+rh); g.lineTo(ins*.4,ry+rh); g.closePath(); g.fill();
  g.fillStyle=lk.rug;
  g.beginPath(); g.moveTo(ins+8,ry+4); g.lineTo(RW-ins-8,ry+4);
  g.lineTo(RW-ins*.4-8,ry+rh-5); g.lineTo(ins*.4+8,ry+rh-5); g.closePath(); g.fill();
  g.fillStyle='rgba(255,255,255,.05)';
  g.fillRect(ins+14,ry+9,RW-ins*2-28,2);

  // pictures, hung at a height chosen per room

function withSize(w,h,fn){ const ow=W,oh=SH; W=w; SH=h; try{ fn(); } finally { W=ow; SH=oh; } }

/* ---------------------------- the mip chain -------------------------------
   A room repainted at a smaller width comes back with its proportions changed:
   horizontal sizes are fractions of W so they survive the round trip exactly,
   while vertical sizes are absolute pixels, so they do not shrink and then get
   scaled up anyway. Furniture ends up taller relative to the room the further
   out you are — which is precisely what keeps it readable when it is small.

   That was worth keeping but it only had two rungs, so the change arrived as a
   switch. There are five now, blended between, and which rung you are on comes
   from a curve rather than a threshold. EX_P is the dial: 0 would be no
   exaggeration at all, 1 would hold furniture at a constant size on screen.

   Note this cannot be done by baking once and stretching a "furniture layer".
   The split is not shell versus furniture, it is fractional versus absolute
   units, and those are mixed inside single painters — `play` uses W*.24 and a
   literal 22 on adjacent lines. Repainting gets that split right for free.
   ---------------------------------------------------------------------------- */
const MIPS=[1.0,.82,.64,.48,.35];          // paint width, as a fraction of W
const EX_MAX=1/MIPS[MIPS.length-1], EX_P=.55;
const exagg=k=>Math.max(1,Math.min(EX_MAX,Math.pow(1/Math.max(k,.001),EX_P)));
/* Dogs need far less of this than the rooms do. Furniture is flat detail that
   disappears when it shrinks; a dog is a solid silhouette that still reads at a
   few pixels, so giving it the full 2.86x made it tower over the room it was
   standing in. This is a much shallower curve with a hard ceiling — enough that
   a dog is not a speck from far out, not enough to be the thing you notice.
   Set DOG_EX_MAX to 1 to turn it off entirely. */
const DOG_EX_MAX=1.35, DOG_EX_P=.40;
const dogEx=k=>Math.max(1,Math.min(DOG_EX_MAX,Math.pow(exagg(k),DOG_EX_P)));
function mipFor(k){
  const ex=exagg(k);
  let i=0;
  while(i<MIPS.length-2&&1/MIPS[i+1]<ex) i++;
  const e0=1/MIPS[i], e1=1/MIPS[i+1];
  const t=Math.max(0,Math.min(1,(Math.log(ex)-Math.log(e0))/(Math.log(e1)-Math.log(e0))));
  return {a:i,b:i+1,t};
}
const cache=new Map();
/* Crossing a rung means every visible cell wants a canvas it has not got, and
   doing them all in one frame is a hitch mid-pinch. At most BAKE_BUDGET are
   painted per frame; anything over budget borrows the nearest rung it already
   has for a frame or two. The borrowed rung is a slightly different stretch,
   which nobody can see, and the right one arrives within a few frames. */
let bakes=0; const BAKE_BUDGET=6;
function mipCanvas(f,s,lv){
  const g0=at(f,s);
  const base=(g0?g0.room.id+'/'+g0.part:'bare'+f)+'/'+(S.phase>.58?'n':'d')+'/';
  const kk=base+lv+'/'+W;
  let c=cache.get(kk);
  if(c){ cache.delete(kk); cache.set(kk,c); return c; }
  if(bakes>=BAKE_BUDGET){
    for(let dd=1;dd<MIPS.length;dd++)
      for(const alt of [lv-dd,lv+dd]){
        if(alt<0||alt>=MIPS.length) continue;
        const o=cache.get(base+alt+'/'+W);
        if(o) return o;
      }
  }
  bakes++;   // keep it, least-recent first
  const pw=Math.max(24,Math.round(W*MIPS[lv])), ph=Math.max(24,Math.round(pw*(SH/W)));
  const res=Math.min(2,DPR);
  c=document.createElement('canvas');
  c.width=Math.round(pw*res); c.height=Math.round(ph*res);
  const g=c.getContext('2d'); g.setTransform(res,0,0,res,0,0);
  withSize(pw,ph,()=>{
    if(!g0) paintBare(g,f);
    else { const RW=g0.room.parts.length*pw;
      g.save(); g.translate(-g0.part*pw,0); paintShell(g,g0.room,RW); g.restore();
      paintPart(g,g0.room,g0.part); }
  });
  if(cache.size>72) cache.delete(cache.keys().next().value);
  cache.set(kk,c); return c;
}

/* ------------------------------ dog puppet ------------------------------ */
/* ------------------------------ coat variation -----------------------------
   A breed used to be a single hex, so every retriever in the building was the
   same dog painted twice. The coat now drifts per guest — warmer or cooler, a
   shade lighter or darker — seeded from the dog's id. The id is saved, so an
   individual keeps their coat across sessions without anything new being
   stored: rooms already derive their look from their own id, and this is the
   same trick applied to the guests. Drift is deliberately narrow and never
   rotates hue, so the palette stays earthy and a labrador stays a labrador.
   ---------------------------------------------------------------------------- */
function coatOf(d){
  if(d._coat) return d._coat;
  let h=Math.imul((d.id|0)+0x9E3779B9,0x85EBCA6B);
  h^=h>>>13; h=Math.imul(h,0xC2B2AE35); h^=h>>>16;
  const warm=(((h>>>0)/4294967296)-.5)*2;       // -1..1, ruddy through to ashy
  const lift=1+((((h>>>8)&1023)/1023)-.5)*.24;  // .88..1.12, lighter or darker
  const n=parseInt(d.def.col.slice(1),16);
  const cl=x=>Math.max(18,Math.min(250,Math.round(x)));
  const r=cl(((n>>16)&255)*lift+warm*11),
        gg=cl(((n>>8)&255)*lift+warm*2),
        b=cl((n&255)*lift-warm*10);
  return d._coat='#'+((1<<24)|(r<<16)|(gg<<8)|b).toString(16).slice(1);
}
/* ------------------------- the individual dog ----------------------------
   Two beagles should not be the same beagle. Breed decides the kind of dog;
   everything here decides *which* one. It is all derived from the dog's id and
   memoised on underscore fields, so none of it is saved, none of it needs a
   schema bump, and all of it survives a reload — the same trick coatOf() uses.
   ---------------------------------------------------------------------------- */
function idRand(id,i){
  let h=Math.imul((id|0)+0x9E3779B9+Math.imul(i|0,0x7F4A7C15),0x85EBCA6B);
  h^=h>>>13; h=Math.imul(h,0xC2B2AE35); h^=h>>>16;
  return (h>>>0)/4294967296;
}
const MARKS=['saddle','socks','blaze','patch','bib','tailtip','muzzle','ears'];
function buildOf(d){
  if(d._bld) return d._bld;
  const D=d.def, r=i=>idRand(d.id,i), j=(i,a)=>1+(r(i)-.5)*2*a;
  const b={ len:j(1,.09), ht:j(2,.075), leg:j(3,.11), snout:j(4,.13),
            fluff:j(5,.16), scale:j(6,.075), wag:.78+r(7)*.55 };
  /* Some breeds are their markings — a bernese without a blaze and white feet
     is just a black dog. Those rows pin the set; everyone else rolls for it.
     The individual layer still varies their proportions, shade and tempo, so
     two bernese are no more alike than two beagles. */
  if(D.marks){ b.marks=D.marks.slice(); return d._bld=b; }
  // a third are plain; the rest carry one marking, a few carry two
  const n=r(8)<.32?0:(r(9)<.62?1:2);
  const pool=MARKS.filter(m=>
    m==='socks'   ? D.leg>.55 :          // nothing to put a sock on, on a basset
    m==='tailtip' ? (D.tail!=='curl'&&D.tail!=='bob') :  // no tip to speak of on either
    true);
  const marks=[];
  for(let i=0;i<n;i++){
    const c=pool.filter(m=>marks.indexOf(m)<0);
    marks.push(c[Math.min(c.length-1,Math.floor(r(10+i)*c.length))]);
  }
  b.marks=marks;
  return d._bld=b;
}
function dscale(d){ return d.def.scale*buildOf(d).scale; }
/* Markings go darker than the coat, or lighter — but never a shade that
   vanishes into it, so a white samoyed always marks dark and a black lab light. */
function markCol(d){
  if(d._mkc) return d._mkc;
  const n=parseInt(coatOf(d).slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const lum=(.299*r+.587*g+.114*b)/255;
  const dark = lum>.70 ? true : lum<.30 ? false : idRand(d.id,13)<.55;
  if(dark){ r*=.50; g*=.48; b*=.48; }
  else { r+=(246-r)*.74; g+=(238-g)*.74; b+=(222-b)*.74; }
  const cl=x=>Math.max(14,Math.min(252,Math.round(x)));
  return d._mkc='#'+((1<<24)|(cl(r)<<16)|(cl(g)<<8)|cl(b)).toString(16).slice(1);
}

/* ------------------------------ histories -------------------------------
   Every dog had a life before the revolving door. Which life is decided by
   the id, so it costs nothing to save and never changes on them. How much of
   it you get is decided by hearts: one piece per heart, so a dog you have
   only just met will tell you the first line and stop.

   Deliberately NOT a system. There is nothing to satisfy, nothing to collect
   against a target, nothing that goes wrong if you never ask. It is the
   reward for affection you were earning anyway — which is why it hangs off
   hearts rather than off a counter of its own.

   Which pieces have been heard rides in d.told, the same free-form object the
   likes already use, so none of this needed a schema bump either.
   No humans anywhere: the bakery, the ferry and the reading room were all
   run by dogs, same as the hotel.
   ---------------------------------------------------------------------------- */

function storyOf(d){
  return d._story||(d._story=STORIES[Math.floor(idRand(d.id,21)*STORIES.length)%STORIES.length]);

function storyNext(d){
  const n=storyOpen(d), t=d.told||{};
