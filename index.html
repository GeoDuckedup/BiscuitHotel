function storyOf(d){
  return d._story||(d._story=STORIES[Math.floor(idRand(d.id,21)*STORIES.length)%STORIES.length]);
}
/* one piece per heart — the fonder they are, the further back they will go */
function storyOpen(d){ return Math.max(0,Math.min(5,d.hearts|0)); }
function storyNext(d){
  const n=storyOpen(d), t=d.told||{};
  for(let i=0;i<n;i++) if(!t['s'+i]) return i;
  return -1;
}
function storyHeard(d){
  const t=d.told||{}, out=[];
  for(let i=0;i<storyOpen(d);i++) if(t['s'+i]) out.push(i);
  return out;
}
function drawDog(g,d,cx,baseY,scale,t,outline){
  if(outline===undefined) outline=true;
  const D=d.def,B=buildOf(d),M=B.marks,mc=markCol(d),has=k=>M.indexOf(k)>=0;
  const s=scale*D.scale*B.scale;
  const P={len:D.len*B.len, ht:D.ht*B.ht, leg:D.leg*B.leg, snout:D.snout*B.snout,
           fluff:Math.max(0,Math.min(1,D.fluff*B.fluff)), tail:D.tail, ear:D.ear};
  const bodyL=52*P.len*s,bodyH=26*P.ht*s,legL=20*P.leg*s,st=d.state,gait=tempo(d).pace;
  const lying=st==='lie', sitting=st==='sit'||st==='watch';
  const walking=['walk','leave','enter'].includes(st);
  g.save(); g.translate(cx,baseY); g.scale(d.facing,1);
  const put=(col,mark)=>{ g.fillStyle=col;
    let bY,tilt=0;
    if(lying) bY=-bodyH*.62; else if(sitting){ bY=-legL*.55-bodyH*.9; tilt=-.22; }
    else bY=-legL-bodyH;
    if(!lying){ const sw=walking?Math.sin(t*7*gait)*4*s:0; g.save(); g.translate(-bodyL*.34,0);
      const ly=sitting?-legL*.5:-legL, lh=sitting?legL*.5:legL;
      /* The involuntary hind-leg kick. Driven from outside via d.kick (0..1) so
         it lives in the puppet and gets the outline pass like everything else,
         rather than being painted over the top by whoever wants it. */
      if(d.kick>0){ g.translate(0,ly); g.rotate(Math.sin(t*(7+d.kick*17))*.5*d.kick);
        g.translate(0,-ly); }
      g.fillRect(-3*s+sw,ly,6.5*s,lh);
      if(mark&&has('socks')){ g.fillStyle=mc;
        g.fillRect(-3*s+sw,ly+lh*.62,6.5*s,lh*.38); g.fillStyle=col; }
      g.restore(); }
    g.save(); g.translate(0,bY); g.rotate(tilt);
    rr(g,-bodyL/2,0,bodyL,bodyH,bodyH*.44);
    if(P.fluff>.35) rr(g,bodyL*.04,-2*s,bodyL*.44,bodyH+3*s,bodyH*.42);
    if(mark&&(has('saddle')||has('bib'))){
      g.save(); rrp(g,-bodyL/2,0,bodyL,bodyH,bodyH*.44); g.clip(); g.fillStyle=mc;
      if(has('saddle')) rr(g,-bodyL*.44,-bodyH*.12,bodyL*.68,bodyH*.70,bodyH*.30);
      if(has('bib'))    rr(g,bodyL*.16,bodyH*.32,bodyL*.36,bodyH*.90,bodyH*.28);
      g.restore(); g.fillStyle=col; }
    g.restore();
    if(!lying){ const sw=walking?Math.sin(t*7*gait+Math.PI)*4*s:0; g.save(); g.translate(bodyL*.30,0);
      g.fillRect(-3*s-sw,-legL,6.5*s,legL);
      if(mark&&has('socks')){ g.fillStyle=mc;
        g.fillRect(-3*s-sw,-legL*.38,6.5*s,legL*.38); g.fillStyle=col; }
      g.restore(); }
    else g.fillRect(bodyL*.22,-8*s,12*s,7*s);
    const tA=Math.sin(d.wag*2.6)*(.5+d.hearts*.07)*B.wag;
    g.save(); g.translate(-bodyL*.48,bY+bodyH*.3);
    if(P.tail==='bob'){                      // a stub, and it still wags
      g.rotate(-.85+tA*.5);
      rr(g,-3.2*s,-9*s,6.6*s,10*s,3.2*s);
    } else if(P.tail==='curl'){              // a real curl over the back
      g.rotate(-.30+tA*.55);
      const R=7.4*s, r2=3.7*s, a0=Math.PI*.86, a1=Math.PI*2.24;
      g.beginPath();
      g.arc(0,-8*s,R,a0,a1,false);
      g.arc(0,-8*s,r2,a1,a0,true);
      g.closePath(); g.fill();
    } else {
      g.rotate(P.tail==='up'?-1.1+tA:P.tail==='down'?.5+tA*.4:-.5+tA);
      if(P.fluff>.5){ rr(g,-4*s,-16*s,8*s,18*s,4*s);
        if(mark&&has('tailtip')){ g.fillStyle=mc; rr(g,-4*s,-16*s,8*s,7*s,3.5*s); g.fillStyle=col; } }
      else { g.fillRect(-2.6*s,-15*s,5*s,16*s);
        if(mark&&has('tailtip')){ g.fillStyle=mc; g.fillRect(-2.6*s,-15*s,5*s,6*s); g.fillStyle=col; } }
    }
    g.restore();
    const hx=bodyL*.42,hy=bY-bodyH*.30,ht=-d.head*.30+(st==='eat'?.85:0);
    g.fillRect(hx-5*s,hy+2*s,11*s,bodyH*.8);
    g.save(); g.translate(hx+7*s,hy); g.rotate(ht);
    rr(g,-9*s,-11*s,21*s,19*s,7*s);
    if(mark&&(has('blaze')||has('patch'))){
      g.save(); rrp(g,-9*s,-11*s,21*s,19*s,7*s); g.clip(); g.fillStyle=mc;
      if(has('blaze')) rr(g,3.5*s,-11*s,5.5*s,13*s,2.2*s);
      if(has('patch')){ g.beginPath(); g.arc(6*s,-2.6*s,6.2*s,0,7); g.fill(); }
      g.restore(); g.fillStyle=col; }
    g.fillStyle=(mark&&has('muzzle'))?mc:col;
    g.fillRect(10*s,-2*s,12*s*P.snout,9*s);
    g.fillStyle=(mark&&has('ears'))?mc:col;
    if(P.ear==='up'){ g.beginPath(); g.moveTo(-4*s,-9*s); g.lineTo(1*s,-22*s);
      g.lineTo(7*s,-9*s); g.closePath(); g.fill(); }
    else if(P.ear==='semi'){                 // pricked, with the tip tipped forward
      g.beginPath(); g.moveTo(-4*s,-9*s); g.lineTo(-1.5*s,-20*s);
      g.lineTo(8.5*s,-14.5*s); g.lineTo(7*s,-9*s); g.closePath(); g.fill(); }
    else if(P.ear==='drop') rr(g,-8*s,-6*s,10*s,(17+P.fluff*7)*s,5*s);
    else rr(g,-5*s,-5*s,9*s,8*s,4*s);
    g.fillStyle=col;
    g.restore(); };
  if(outline){ g.save();
    for(let dx=-2;dx<=2;dx++) for(let dy=-2;dy<=2;dy++){
      if(dx*dx+dy*dy>5) continue;
      g.save(); g.translate(dx,dy); put('#FFF8EC'); g.restore(); }
    g.restore(); }
  put(coatOf(d),true);
  { const bY=lying?-bodyH*.62:sitting?-legL*.55-bodyH*.9:-legL-bodyH;
    const hx=bodyL*.42,hy=bY-bodyH*.30,ht=-d.head*.30+(st==='eat'?.85:0);
    g.save(); g.translate(hx+7*s,hy); g.rotate(ht);
    g.fillStyle='#20160F';
    if(d.blink<.12) g.fillRect(4*s,-3*s,5*s,1.4*s);
    else { g.beginPath(); g.arc(6*s,-2.5*s,2.1*s,0,7); g.fill();
      if(d.head>.5){ g.beginPath(); g.arc(0,-1*s,1.7*s,0,7); g.fill(); } }
    g.fillStyle='#2A1C14'; g.beginPath();
    g.arc(10*s+12*s*P.snout,1.5*s,2.4*s,0,7); g.fill(); g.restore(); }
  if(d.staff&&d.role) drawUniform(g,d,s,bodyL,bodyH,legL,lying,sitting);
  g.restore();
}

/* ------------------------------- uniform ---------------------------------
   One item each, never a whole outfit — a dog can plausibly wear a hat. The
   brass collar is the shared signal and the only part that still reads when
   they are eight pixels tall on the map.
   ---------------------------------------------------------------------------- */
function drawUniform(g,d,s,bodyL,bodyH,legL,lying,sitting){
  const bY=lying?-bodyH*.62:sitting?-legL*.55-bodyH*.9:-legL-bodyH;
  const hx=bodyL*.42, hy=bY-bodyH*.30;
  const ht=-d.head*.30+(d.state==='eat'?.85:0);
  const brass='#E2B76A', dark='#3A2A1E';

  // collar and tag, worn by everyone who works here
  g.save(); g.translate(hx-1*s,hy+bodyH*.34); g.rotate(ht*.4);
  g.fillStyle=dark; g.fillRect(-6*s,-1.6*s,15*s,4.4*s);
  g.fillStyle=brass; g.fillRect(-6*s,-1.6*s,15*s,1.6*s);
  g.beginPath(); g.arc(1.5*s,4.2*s,2.5*s,0,7); g.fill();
  g.restore();

  g.save(); g.translate(hx+7*s,hy); g.rotate(ht);
  const R=d.role;
  if(R==='concierge'){                      // top hat, and the crossed keys
    g.fillStyle='#231C18'; g.fillRect(-11*s,-11.5*s,25*s,2.6*s);
    g.fillRect(-6*s,-24*s,15*s,13*s);
    g.fillStyle='#4A3A2E'; g.fillRect(-6*s,-15.5*s,15*s,3*s);
    g.fillStyle=brass; g.fillRect(-6*s,-14.6*s,15*s,1.1*s);
  }
  if(R==='reception'){                      // bow tie under the chin
    g.save(); g.translate(-2*s,7.5*s);
    g.fillStyle='#8E2C2C';
    g.beginPath(); g.moveTo(0,0); g.lineTo(-6*s,-3.6*s); g.lineTo(-6*s,3.6*s); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(0,0); g.lineTo(6*s,-3.6*s); g.lineTo(6*s,3.6*s); g.closePath(); g.fill();
    g.fillStyle='#B04040'; g.beginPath(); g.arc(0,0,1.9*s,0,7); g.fill();
    g.restore();
  }
  if(R==='porter'){                         // pillbox bellhop cap, tilted
    g.save(); g.rotate(-.22);
    g.fillStyle='#8E2C2C'; g.fillRect(-6*s,-19*s,14*s,8*s);
    g.fillStyle='#A83A3A'; g.fillRect(-6*s,-19*s,14*s,2.4*s);
    g.fillStyle=brass; g.fillRect(-6*s,-12*s,14*s,1.4*s);
    g.beginPath(); g.arc(1*s,-15.5*s,1.5*s,0,7); g.fill();
    g.restore();
  }
  if(R==='keeper'){                         // headscarf knotted at the back
    g.fillStyle='#5E7A8E';
    g.beginPath(); g.moveTo(-9*s,-10*s); g.quadraticCurveTo(1*s,-21*s,11*s,-9*s);
    g.lineTo(-9*s,-9*s); g.closePath(); g.fill();
    g.fillStyle='#728EA2';
    g.beginPath(); g.moveTo(-9*s,-10*s); g.quadraticCurveTo(-4*s,-16*s,1*s,-15*s);
    g.lineTo(-2*s,-9*s); g.closePath(); g.fill();
    g.fillStyle='#5E7A8E';
    g.beginPath(); g.moveTo(-9*s,-11*s); g.lineTo(-15*s,-14*s); g.lineTo(-13*s,-8*s);
    g.closePath(); g.fill();
  }
  if(R==='chef'){                           // toque, and a neckerchief
    g.fillStyle='#F4F1E8';
    g.fillRect(-7*s,-14*s,16*s,4.4*s);
    g.beginPath(); g.arc(-3*s,-19*s,5.4*s,0,7); g.fill();
    g.beginPath(); g.arc(3*s,-21*s,6*s,0,7); g.fill();
    g.beginPath(); g.arc(8*s,-18*s,4.6*s,0,7); g.fill();
    g.fillStyle='#E6E2D6'; g.fillRect(-7*s,-11*s,16*s,1.4*s);
    g.restore(); g.save(); g.translate(hx-2*s,hy+bodyH*.5); g.rotate(ht*.4);
    g.fillStyle='#8E2C2C';
    g.beginPath(); g.moveTo(-5*s,-2*s); g.lineTo(8*s,-2*s); g.lineTo(2*s,6*s); g.closePath(); g.fill();
  }
  g.restore();
}




/* ----------------------------- thought bubbles ----------------------------
   A dog with something on its mind shows it, at any zoom. This is the only
   nagging the game does, and it is a picture rather than a notification.
   -------------------------------------------------------------------------- */
const BUB={dirty:'💢',hungry:'🦴',thirsty:'💧',bored:'🎾',walk:'🦮',
  sleepy:'💤',happy:'♥',tune:'♪',content:'☺',cold:'🔥'};
function pickBubble(d){
  if(d.staff) return pick(['☺','♪','🔔','♥','☺']);
  if(!d.room){ return WISH[d.wish].icon; }
  const lv=soilLevel(d.room);
  if(lv>.45) return BUB.dirty;
  if(S.phase>.62) return BUB.sleepy;
  const todo=Object.keys(SERVICES).filter(k=>canService(d,k));
  if(todo.length){
    const liked=todo.filter(k=>SERVICES[k].like&&d.likes.includes(SERVICES[k].like));
    if(liked.length&&Math.random()<.7){
      const k=liked[Math.floor(Math.random()*liked.length)];
      return SERVICES[k].icon;
    }
    if(Math.random()<.45){
      const k=todo[Math.floor(Math.random()*todo.length)];
      return SERVICES[k].icon;
    }
  }
  if(!wishMet(d,d.room)&&Math.random()<.5) return WISH[d.wish].icon;
  if(d.hearts>=3&&Math.random()<.5) return BUB.happy;
  if(d.comfort>.6) return BUB.content;
  return Math.random()<.5?BUB.tune:BUB.content;
}
function stepBubbles(dt){
  for(const d of allDogs()){
    if(d.bub){ d.bub.life-=dt; if(d.bub.life<=0) d.bub=null; continue; }
    d.bubT=(d.bubT===undefined?rnd(2,10):d.bubT)-dt;
    if(d.bubT<=0){
      d.bubT=rnd(9,20);
      if(d.state==='lift') continue;
      d.bub={ic:pickBubble(d),life:rnd(3,4.6),pop:0};
      if(!d.staff&&Math.random()<.14) sfx('bark',{at:{f:d.f,u:d.u}});
    }
  }
}
function drawBubble(d,cx,topY,sc){
  const b=d.bub; if(!b) return;
  b.pop=Math.min(1,b.pop+.14);
  const e=1-Math.pow(1-b.pop,3);
  const fade=Math.min(1,b.life/.7);
  const rad=17*sc*e, y=topY-rad-6*sc;
  ctx.globalAlpha=fade;
  ctx.fillStyle='rgba(247,239,225,.94)';
  ctx.beginPath(); ctx.arc(cx,y,rad,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(cx-rad*.62,y+rad*.86,rad*.32,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(cx-rad*.92,y+rad*1.28,rad*.17,0,7); ctx.fill();
  ctx.font=`${Math.round(19*sc*e)}px serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(b.ic,cx,y+1);
  ctx.textBaseline='alphabetic';
  ctx.globalAlpha=1;
}

/* ------------------------------- soiling ---------------------------------
   Separate from the homely mess. Waste stacks up, guests grumble about it,
   and clearing it costs money — the first sink that isn't construction.
   A room with a turf run gets used properly, which is the point of building one.
   -------------------------------------------------------------------------- */

/* Cleaning up yourself: tap a mess and you deal with it, and pocket a little
   for the trouble. Cheaper than paying, slower than paying — a thing to do
   while you are pottering about rather than a chore you are set. */
const TIP_TIDY=4, TIP_MESS=8;
function soilScreen(r,p){
  const l=LAY();
  return {x:((p.s+p.x)*W-camX())*cam.k+W/2,
          y:(((FLOORS-1-r.f)*SH+l.stand+6+(p.x*37%12))-camY())*cam.k+SH/2};
}
function pickUpSoil(x,y){
  if(isMap()) return false;
  for(const r of S.rooms){
    if(!r.soil||!r.soil.length) continue;
    for(let i=0;i<r.soil.length;i++){
      const p=r.soil[i], sp=soilScreen(r,p);
      if(Math.hypot(x-sp.x,y-sp.y)<Math.max(26,30*cam.k)){
        const tip=p.tidy?TIP_TIDY:TIP_MESS;
        r.soil.splice(i,1);
        S.coins+=tip; sfx('coin');
        S.fx.push({f:r.f,u:p.s+p.x,life:1.1,ch:'+'+tip,col:'#8FC4D2'});
        if(!r.soil.length) for(const d of S.dogs) if(d.room===r) d.grumbled=false;
        syncCoins();
        if(FOCUS) renderFocus();
        return true;
      }
    }
  }
  return false;
}
function roomOf(f,s){ const g=at(f,s); return g?g.room:null; }
function soilCost(r){
  if(!r||!r.soil||!r.soil.length) return 0;
  let c=CLEAN_BASE;
  for(const p of r.soil) c+=p.tidy?4:CLEAN_PER;   // a bathroom is far cheaper to see to
  return c;
}
function dirtyRooms(){ return S.rooms.filter(r=>r.soil&&r.soil.length); }
function cleanAllCost(){ return dirtyRooms().reduce((a,r)=>a+soilCost(r),0); }
function cleanRoom(r){
  const c=soilCost(r); if(!c||S.coins<c) return false;
  spend(c); r.soil=[]; sfx('splash');
  for(const d of S.dogs) if(d.room===r) d.grumbled=false;
  say('Cleaned '+r.name+' · −'+c+' coins.');
  return true;
}
function cleanAll(){
  const c=cleanAllCost(); if(!c||S.coins<c) return false;
  spend(c); sfx('splash');
  for(const r of S.rooms) r.soil=[];
  for(const d of S.dogs) d.grumbled=false;
  say('The whole hotel is spotless again · −'+c+' coins.');
  return true;
}
function soilLevel(r){ return r&&r.soil?Math.min(1,r.soil.length/6):0; }
function addSoil(d){
  const r=d.room; if(!r) return;
  r.soil=r.soil||[];
  if(r.soil.length>=9) return;
  const bath=r.parts.indexOf('bathroom'), turf=r.parts.indexOf('turf');
  const spot=bath>=0?bath:(turf>=0?turf:-1);
  const i=spot>=0?spot:Math.floor(Math.random()*r.parts.length);
  r.soil.push({s:r.s+i,x:.12+Math.random()*.76,
    k:(spot>=0||Math.random()<.55)?'pee':'poo',
    tidy:spot>=0});
}
function drawSoil(f,s){
  const r=roomOf(f,s); if(!r||!r.soil) return;
  const l=LAY();
  for(const p of r.soil){
    if(p.s!==s) continue;
    const x=W*p.x, y=l.stand+6+(p.x*37%12);
    if(p.k==='pee'){
      ctx.fillStyle='rgba(206,178,86,.34)';
      ctx.beginPath(); ctx.ellipse(x,y,17,7,0,0,7); ctx.fill();
      ctx.fillStyle='rgba(226,204,130,.28)';
      ctx.beginPath(); ctx.ellipse(x-4,y-1,9,4,0,0,7); ctx.fill();
    } else {
      ctx.fillStyle='#5A4028';
      ctx.beginPath(); ctx.ellipse(x,y+2,9,5,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+1,y-2,7,4.5,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x-1,y-6,5,3.5,0,0,7); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.10)';
      ctx.beginPath(); ctx.ellipse(x-2,y-7,2.4,1.6,0,0,7); ctx.fill();
    }
  }
}

/* ------------------------------ mess ------------------------------------
   A dog that has settled in makes a mess of the place, and that is the point:
   an immaculate room means a guest who hasn't relaxed yet. Drawn as a scatter
   layer over the tidy slice, seeded per room so it stays put between frames.
   Tidying is never a player verb.
   -------------------------------------------------------------------------- */
function messFor(f,s){
  let best=0;
  for(const d of S.dogs){
    if(!d.room||d.room.f!==f) continue;
    if(s<d.room.s||s>=d.room.s+d.room.parts.length) continue;
    best=Math.max(best,d.comfort);
  }
  return best;
}
function drawMess(f,s,amt,part){
  if(amt<=.08) return;
  const l=LAY();
  let sd=(f*131+s*977+7)>>>0;
  const r=()=>(sd=(sd*1664525+1013904223)>>>0)/4294967296;
  const n=Math.floor(amt*7);
  // paw prints tracked across the floor
  if(amt>.2){
    ctx.fillStyle='rgba(74,48,28,.16)';
    const pn=Math.floor(amt*9);
    for(let i=0;i<pn;i++){
      const px=r()*W, py=l.stand+6+r()*(l.bot-l.stand-8);
      for(const o of [[0,0],[5,3]]){
        ctx.beginPath(); ctx.ellipse(px+o[0],py+o[1],3.4,2.6,0,0,7); ctx.fill(); }
    }
  }
  if(part==='bed'){
    if(amt>.25){                                   // duvet dragged onto the floor
      ctx.fillStyle='#C9B48E';
      ctx.beginPath();
      ctx.moveTo(W*.20,l.stand-2); ctx.quadraticCurveTo(W*.30,l.stand-24,W*.46,l.stand-10);
      ctx.quadraticCurveTo(W*.58,l.stand+2,W*.42,l.stand+4);
      ctx.lineTo(W*.20,l.stand+4); ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(120,96,64,.24)';
      ctx.beginPath(); ctx.ellipse(W*.33,l.stand-6,W*.07,7,0,0,7); ctx.fill();
    }
    if(amt>.55){                                   // pillow on the rug
      ctx.save(); ctx.translate(W*.66,l.stand-6); ctx.rotate(.35);
      ctx.fillStyle='#F1E6CE'; rr(ctx,-16,-8,32,16,6); ctx.restore(); }
  }
  if(part==='play'&&amt>.3){
    ctx.fillStyle='#C7D96B';
    ctx.beginPath(); ctx.arc(W*.52,l.stand-4,6.5,0,7); ctx.fill();
    ctx.fillStyle='#D96B6B';
    ctx.beginPath(); ctx.arc(W*.83,l.stand-3,5.5,0,7); ctx.fill();
    if(amt>.6){                                    // rope toy well chewed
      ctx.strokeStyle='#BBA57C'; ctx.lineWidth=5; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(W*.34,l.stand-2);
      ctx.quadraticCurveTo(W*.4,l.stand-9,W*.46,l.stand-3); ctx.stroke(); ctx.lineCap='butt'; }
  }
  if(part==='food'&&amt>.25){
    ctx.fillStyle='rgba(120,86,52,.5)';            // kibble that missed the bowl
    for(let i=0;i<n*2;i++){
      ctx.beginPath(); ctx.arc(W*(.18+r()*.34),l.stand-4+r()*7,1.8,0,7); ctx.fill(); }
    if(amt>.6){ ctx.save(); ctx.translate(W*.41,l.stand-8); ctx.rotate(.9);
      ctx.fillStyle='#3E4C58'; ctx.beginPath(); ctx.ellipse(0,0,15,6,0,0,7); ctx.fill();
      ctx.restore(); }
  }
  if(part==='turf'&&amt>.35){
    ctx.fillStyle='rgba(58,40,24,.5)';             // a hole started, then abandoned
    ctx.beginPath(); ctx.ellipse(W*.36,l.stand+8,17,7,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(78,122,80,.8)';
    for(let i=0;i<7;i++){ ctx.beginPath();
      ctx.arc(W*.36+(r()-.5)*60,l.stand+4+(r()-.5)*12,3,0,7); ctx.fill(); }
  }
  if(amt>.45){                                     // a slipper, thoroughly dealt with
    ctx.save(); ctx.translate(W*(.12+r()*.72),l.stand+2); ctx.rotate((r()-.5)*.9);
    ctx.fillStyle='#6E4A3A'; rr(ctx,-11,-5,22,10,5);
    ctx.fillStyle='#8A6152'; rr(ctx,-11,-5,12,10,5); ctx.restore(); }
  if(amt>.8){                                      // fully at home
    ctx.fillStyle='rgba(200,186,158,.55)';
    for(let i=0;i<9;i++){ ctx.beginPath();
      ctx.arc(W*(.1+r()*.8),l.stand+r()*(l.bot-l.stand)-4,2.2,0,7); ctx.fill(); }
  }
}

/* ------------------------- one continuous camera -------------------------
   There is a single world: a grid of slices. The "tower view" is not a
   different picture, it is the same slices seen from further away, with the
   same dogs walking about in them. cam.k is the only thing that changes.
   -------------------------------------------------------------------------- */
const cam={cx:1,cy:0,k:1,tx:1,ty:0,tk:1};
let armed=null;
/* Zoom is continuous between two honest bounds and rests wherever you leave it.
   K_SLICE is exactly one room filling the portrait stage: a slot is W wide and a
   floor is SH tall, so that falls out at k=1. You may pinch past it to get close
   to a dog. K_MAP is the single line between map and room — it used to be .55 in
   one place and .62 in another, so a camera at .58 rendered as a room and settled
   as a map. */
const K_SLICE=1, K_MAP=.55, K_LOCK=.98;
/* The only place anything snaps, and it is a narrow band right at the top: from
   K_LOCK up to the slice the camera grows less willing to sit between floors —
   vertical drag stiffens and a pull toward the nearest floor fades in. At the
   slice it is absolute and you slide along one floor. Below K_LOCK nothing pulls
   at all. It still ramps rather than tripping at a threshold, so crossing into
   the band never jolts; the band is just short enough now that in practice you
   only feel it once the pinch reaches the ceiling.
   Zooming closer than the slice is not needed: tapping a dog opens focus mode,
   which runs its own camera at 1.85 and ignores these bounds. */
const lockT=()=>Math.max(0,Math.min(1,(cam.k-K_LOCK)/(K_SLICE-K_LOCK)));
/* This had a Math.max(.12,…) floor on it. The true horizontal fit is about .078,
   so the floor always won and there was no zoom at which the whole hotel was
   visible — the tower rendered 562px wide in a 390px stage. The .04 below is a
   divide-by-nothing guard, not a design number. */
/* Framing all twelve slots when you have built four leaves the hotel a stamp in
   the corner of an empty grid. Fit frames what is actually there, plus a floor of
   headroom, and never comes out above the map threshold — the reset view is the
   map view, at every hotel size. */
function builtBox(){
  let s0=SLOTS, s1=0, f1=0, any=false;
  for(const r of S.rooms){
    any=true;
    s0=Math.min(s0,r.s); s1=Math.max(s1,r.s+Math.max(1,r.parts.length)-1);
    f1=Math.max(f1,r.f);
  }
  if(!any) return {s0:0,s1:SLOTS-1,f0:0,f1:Math.max(1,FLOORS-1)};
  return {s0,s1,f0:0,f1:Math.min(FLOORS-1,f1+1)};
}
const fitK=()=>{
  const b=builtBox(), cols=b.s1-b.s0+1, rows=b.f1-b.f0+1;
  return Math.max(.04,Math.min(K_MAP-.02,(W-24)/(cols*W),(SH-96)/(rows*SH)));
};
const kOut=()=>fitK()*.75;                    // a little past the whole tower
const clampK=k=>Math.max(kOut(),Math.min(K_SLICE,k));
const isMap=()=>cam.k<K_MAP;
const cur=()=>({f:Math.max(0,Math.min(FLOORS-1,Math.round(cam.cy))),
                s:Math.max(0,Math.min(SLOTS-1,Math.round(cam.cx)))});
const camX=()=>(cam.cx+.5)*W, camY=()=>((FLOORS-1-cam.cy)+.5)*SH;
const cellX=s=>(s*W-camX())*cam.k+W/2;
const cellY=f=>((FLOORS-1-f)*SH-camY())*cam.k+SH/2;
function screenToCell(x,y){
  const wx=(x-W/2)/cam.k+camX(), wy=(y-SH/2)/cam.k+camY();
  return {s:Math.floor(wx/W), f:FLOORS-1-Math.floor(wy/SH)};
}

function drawFire(l,x0,fw,t){
  const cx=x0+fw*.5, by=l.wallB-10;
  for(let i=0;i<5;i++){
    const ph=t*2.6+i*1.3, h=(24+Math.sin(ph)*8+Math.cos(ph*1.7)*4)*(1-i*.11);
    const w=(fw*.3)*(1-i*.13);
    ctx.fillStyle=['#FFD98A','#FFB44E','#F5842E','#D9541F','#8E2E12'][i];
    ctx.globalAlpha=.9-i*.1;
    ctx.beginPath(); ctx.moveTo(cx-w/2+Math.sin(ph)*3,by);
    ctx.quadraticCurveTo(cx-w*.3,by-h*.7,cx+Math.sin(ph*1.3)*4,by-h);
    ctx.quadraticCurveTo(cx+w*.3,by-h*.7,cx+w/2+Math.sin(ph)*3,by);
    ctx.closePath(); ctx.fill(); }
  ctx.globalAlpha=1;
  const gg=ctx.createRadialGradient(cx,by-14,4,cx,by-14,W*.6);
  gg.addColorStop(0,'rgba(255,168,80,.3)'); gg.addColorStop(1,'rgba(255,168,80,0)');
  ctx.fillStyle=gg; ctx.fillRect(0,0,W,SH);
}

function drawCell(f,s,t){
  const sx=cellX(s), sy=cellY(f), k=cam.k;
  if(sx>W||sx+W*k<0||sy>SH||sy+SH*k<0) return;
  const g0=at(f,s), l=LAY(), kk=key(f,s);
  ctx.save();
  ctx.translate(sx,sy); ctx.scale(k,k);
  ctx.beginPath(); ctx.rect(0,0,W,SH); ctx.clip();

  const born=g0&&g0.room.born!=null?Math.min(1,(S.t-g0.room.born)*2.6):1;
  const ez=1-Math.pow(1-born,3);
  if(ez<1){ ctx.save(); ctx.translate(W/2,SH/2); ctx.scale(1,ez); ctx.translate(-W/2,-SH/2); }
  /* Crossfade by laying the SECOND rung over an opaque first, never both at
     partial alpha. Drawing A at 1-t and then B at t leaves (1-t)*t of whatever
     was underneath still showing — with the chain almost always mid-blend, that
     made the whole hotel semi-transparent and the city visible through the
     walls. Opaque base, then blend on top, keeps it solid at every t. */
  const m=mipFor(k);
  ctx.globalAlpha=1; ctx.drawImage(mipCanvas(f,s,m.a),0,0,W,SH);
  if(m.t>0){ ctx.globalAlpha=m.t; ctx.drawImage(mipCanvas(f,s,m.b),0,0,W,SH); }
  ctx.globalAlpha=1;
  if(ez<1) ctx.restore();

  if(!g0&&k>.55){
    const pw=W*.46, ph=54, px=(W-pw)/2, py=SH*.44;
    ctx.fillStyle='rgba(13,10,9,.72)'; rr(ctx,px,py,pw,ph,6);
    ctx.strokeStyle='rgba(226,183,106,.6)'; ctx.lineWidth=1.5;
    ctx.setLineDash([5,4]); rr2(ctx,px,py,pw,ph,6); ctx.setLineDash([]);
    ctx.fillStyle='#E2B76A'; ctx.textAlign='center';
    ctx.font='700 22px Archivo'; ctx.fillText('+',W/2,py+27);
    ctx.font='700 9px Archivo'; ctx.fillStyle='rgba(247,239,225,.8)';
    ctx.fillText('BUILD HERE',W/2,py+43);
  }
  if(g0&&g0.room.kind!=='landing'){ drawMess(f,s,messFor(f,s),g0.room.parts[g0.part]); drawSoil(f,s); }
  if(g0&&S.fires[kk]&&g0.room.parts[g0.part]==='fire') drawFire(l,W*.10,W*.42,t);

  if(S.phase>.5&&g0){ const kn=Math.min(1,(S.phase-.5)/.35);
    ctx.fillStyle=`rgba(12,18,38,${.3*kn})`; ctx.fillRect(0,0,W,SH); }
  ctx.restore();

  // slice divider — only where two different rooms meet
  const a=at(f,s), b=at(f,s-1);
  if(!a||!b||a.room!==b.room){
    ctx.fillStyle='rgba(0,0,0,.30)'; ctx.fillRect(sx-2*k,sy,4*k,SH*k); }
}


/* dogs live in the world, not in a cell — drawn after the rooms so they can be
   halfway between two of them, in a lift, or crossing a floor. */
function dogScreen(d){
  const l=LAY();
  return {x:(d.u*W-camX())*cam.k+W/2,
          y:(((FLOORS-1-d.f)*SH+l.stand)-camY())*cam.k+SH/2};
}

function liftGeom(){
  const l=LAY();
  const x0=(LIFT_X0*W-camX())*cam.k+W/2, x1=(LIFT_X1*W-camX())*cam.k+W/2;
  const h=(l.stand-l.ceil-4)*cam.k;          // full height of the slice interior
  return {x0,x1,w:x1-x0,h};
}
function topBuilt(){ return S.rooms.reduce((m,r)=>Math.max(m,r.f),0); }
function drawLift(t){
  const L=S.lift, g=liftGeom(), l=LAY(), k=cam.k;
  const top=topBuilt();
  const shaftTop=(((FLOORS-1-top)*SH+l.ceil)-camY())*k+SH/2;
  const shaftBot=(((FLOORS-1)*SH+l.stand)-camY())*k+SH/2;
  // cable and counterweight groove
  const midX=(g.x0+g.x1)/2;
  const carFloor=(((FLOORS-1-L.f)*SH+l.stand)-camY())*k+SH/2;
  ctx.strokeStyle='rgba(140,152,172,.5)'; ctx.lineWidth=Math.max(1,1.8*k);
  ctx.beginPath(); ctx.moveTo(midX,shaftTop); ctx.lineTo(midX,carFloor-g.h); ctx.stroke();
  ctx.fillStyle='rgba(120,132,150,.35)';
  ctx.fillRect(g.x1-9*k,shaftTop,5*k,Math.max(0,shaftBot-shaftTop));

  // an open car: floor plate, two posts, a canopy with a lamp. No doors.
  const yTop=carFloor-g.h;
  ctx.fillStyle='rgba(255,206,140,.13)';
  ctx.fillRect(g.x0+5*k,yTop,g.w-10*k,g.h);
  ctx.fillStyle='#3A2E20'; ctx.fillRect(g.x0+2*k,carFloor-3*k,g.w-4*k,7*k);
  ctx.fillStyle='#E2B76A'; ctx.fillRect(g.x0+2*k,carFloor-3*k,g.w-4*k,2.4*k);
  ctx.fillStyle='#4A3A28'; ctx.fillRect(g.x0+2*k,yTop,g.w-4*k,7*k);
  ctx.fillStyle='#E2B76A'; ctx.fillRect(g.x0+2*k,yTop+7*k,g.w-4*k,1.8*k);
  ctx.fillStyle='#5C4A34';
  ctx.fillRect(g.x0+3*k,yTop,5*k,g.h); ctx.fillRect(g.x1-8*k,yTop,5*k,g.h);
  ctx.fillStyle='#7A6444';
  ctx.fillRect(g.x0+3*k,yTop,1.8*k,g.h); ctx.fillRect(g.x1-8*k,yTop,1.8*k,g.h);
  // brass rail across the back
  ctx.fillStyle='rgba(226,183,106,.75)';
  ctx.fillRect(g.x0+8*k,carFloor-g.h*.42,g.w-16*k,2.2*k);
  // lamp
  if(k>.35){
    ctx.fillStyle='rgba(255,226,170,.95)';
    ctx.beginPath(); ctx.ellipse(midX,yTop+11*k,7*k,3.4*k,0,0,7); ctx.fill();
    const gg=ctx.createRadialGradient(midX,yTop+11*k,2*k,midX,yTop+11*k,g.h*.9);
    gg.addColorStop(0,'rgba(255,214,150,.22)'); gg.addColorStop(1,'rgba(255,214,150,0)');
    ctx.fillStyle=gg; ctx.fillRect(g.x0,yTop,g.w,g.h);
  }
  // floor indicator above the car
  if(k>.45){
    ctx.fillStyle='rgba(226,183,106,.9)';
    ctx.font=`700 ${Math.round(10*Math.max(k,.6))}px Archivo`; ctx.textAlign='center';
    ctx.fillText(String(Math.round(L.f)),midX,yTop-6*k);
    if(L.state==='moving'){
      ctx.fillStyle='rgba(226,183,106,.55)';
      ctx.fillText(L.target>L.f?'▲':'▼',midX+16*k,yTop-6*k);
    }
  }
}
function drawDogsWorld(t){
  /* Dogs get a gentle version of the room's exaggeration — see dogEx. Applied
     UNIFORMLY, since the rooms stretch vertically because they are made of
     blocks and doing that to a dog would deform a silhouette you are meant to
     recognise. */
  const k=cam.k, EX=dogEx(k), sc=1.28*k*EX;
  const uiSc=Math.max(k,.30);               // markers drawn over it stay readable
  const outline=k>.4;
  const list=allDogs().slice().sort((a,b)=>a.f-b.f||a.u-b.u);
  for(const d of list){
    const p=dogScreen(d);
    if(p.x<-90||p.x>W+90||p.y<-90||p.y>SH+90) continue;
    const moving=d.state==='walk';
    const bob=moving?Math.abs(Math.sin(t*7+d.id))*2*Math.max(k,.3):0;
    ctx.fillStyle='rgba(28,14,6,.26)';
    ctx.beginPath();
    ctx.ellipse(p.x,p.y+2*k,26*dscale(d)*k*EX,7*dscale(d)*k*EX,0,0,7); ctx.fill();
    const shown=moving?'walk':(d.state==='wait'?'sit':d.state);
    drawDog(ctx,{...d,state:shown},p.x,p.y-bob,sc,t,outline);
    const headY=p.y-bob-58*dscale(d)*k*EX;
    // two dogs in company get one shared marker between them
    if(d.with&&d.id<d.with.id&&k>.28){
      const q=dogScreen(d.with), m=MEET[d.meet]||MEET.chat;
      const mx=(p.x+q.x)/2, my=Math.min(p.y,q.y)-46*Math.max(k,.3);
      const bob2=Math.sin(t*.004+d.id)*2;
      ctx.font=`${Math.round(17*uiSc)}px serif`;
      ctx.textAlign='center';
      ctx.globalAlpha=.85;
      ctx.fillText(m.ic,mx,my+bob2);
      ctx.globalAlpha=1;
    }
    drawBubble(d,p.x,headY,uiSc);
    if(k>.62){
      ctx.font='700 11px Archivo'; ctx.textAlign='center';
      const wpx=ctx.measureText(d.name).width+12, ny=headY-14;
      ctx.fillStyle='rgba(16,12,10,.62)'; rr(ctx,p.x-wpx/2,ny-11,wpx,15,3);
      ctx.fillStyle=d.hearts>=5?'#F3B0AE':'#F7EFE1'; ctx.fillText(d.name,p.x,ny);
      if(!d.room&&!d.leaving){ ctx.font='15px serif';
        ctx.globalAlpha=.7+.3*Math.sin(t*2+d.id);
        ctx.fillText(WISH[d.wish].icon,p.x,ny-18); ctx.globalAlpha=1; }
    }
  }
  for(const f of S.fx){
    const y=(((FLOORS-1-f.f)*SH+LAY().stand)-camY())*cam.k+SH/2;
    const x=(f.u*W-camX())*cam.k+W/2;
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.fillStyle=f.col||'#E8807E';
    ctx.font=`${Math.round(19*Math.max(k,.45))}px serif`; ctx.textAlign='center';
    ctx.fillText(f.ch||'♥',x,y-70*Math.max(k,.4)-(1.3-f.life)*32);
    ctx.globalAlpha=1;
  }
}

function drawBackdrop(){
  const gr=ctx.createLinearGradient(0,0,0,SH);
  const night=S.phase>.58;
  if(night){ gr.addColorStop(0,'#0A1020'); gr.addColorStop(.7,'#151C33'); gr.addColorStop(1,'#2A2440'); }
  else { gr.addColorStop(0,'#3E6C99'); gr.addColorStop(.62,'#87ADC4'); gr.addColorStop(1,'#D3B18A'); }
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,SH);
  let sd=5; const r=()=>(sd=(sd*1664525+1013904223)>>>0)/4294967296;
  const horizon=cellY(0)+SH*cam.k;
  ctx.fillStyle=night?'#141B30':'#5E7A93';
  let bx=0;
  while(bx<W){ const bw=16+r()*42, bh=40+r()*130;
    ctx.fillRect(bx,horizon-bh,bw,bh+40);
    if(night){ ctx.fillStyle='rgba(255,200,120,.5)';
      for(let wy=horizon-bh+6;wy<horizon-6;wy+=9)
        for(let wx=bx+3;wx<bx+bw-4;wx+=7) if(r()>.62) ctx.fillRect(wx,wy,2.5,3);
      ctx.fillStyle='#141B30'; }
    bx+=bw+5; }
  ctx.fillStyle=night?'#0E1424':'#2E3A48';
  ctx.fillRect(0,horizon,W,SH-horizon);
}

function drawBuildOverlay(t){
  if(!armed) return;
  const k=cam.k;
  for(let f=0;f<FLOORS;f++) for(let s=0;s<SLOTS;s++){
    if(!canPlace(armed,f,s)) continue;
    const n=armed.ext?1:armed.slices;
    const x=cellX(s), y=cellY(f), w=W*k*n, h=SH*k;
    ctx.fillStyle=`rgba(226,183,106,${.20+.14*Math.sin(t*5)})`;
    ctx.fillRect(x+2,y+2,w-4,h-4);
    ctx.strokeStyle='#E2B76A'; ctx.lineWidth=2;
    ctx.strokeRect(x+2,y+2,w-4,h-4);
    if(w>44){ ctx.fillStyle='#E2B76A'; ctx.font='700 9px Archivo'; ctx.textAlign='center';
      ctx.fillText('+',x+w/2,y+h/2+3); }
  }
}
function drawMapChrome(){
  if(cam.k>.55) return;
  const k=cam.k;
  ctx.font='700 9px Archivo'; ctx.textAlign='right';
  for(let f=0;f<FLOORS;f++){
    const y=cellY(f);
    if(y<-SH*k||y>SH) continue;
    ctx.fillStyle='rgba(247,239,225,.5)';
    ctx.fillText(String(f),cellX(0)-6,y+SH*k*.55); }
  // vacancy flags
  for(const rm of S.rooms){
    if((rm.kind!=='room'&&rm.kind!=='suite')||rm.guest) continue;
    const x=cellX(rm.s), y=cellY(rm.f), w=W*k*rm.parts.length;
    ctx.strokeStyle='rgba(226,183,106,.85)'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
    ctx.strokeRect(x+2,y+2,w-4,SH*k-4); ctx.setLineDash([]);
    if(w>52){ ctx.fillStyle='#E2B76A'; ctx.font='700 8px Archivo'; ctx.textAlign='center';
      ctx.fillText('VACANT',x+w/2,y+SH*k*.5); } }
  const c=cur(), g=at(c.f,c.s);
  if(g){ const rm=g.room, x=cellX(rm.s), y=cellY(rm.f), w=W*k*rm.parts.length;
    ctx.strokeStyle='#F7EFE1'; ctx.lineWidth=2; ctx.strokeRect(x,y,w,SH*k); }
}

function draw(t){
  bakes=0;                                   // repaint budget, refreshed each frame
  ctx.fillStyle='#0D0A09'; ctx.fillRect(0,0,W,H);
  drawBackdrop();
  const tl=screenToCell(0,0), br=screenToCell(W,SH);
  const s0=Math.max(0,tl.s-1), s1=Math.min(SLOTS-1,br.s+1);
  const f0=Math.max(0,br.f-1), f1=Math.min(FLOORS-1,tl.f+1);
  for(let f=f0;f<=f1;f++) for(let s=s0;s<=s1;s++) drawCell(f,s,t);
  drawLift(t);
  drawDogsWorld(t);
  drawMapChrome();
  drawBuildOverlay(t);
  ctx.fillStyle='#0D0A09'; ctx.fillRect(0,SH,W,H-SH);
}

/* ------------------------------ navigation ------------------------------ */
/* --------------------------- room-bounded panning ---------------------------
   Inside a room you drag freely and the camera slides continuously across its
   parts — but it stops at the room's walls. Travelling anywhere else is the
   Map's job, which keeps the two scales doing clearly different work.
   ---------------------------------------------------------------------------- */
let ROOM=null, panV=0;
function enterRoom(f,s){
  const g=at(f,s);
  // you can drag the length of the whole floor; the Map is still how you travel
  ROOM = {f, s0:0, s1:SLOTS-1, room:g?g.room:null};
  cam.ty=f;
  cam.tx=Math.max(ROOM.s0,Math.min(ROOM.s1,s));
  // coming off the map this opens the room at slice size; if you were already
  // zoomed in somewhere, your zoom is yours and we only travel
  cam.tk=cam.k>K_MAP?null:K_SLICE; panV=0; lastWhere='';
}
function clampPan(v,slackCells){
  if(!ROOM) return v;
  const sl=slackCells||0;
  return Math.max(ROOM.s0-sl,Math.min(ROOM.s1+sl,v));
}
function syncNav(){
  const mb=document.getElementById('mapBtn');
  mb.querySelector('span').textContent=atFit()?'⤢':'▦';
  mb.querySelector('b').textContent=FOCUS?'Back':(atFit()?'Close':'Map');
}
/* Home. Now that fitK honestly fits, this is the whole hotel on one screen —
   and since the zoom no longer snaps to anything, a reliable way back is not a
   convenience, it is required. The button used to key off isMap(), which meant
   that resting anywhere under .55 turned it into an enter-a-room button and you
   had no reset at all. It keys off actually being at the fit now. */
const atFit=()=>Math.abs(cam.k-fitK())<.012;
function resetView(){
  const b=builtBox();
  cam.tk=fitK(); cam.tx=(b.s0+b.s1)/2; cam.ty=(b.f0+b.f1)/2;
  ROOM=null; panV=0; hideCard(); closeHere();
}
document.getElementById('mapBtn').onclick=()=>{
  if(FOCUS) return exitFocus();
  if(atFit()){ const c=cur(); enterRoom(c.f,c.s); }
  else resetView();
};
const stage=document.getElementById('stage'), ptrs=new Map();
let pinch0=0,k0=1,dnX=0,dnY=0,moved=0,panX=0,panY=0,anchor=null,lastPX=0,lastPT=0,pinchMoved=false,multi=false,axis=null;
stage.addEventListener('pointerdown',e=>{
  tryLockPortrait();   // browsers only honour this off a gesture, if at all
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){ dnX=e.clientX; dnY=e.clientY; moved=0; axis=null; panX=cam.cx; panY=cam.cy;
    lastPX=e.clientX; lastPT=performance.now(); panV=0; }
  else if(ptrs.size===2){ const p=[...ptrs.values()];
    multi=true;
    pinch0=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); k0=cam.k; pinchMoved=false;
    cam.tk=null; cam.tx=cam.ty=null;
    const mx=(p[0].x+p[1].x)/2-OX, my=(p[0].y+p[1].y)/2;
    anchor={mx,my,wx:(mx-W/2)/cam.k+camX(),wy:(my-SH/2)/cam.k+camY()}; }
});
stage.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2){
    const p=[...ptrs.values()], d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinch0>10){
      if(Math.abs(d-pinch0)>14) pinchMoved=true;
      cam.k=clampK(k0*(d/pinch0));
      if(anchor){
        /* Map the world point you grabbed onto where the fingers are NOW, not
           where they started: that keeps it under them AND gives two-finger pan
           for free. Clamped here to exactly what the frame loop would clamp to,
           so letting go never has to correct anything. */
        const mx=(p[0].x+p[1].x)/2-OX, my=(p[0].y+p[1].y)/2;
        const nx=anchor.wx-(mx-W/2)/cam.k, ny=anchor.wy-(my-SH/2)/cam.k;
        const rx=nx/W-.5;
        cam.cx=ROOM?clampPan(rx,0):Math.max(-.5,Math.min(SLOTS-.5,rx));
        cam.cy=Math.max(-.5,Math.min(FLOORS-.5,(FLOORS-1)-(ny/SH-.5))); }
    }
    return; }
  moved=Math.max(moved,Math.abs(e.clientX-dnX),Math.abs(e.clientY-dnY));
  if(FOCUS||moved<=6) return;
  /* Both axes are grab-the-world: the point under your finger stays under your
     finger. cam.cy counts upward while the screen counts downward, so the
     vertical term adds where the horizontal one subtracts. There is no longer a
     separate map drag and room drag — the only thing zoom changes is how much
     vertical you are allowed, damped away across the lock band. */
  cam.tx=cam.ty=null;
  const t=lockT(), dxP=e.clientX-dnX, dyP=e.clientY-dnY;
  if(atSlice()&&ROOM){
    // locked to one floor: decide once whether this drag is a slide or a swipe
    if(!axis&&(Math.abs(dxP)>8||Math.abs(dyP)>8))
      axis=Math.abs(dyP)>Math.abs(dxP)*1.2?'v':'h';
    if(axis==='v'){
      const peek=Math.max(-PEEK_MAX,Math.min(PEEK_MAX,dyP/SWIPE_PEEK));
      cam.cy=Math.max(-.5,Math.min(FLOORS-.5,ROOM.f+peek));
      panV=0;
      return;
    }
  }
  cam.cx=Math.max(-.5,Math.min(SLOTS-.5,panX-dxP/(W*cam.k)));
  if(t<1) cam.cy=Math.max(-.5,Math.min(FLOORS-.5,panY+(dyP/(SH*cam.k))*(1-t)));
  const now=performance.now(), d2=Math.max(1,now-lastPT);
  panV=(-(e.clientX-lastPX)/(W*cam.k))/d2*16;
  lastPX=e.clientX; lastPT=now;
});
/* This is where the staging came from. settle() used to snap the zoom to one of
   exactly two values on release — 1 if you finished above .62, half or less if
   below — so however smoothly you pinched, letting go pulled you to a detent.
   It now only decides which floor you are on and eases onto that line. The scale
   is yours. */
/* ------------------------ floor to floor at the slice ---------------------
   Once the camera is locked to a single floor, vertical drag has nothing to do —
   so it becomes the way you travel between floors. A swipe lets the next floor
   peek in as you go, capped short of the commit point so it never looks like a
   free pan, then commits or springs back when you let go.

   Direction follows grab-the-world, the same as panning does at every other
   zoom: pull the tower down and you reveal what is above it. Flipping that is
   one sign change in SWIPE_PEEK and stepFloor's argument.
   ---------------------------------------------------------------------------- */
const SWIPE_GO=55;        // px of vertical travel that commits to the next floor
const SWIPE_PEEK=220;     // px that would reach the full peek, were it not capped
const PEEK_MAX=.42;       // stays under .5, so a peek never reads as a commit
const atSlice=()=>cam.k>=K_SLICE-1e-6;
function stepFloor(dir){
  if(!ROOM) return;
  const f=Math.max(0,Math.min(FLOORS-1,ROOM.f+dir));
  if(f!==ROOM.f){
    const g=at(f,cur().s);
    ROOM={f,s0:0,s1:SLOTS-1,room:g?g.room:null};
    lastWhere='';
    sfx('paws');   // the 3s cooldown keeps a fast flick through floors from chattering
  }
  cam.ty=null;            // the lock ramp carries it there, or springs it back
}
function settle(){
  if(FOCUS) return;
  cam.tk=null;
  if(cam.k>K_MAP){
    const c=cur();
    if(!ROOM||c.f!==ROOM.f){
      const g=at(c.f,c.s);
      ROOM={f:c.f,s0:0,s1:SLOTS-1,room:g?g.room:null};
      lastWhere='';
    }
  } else { ROOM=null; panV=0; }
}
function release(e){
  const was=ptrs.size; ptrs.delete(e.pointerId);
  if(was>=2&&ptrs.size<2){
    // two fingers down and straight back up, without pinching, is "show me everything"
    const tapped=!pinchMoved;
    pinch0=0; anchor=null; pinchMoved=false;
    if(tapped&&!FOCUS) resetView(); else settle();
  }
  if(ptrs.size===0){
    /* Lifting the last finger of a pinch used to fire tap(). pointermove returns
       early while two pointers are down, so `moved` was never updated and still
       read 0 from before the second finger landed — every pinch ended by tapping
       whatever cell the last finger left the glass on. Below the map threshold
       that flew you into a room; above it, it silently opened or shut the build
       panel. A gesture that ever had two fingers in it is never a tap. */
    const pinched=multi; multi=false;
    if(pinched){ panV=0; return; }
    const swipe=axis==='v'; axis=null;
    if(swipe){
      const dyP=e.clientY-dnY;
      panV=0;
      stepFloor(Math.abs(dyP)>SWIPE_GO?Math.sign(dyP):0);
      return;
    }
    if(was===1&&moved<9){ panV=0; tap(e.clientX-OX,e.clientY); }
    else if(was===1&&isMap()) settle();
  }
}
stage.addEventListener('pointerup',release);
stage.addEventListener('pointercancel',release);
stage.addEventListener('wheel',e=>{ e.preventDefault();
  const ex=e.clientX-OX, ey=e.clientY;
  const wx=(ex-W/2)/cam.k+camX(), wy=(ey-SH/2)/cam.k+camY();
  cam.k=clampK(cam.k*(e.deltaY>0?.9:1.11));
  cam.cx=(wx-(ex-W/2)/cam.k)/W-.5;
  cam.cy=(FLOORS-1)-((wy-(ey-SH/2)/cam.k)/SH-.5);
  cam.tk=cam.tx=cam.ty=null;
  clearTimeout(stage._wt); stage._wt=setTimeout(settle,180);
},{passive:false});

/* ---------------------------- keyboard, on desktop ---------------------------
   The wheel is zoom, so panning needs somewhere else to live: the arrow keys.
   On the map they glide the camera about. Inside a room they run along the
   floor, and up/down step you between floors the way the lift would. They move
   the camera's target rather than the camera, so a press eases instead of
   jumping. Hold shift to cover ground faster.
   ---------------------------------------------------------------------------- */
addEventListener('keydown',e=>{
  if(!/^Arrow/.test(e.key)) return;
  if(FOCUS||MG.on) return;                      // busy with a dog; leave them be
  e.preventDefault();
  const dx=(e.key==='ArrowRight')-(e.key==='ArrowLeft');
  const dy=(e.key==='ArrowUp')-(e.key==='ArrowDown');
  const step=e.shiftKey?2:.6;
  const tx=(cam.tx==null?cam.cx:cam.tx), ty=(cam.ty==null?cam.cy:cam.ty);
  if(lockT()>=1&&dy){                           // locked to a floor: step between them
    const c=cur();
    enterRoom(Math.max(0,Math.min(FLOORS-1,c.f+dy)),c.s);
  } else {
    cam.tx=Math.max(-.5,Math.min(SLOTS-.5,tx+dx*step));
    if(lockT()<1) cam.ty=Math.max(-.5,Math.min(FLOORS-.5,ty+dy*step));
  }
});

function dogAt(x,y){
  for(const d of allDogs()){
    const p=dogScreen(d);
    if(Math.abs(x-p.x)<44*dscale(d)*Math.max(cam.k,.4)*dogEx(cam.k)
       &&y>p.y-100*cam.k&&y<p.y+26*cam.k) return d;
  }
  return null;
}
function tap(x,y){
  if(FOCUS){
    /* Any tap on the stage used to drop you out of a dog you were attending to.
       That made leaving accidental — anything that let a press through to the
       canvas ended the visit — and it fought the whole point of focus, which is
       to stay with one dog while you do things with them. Leaving is now
       deliberate: the X, or Back. Tapping a different dog moves your attention
       across rather than dumping you on the floor between them. */
    const other=dogAt(x,y);
    if(other&&other!==FOCUS&&other.room&&!other.staff) enterFocus(other);
    else sayBubble('');
    return;
  }
  if(TAB&&isMap()){ closeSheet(); return; }
  const c0=screenToCell(x,y);
  if(isMap()){
    if(c0.s<0||c0.s>=SLOTS||c0.f<0||c0.f>=FLOORS) return;
    if(armed){
      if(place(armed,c0.f,c0.s)){ syncCoins(); return; }
      return say(S.coins<armed.cost?'Not enough coins.':'Won\'t fit there.'); }
    enterRoom(c0.f,c0.s);
    return; }
  const c=cur();
  if(pickUpSoil(x,y)) return;
  const hit=dogAt(x,y);
  if(hit){
    if(hit.staff) showStaffCard(hit);
    else if(hit.room) enterFocus(hit);
    else showCard(hit);
    return; }
  hideCard();
  if(!at(c.f,c.s)&&c0.f===c.f&&c0.s===c.s){ openHere(c.f,c.s); return; }
  closeHere();
}

/* ========================= services & mini-games =========================
   Tap a checked-in guest, pick an activity, play a very small game. Doing it
   well pays more and earns affection; doing it badly still pays. There is no
   way to lose money here — the worst outcome is a smaller tip.
   ========================================================================== */
const SERVICES={
  ball :{n:'Fetch', icon:'🎾',base:46, like:'ball', hint:'Tap to jump — time it so the ball reaches them at the top',len:0},
  bath :{n:'Bath',  icon:'🛁',base:78, like:'water',hint:'Rub the suds away with your finger',len:11},
  pet  :{n:'Scratch',icon:'🤚',base:30,like:null,  hint:'Hold a finger on them and find the spot they love',len:9},
  treat:{n:'Treat', icon:'🦴',base:34, like:'treat',hint:'Hold the treat at their nose until they take it',len:0},
  walk :{n:'Walk',  icon:'🦮',base:96, like:null,   hint:'Drag along the path and keep up with them',len:14},
  trick:{n:'Trick', icon:'🎓',base:58, like:'bell', hint:'Swipe the way the arrow points',len:0},
  tug  :{n:'Tug',   icon:'🧶',base:52, like:null,   hint:'Hold to pull, let go while the rope is in the band',len:0}
};
const CLEAN_BASE=14, CLEAN_PER=11;
const MG={on:false,kind:null,dog:null,t:0,score:0,d:null,ptr:null,down:false,over:false};
const mini=document.getElementById('mini'), mc=document.getElementById('mc');
const mg=mc.getContext('2d');
let MW=0,MH=0;
function miniResize(){ MW=innerWidth; MH=innerHeight;
  mc.width=Math.round(MW*DPR); mc.height=Math.round(MH*DPR);
  mg.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',()=>{ if(MG.on) miniResize(); });

function canService(d,k){ return d.room && (!d.did||d.did[k]!==S.day); }
function startService(d,k){
  if(!canService(d,k)) return;
  MG.on=true; MG.kind=k; MG.dog=d; MG.t=0; MG.score=0; MG.over=false;
  MG.ptr=null; MG.down=false;
  const S0=SERVICES[k];
  if(k==='ball')  MG.d={throws:3,done:0,acc:[],fly:0,sp:BALL_RUN[0].sp,hi:BALL_RUN[0].hi,
                        jump:null,jumped:false,best:1e9,caught:false,hold:0,call:'',callT:0};
  if(k==='bath')  MG.d={suds:makeSuds(),left:S0.len};
  if(k==='pet')   MG.d={fill:0,left:S0.len,bliss:0,spark:[],fav:petFav(d),found:false,warm:0};
  if(k==='treat') MG.d={round:0,hold:0,taken:0,elapsed:0};
  if(k==='walk')  MG.d={pts:makePath(),idx:0,left:S0.len,slip:0};
  if(k==='trick') MG.d={round:0,hits:0,dir:pickDir(),swipe:null,flash:0};
  if(k==='tug')   MG.d={round:0,hits:[],pull:0,band:.55+Math.random()*.22,live:true,slack:0};
  document.getElementById('mTitle').textContent=S0.n+' · '+d.name;
  document.getElementById('mHint').textContent=S0.hint;
  document.getElementById('mDone').classList.remove('on');
  document.getElementById('mFill').style.width='0%';
  mini.classList.add('on'); miniResize(); hideCard();
}

const DIRS=[{k:'up',dx:0,dy:-1,word:'SIT',ar:'▲'},{k:'down',dx:0,dy:1,word:'DOWN',ar:'▼'},
  {k:'left',dx:-1,dy:0,word:'HEEL',ar:'◀'},{k:'right',dx:1,dy:0,word:'SPIN',ar:'▶'}];
function pickDir(){ return DIRS[Math.floor(Math.random()*DIRS.length)]; }
function makePath(){
  const pts=[], n=26;
  const amp=.16+Math.random()*.10, ph=Math.random()*6;
  for(let i=0;i<n;i++){ const u=i/(n-1);
    pts.push({x:.10+u*.80, y:.56+Math.sin(u*Math.PI*2.2+ph)*amp}); }
  return pts;
}
function makeSuds(){
  const out=[];
  for(let i=0;i<30;i++){
    const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random());
    out.push({dx:Math.cos(a)*r*118,dy:Math.sin(a)*r*52-34,
      rad:11+Math.random()*13,alive:true,w:Math.random()*7});
  }
  return out;
}
function dogAnchor(){
  /* For fetch, centre his MOUTH rather than his body. Centring the body put the
     mouth near the edge he was facing, so the ball met it a fifth of the way
     into its flight and tapping immediately was nearly optimal. Clamped, or a
     great dane ends up with its tail off the screen. */
  let cx=MW*.5;
  if(MG.on&&MG.kind==='ball'&&MG.dog)
    cx-=BALL_FACE*Math.min(ballNose().x,MW*.22);
  return {cx, by:MH*.62};
}
/* ------------------------------- fetch ------------------------------------
   The ball used to arc over a dog that never moved, and a dashed line marked the
   instant to tap. You were hitting a marker, not causing anything, which is why
   the timing felt arbitrary.

   Now the tap makes the dog JUMP, and whether it catches falls out of the
   geometry. The jump has HANG seconds of air, and the ball has to pass through
   his reach while he is up there — tap early and he is down before it arrives,
   tap late and it has gone by. The arc peaks exactly where his mouth peaks, so a
   perfect throw is the two apexes meeting, and the score is simply how close the
   ball came to his mouth at closest approach. One jump per throw, so the tap is
   a decision rather than something to spam.
   ---------------------------------------------------------------------------- */
const BALL_RUN=[{sp:.58,hi:1.00},{sp:.72,hi:.88},{sp:.88,hi:.78}];
const HANG=.44, JUMP_H=74;
/* Reach is tied to the dog, clamped so a pug is not impossible and a dane
   trivial. A fixed radius left the ball sticking a head's width off a small
   dog's mouth. */
const catchR=()=>{ const B=buildOf(MG.dog);
  return Math.max(40,Math.min(70,22*2.4*MG.dog.def.scale*B.scale)); };
const BALL_FACE=-1;                                  // he watches the ball come in
/* Where his nose actually is, from the same numbers drawDog uses. Guessing an
   offset put the catch point at the back of his neck. */
/* -------------------------------- petting ---------------------------------
   Every dog has one place it particularly likes being scratched, fixed by its
   id, so it is the same place every visit and you come to know it. The game is
   finding it: hold a finger on the dog and read what comes back. Close and the
   hind leg starts going; on it and the leg really goes and the meter fills.

   No markers, because the search IS the game — but the feedback is continuous
   rather than hot-or-cold, so you are never hunting blind. The spots are broad
   on purpose. This is a scratch, not surgery.
   ---------------------------------------------------------------------------- */
/* Five seconds of solid contact to satisfy him. With two or three spent finding
   the spot that lands just inside the nine on the clock, so finishing him off is
   achievable but not a given. */
const PET_RATE=.20;
/* Reach scales with the dog. A fixed radius was wider than the gap between
   neighbouring spots, so the belly, chest, back and rump all counted as the same
   place and the search stopped mattering. Broad enough for a fingertip, tight
   enough that the spots are distinct. */
function petR(){
  const d=MG.dog, B=buildOf(d), s=2.4*d.def.scale*B.scale;
  return Math.max(46,Math.min(92,52*d.def.len*B.len*s*.42));
}
const PET_SPOTS=['ear','crown','cheek','chest','back','belly','rump'];
const PET_NAME={ear:'ear scratches',crown:'a good head rub',cheek:'a chin scratch',
  chest:'a chest rub',back:'a good back scratch',belly:'belly rubs',rump:'a scratch by the tail'};
function petFav(d){ return PET_SPOTS[Math.floor(idRand(d.id,41)*PET_SPOTS.length)%PET_SPOTS.length]; }
function petSpots(){
  const d=MG.dog, A=dogAnchor(), DF=d.def, B=buildOf(d), s=2.4*DF.scale*B.scale;
  const bodyL=52*DF.len*B.len*s, bodyH=26*DF.ht*B.ht*s, legL=20*DF.leg*B.leg*s;
  const bY=-legL*.55-bodyH*.9;                       // he is sitting for this
  const hx=bodyL*.42, hy=bY-bodyH*.30;
  const P=(x,y)=>({x:A.cx+x, y:A.by+y});
  return {
    ear  :P(hx+5*s,  hy-13*s),
    crown:P(hx+9*s,  hy-6*s),
    cheek:P(hx+20*s, hy+5*s),
    chest:P(bodyL*.30, bY+bodyH*.55),
    back :P(-bodyL*.04, bY+2*s),
    belly:P(bodyL*.06, bY+bodyH*.95),
    rump :P(-bodyL*.40, bY+bodyH*.45)
  };
}
function ballNose(){
  const d=MG.dog, DF=d.def, B=buildOf(d), s=2.4*DF.scale*B.scale;
  const bodyL=52*DF.len*B.len*s, bodyH=26*DF.ht*B.ht*s, legL=20*DF.leg*B.leg*s;
  const bY=-legL-bodyH, hx=bodyL*.42, hy=bY-bodyH*.30;
  return {x:hx+17*s+12*s*DF.snout*B.snout, y:hy+1.5*s};
}
function ballGeom(){
  const D=MG.d, A=dogAnchor(), n=ballNose();
  const mouth={x:A.cx+BALL_FACE*n.x, y:A.by+n.y};
  /* The ball crosses the whole screen from the side he is facing. His mouth is
     well off centre, so the apex does NOT fall halfway through the flight — fa
     is where it does, and the height curve is warped to peak there. Making the
     arc symmetric about the mouth instead shrank the flight to a couple of
     hundred pixels and handed you the catch for free. */
  const x0=BALL_FACE<0?-20:MW+20, x1=BALL_FACE<0?MW+20:-20;
  const fa=Math.max(.12,Math.min(.88,(mouth.x-x0)/(x1-x0)));
  const apexY=mouth.y-JUMP_H;                        // the top of his jump
  const amp=((A.by-30)-apexY)*D.hi;
  const bx=x0+D.fly*(x1-x0);
  const g=D.fly<=fa?D.fly/(2*fa):.5+(D.fly-fa)/(2*(1-fa));
  const by=(A.by-30)-Math.sin(Math.min(1,g)*Math.PI)*amp;
  let u=null, jy=0;
  if(D.jump!==null){
    u=(MG.t-D.jump)/HANG;
    if(u>=0&&u<=1) jy=-JUMP_H*Math.sin(u*Math.PI);
  }
  return {A,mouth,bx,by,u,jy,x0,x1,amp,fa};
}


function miniStep(dt){
  if(MG.over) return;
  MG.t+=dt;
  const k=MG.kind, D=MG.d, A=dogAnchor();
  if(k==='ball'){
    if(D.callT>0) D.callT-=dt;
    if(D.hold>0){                                    // beat after a catch or a miss
      D.hold-=dt;
      if(D.hold<=0) nextThrow();
    } else {
      D.fly+=dt*D.sp;
      const G=ballGeom();
      if(D.jump!==null&&!D.caught){
        if(G.u>1){ D.jump=null; if(D.best<catchR()) resolveCatch(); }
        else {
          const dist=Math.hypot(G.bx-G.mouth.x,G.by-(G.mouth.y+G.jy));
          if(dist<D.best) D.best=dist;
          else if(D.best<catchR()) resolveCatch();    // just past closest approach
        }
      }
      if(!D.caught&&D.fly>=1){ endThrow(0,'Missed it'); }
    }
  }
  if(k==='bath'){
    D.left-=dt;
    if(MG.down&&MG.ptr){
      for(const s of D.suds){ if(!s.alive) continue;
        const x=A.cx+s.dx, y=A.by+s.dy;
        if(Math.hypot(MG.ptr.x-x,MG.ptr.y-y)<34){ s.alive=false; sfx('scrub'); } }
    }
    const gone=D.suds.filter(s=>!s.alive).length;
    setMeter(gone/D.suds.length);
    if(gone===D.suds.length||D.left<=0){ MG.score=gone/D.suds.length; finishMini(); }
  }
  if(k==='pet'){
    D.left-=dt;
    const spot=petSpots()[D.fav];
    let near=0;
    if(MG.down&&MG.ptr) near=Math.max(0,1-Math.hypot(MG.ptr.x-spot.x,MG.ptr.y-spot.y)/petR());
    D.warm=near;
    D.bliss+=(near-D.bliss)*Math.min(1,dt*3.4);       // settles rather than snaps
    D.fill=Math.min(1,D.fill+dt*D.bliss*PET_RATE);
    if(D.bliss>.72) D.found=true;
    if(MG.down&&MG.ptr&&Math.random()<D.bliss*(.28+D.fill*.55))
      D.spark.push({x:MG.ptr.x+(Math.random()-.5)*30,y:MG.ptr.y,life:1});
    for(let i=D.spark.length-1;i>=0;i--){ D.spark[i].life-=dt*1.4;
      if(D.spark[i].life<=0) D.spark.splice(i,1); }
    /* The bar is the CLOCK now, draining. What you are scored on is how content
       he is when it runs out — so time is the pressure and satisfaction is the
       result, rather than the bar trying to be both. Nothing decays: wandering
       costs you seconds, not progress. */
    /* The bar is the CLOCK. How satisfied he is stays HIDDEN — you read it off
       him, not off a gauge: the leg going harder, the tail, the hearts coming
       faster. Fill it and he is done and you get full marks; run out of clock
       and you get however far you got. */
    setMeter(Math.max(0,D.left)/SERVICES.pet.len);
    if(D.fill>=1){ MG.score=1; sfx('heart'); finishMini(); }
    else if(D.left<=0){ MG.score=D.fill; finishMini(); }
  }
  if(k==='treat'){
    D.elapsed+=dt;
    const nose={x:A.cx+58,y:A.by-88};
    if(MG.down&&MG.ptr&&Math.hypot(MG.ptr.x-nose.x,MG.ptr.y-nose.y)<52){
      D.hold+=dt*1.5;
      if(D.hold>=1){ D.hold=0; D.taken++; D.round++;
        if(D.taken>=3){ MG.score=Math.max(0,Math.min(1,1-(D.elapsed-4.5)/9)); finishMini(); } }
    } else D.hold=Math.max(0,D.hold-dt*.9);
    setMeter((D.taken+D.hold)/3);
  }
  if(k==='walk'){
    D.left-=dt;
    if(MG.down&&MG.ptr&&D.idx<D.pts.length-1){
      const nx=D.pts[D.idx+1];
      const px=nx.x*MW, py=nx.y*MH;
      if(Math.hypot(MG.ptr.x-px,MG.ptr.y-py)<52) D.idx++;
      else D.slip=Math.min(1,D.slip+dt*.5);
    } else D.slip=Math.max(0,D.slip-dt*.7);
    setMeter(D.idx/(D.pts.length-1));
    if(D.idx>=D.pts.length-1||D.left<=0){ MG.score=D.idx/(D.pts.length-1); finishMini(); }
  }
  if(k==='trick'){
    if(D.flash>0) D.flash-=dt;
  }
  if(k==='tug'){
    if(D.live){
      if(MG.down) D.pull=Math.min(1.18,D.pull+dt*.62);
      else D.pull=Math.max(0,D.pull-dt*1.1);
      if(D.pull>=1.18){ D.hits.push(0); nextTug(); }
    }
    setMeter((D.hits.length+Math.min(1,D.pull))/3.2);
  }
}
function nextTug(){
  const D=MG.d;
  if(D.hits.length>=3){
    MG.score=D.hits.reduce((a,b)=>a+b,0)/3; finishMini(); return; }
  D.pull=0; D.band=.5+Math.random()*.3; D.live=true;
}
function tugRelease(){
  const D=MG.d; if(MG.kind!=='tug'||MG.over||!D.live) return;
  const lo=D.band-.10, hi=D.band+.10;
  const inBand=D.pull>=lo&&D.pull<=hi;
  const near=1-Math.min(1,Math.abs(D.pull-D.band)/.30);
  D.hits.push(inBand?1:near*.55);
  nextTug();
}
function trickSwipe(dx,dy){
  const D=MG.d; if(MG.kind!=='trick'||MG.over) return;
  const want=D.dir;
  const ok=Math.abs(dx)>Math.abs(dy)
    ? (Math.sign(dx)===want.dx&&want.dy===0)
    : (Math.sign(dy)===want.dy&&want.dx===0);
  if(ok) D.hits++;
  D.flash=.45; D.round++;
  if(D.round>=4){ MG.score=D.hits/4; finishMini(); }
  else { D.dir=pickDir(); setMeter(D.hits/4); }
}
function setMeter(v){ document.getElementById('mFill').style.width=Math.round(v*100)+'%'; }

function ballTap(){
  const D=MG.d; if(MG.kind!=='ball'||MG.over||D.hold>0) return;
  if(D.jumped) return;                        // one jump per throw: commit to it
  D.jumped=true; D.jump=MG.t; D.best=1e9;
  sfx('paws');
}
function resolveCatch(){
  const D=MG.d;
  const q=Math.max(0,Math.min(1,1-D.best/catchR()));
  D.caught=true;
  sfx('pop');
  endThrow(q, q>.78?'Clean catch!':q>.42?'Got it!':'Just about!');
}
function endThrow(q,call){
  const D=MG.d;
  D.acc.push(q); D.call=call; D.callT=.9; D.hold=q>0?.55:.4;
  setMeter(D.acc.reduce((x,y)=>x+y,0)/D.throws);
}
function nextThrow(){
  const D=MG.d;
  D.done++;
  if(D.done>=D.throws){
    MG.score=D.acc.reduce((x,y)=>x+y,0)/D.acc.length; finishMini(); return; }
  const cfg=BALL_RUN[Math.min(D.done,BALL_RUN.length-1)];
  D.fly=0; D.sp=cfg.sp; D.hi=cfg.hi;
  D.jump=null; D.jumped=false; D.best=1e9; D.caught=false;
}
function finishMini(){
  if(MG.over) return;
  MG.over=true;
  const S0=SERVICES[MG.kind], d=MG.dog;
  const sc=Math.max(0,Math.min(1,MG.score));
  const pay=Math.round(S0.base*(.45+1.05*sc)*(1+(d.room?d.room.f:0)*.05));
  S.coins+=pay; sfx('coin');
  d.did=d.did||{}; d.did[MG.kind]=S.day;
  d.comfort=Math.min(1,d.comfort+.05+sc*.06);
  let note;
  if(S0.like&&d.likes.includes(S0.like)){
    if(!d.found[S0.like]){ d.found[S0.like]=1; note=d.name+' loves this. Noted.'; }
    else note=d.name+' loved every second.';
    heart(d);
  } else if(sc>.55){ note='Beautifully done.'; heart(d); }
  else if(sc>.4) note='A decent job.';
  else note=d.name+' enjoyed it anyway.';
  document.getElementById('mPay').textContent='+'+pay;
  document.getElementById('mNote').textContent=note;
  document.getElementById('mDone').classList.add('on');
  setTimeout(()=>{ mini.classList.remove('on'); MG.on=false; syncCoins(); },1500);
}

/* ------------------------------ mini drawing ------------------------------ */
/* ------------------------------- the field --------------------------------
   Fetch happens outdoors. The sky and the hedgerow follow the hotel's own
   day/night phase so stepping out of the building does not step into a
   different afternoon, and the clouds drift on MG.t rather than a random seed,
   so they are the same clouds for the whole game rather than a new sky every
   frame.
   ---------------------------------------------------------------------------- */
function drawField(A,t){
  const night=S.phase>.58, hz=A.by-34;             // the horizon, a little behind him
  const sky=mg.createLinearGradient(0,0,0,hz);
  if(night){ sky.addColorStop(0,'#0A1020'); sky.addColorStop(.65,'#1B2440'); sky.addColorStop(1,'#3A3555'); }
  else { sky.addColorStop(0,'#3E6C99'); sky.addColorStop(.58,'#7FA8C6'); sky.addColorStop(1,'#C4D6E0'); }
  mg.fillStyle=sky; mg.fillRect(0,0,MW,hz);

  // sun or moon, low and soft
  const lx=MW*.78, ly=hz*.30;
  const glow=mg.createRadialGradient(lx,ly,4,lx,ly,MW*.55);
  glow.addColorStop(0,night?'rgba(214,226,255,.30)':'rgba(255,236,178,.55)');
  glow.addColorStop(1,'rgba(255,236,178,0)');
  mg.fillStyle=glow; mg.fillRect(0,0,MW,hz);
  mg.fillStyle=night?'#E8EDFA':'#FFF3CE';
  mg.beginPath(); mg.arc(lx,ly,night?15:19,0,7); mg.fill();

  // clouds, drifting
  const CL=[{x:.14,y:.20,s:1.0},{x:.46,y:.12,s:.72},{x:.72,y:.26,s:.88},{x:.94,y:.16,s:.6}];
  mg.fillStyle=night?'rgba(190,200,225,.16)':'rgba(255,252,244,.80)';
  for(const c of CL){
    const cx=((c.x+t*.012)%1.35-.18)*MW, cy=hz*c.y, s=c.s*MW*.085;
    mg.beginPath();
    mg.arc(cx,cy,s*.62,0,7); mg.arc(cx+s*.62,cy+s*.10,s*.46,0,7);
    mg.arc(cx-s*.58,cy+s*.14,s*.40,0,7); mg.arc(cx+s*.16,cy-s*.30,s*.44,0,7);
    mg.fill();
  }

  // a hedgerow along the horizon, for depth
  let sd=9; const r=()=>(sd=(sd*1664525+1013904223)>>>0)/4294967296;
  mg.fillStyle=night?'#16281F':'#3E6141';
  let hx=-10;
  while(hx<MW+20){
    const w=22+r()*46, h=12+r()*26;
    mg.beginPath(); mg.ellipse(hx+w/2,hz-h*.35,w*.6,h,0,0,7); mg.fill();
    hx+=w*.78;
  }

  // the grass, banded so it reads as a field rather than a wall of green
  const gr=mg.createLinearGradient(0,hz,0,MH);
  if(night){ gr.addColorStop(0,'#1E3326'); gr.addColorStop(.45,'#24402C'); gr.addColorStop(1,'#152317'); }
  else { gr.addColorStop(0,'#5E8A4A'); gr.addColorStop(.42,'#6E9C52'); gr.addColorStop(1,'#3F6435'); }
  mg.fillStyle=gr; mg.fillRect(0,hz,MW,MH-hz);
  mg.fillStyle=night?'rgba(255,255,255,.03)':'rgba(255,255,255,.06)';
  for(let i=0;i<5;i++){
    const yy=hz+ (i+1)*(MH-hz)/6;
    mg.fillRect(0,yy,MW,1.5);
  }
}
function miniDraw(t){
  const A=dogAnchor(), D=MG.d, k=MG.kind, d=MG.dog;
  if(k==='ball'){ drawField(A,MG.t); }
  else {
    const bg=mg.createLinearGradient(0,0,0,MH);
    bg.addColorStop(0,'#33262A'); bg.addColorStop(.62,'#3E2F2A'); bg.addColorStop(1,'#241A17');
    mg.fillStyle=bg; mg.fillRect(0,0,MW,MH);
    const gl=mg.createRadialGradient(A.cx,A.by-60,20,A.cx,A.by-60,MW*.85);
    gl.addColorStop(0,'rgba(255,214,150,.16)'); gl.addColorStop(1,'rgba(255,214,150,0)');
    mg.fillStyle=gl; mg.fillRect(0,0,MW,MH);
  }
  const jy=(k==='ball'&&D.jump!==null)?ballGeom().jy:0;
  const lift=1-Math.min(.55,-jy/JUMP_H*.55);         // shadow tightens as he rises
  mg.fillStyle='rgba(20,12,8,'+(.4*lift).toFixed(3)+')';
  mg.beginPath(); mg.ellipse(A.cx,A.by+6,132*lift,20*lift,0,0,7); mg.fill();

  let pose='sit', head=0;
  if(k==='pet') pose='sit';
  if(k==='bath') pose='stand';
  if(k==='ball') head=D.caught?0:(D.fly>.18?1:0);   // watching it come
  if(k==='walk'||k==='tug') pose='stand';
  if(k==='trick') pose=(D.dir&&D.dir.k==='down')?'lie':'sit';
  if(k==='treat') head=1;
  const dd={...d,state:pose==='sit'?'sit':(pose==='lie'?'lie':'idle'),
    facing:k==='ball'?BALL_FACE:1,
    wag:MG.t*(k==='pet'?3+D.bliss*9:3),head,blink:d.blink,hearts:d.hearts,
    kick:k==='pet'?D.bliss:0};
  if(k==='walk'){
    const p=D.pts[Math.min(D.idx,D.pts.length-1)];
    drawDog(mg,{...dd,state:'walk'},p.x*MW,p.y*MH+40,1.5,t,true);
  } else drawDog(mg,dd,A.cx,A.by+jy,2.4,t,true);

  if(k==='ball'){
    const G=ballGeom();
    /* The arc ahead of the ball, dotted. The skill is meant to be timing, not
       guessing where it will go — showing the path makes it learnable on the
       first throw instead of the fifth. */
    if(!D.caught&&D.hold<=0){
      mg.fillStyle='rgba(247,239,225,.22)';
      for(let i=1;i<=9;i++){
        const f=D.fly+i*.035; if(f>1) break;
        const px=G.x0+f*(G.x1-G.x0);
        const gg=f<=G.fa?f/(2*G.fa):.5+(f-G.fa)/(2*(1-G.fa));
        const py=(A.by-30)-Math.sin(Math.min(1,gg)*Math.PI)*G.amp;
        mg.beginPath(); mg.arc(px,py,2.6,0,7); mg.fill();
      }
    }
    // ball: in the mouth once caught, otherwise on its arc
    const bx=D.caught?G.mouth.x:G.bx, by=D.caught?G.mouth.y+G.jy:G.by;
    mg.fillStyle='#C7D96B';
    mg.beginPath(); mg.arc(bx,by,16,0,7); mg.fill();
    mg.strokeStyle='rgba(90,110,40,.85)'; mg.lineWidth=2.5;
    mg.beginPath(); mg.arc(bx,by,16,-.6,1.3); mg.stroke();
    if(D.callT>0){
      mg.globalAlpha=Math.min(1,D.callT*2.4);
      mg.fillStyle=D.caught?'#E2B76A':'rgba(247,239,225,.75)';
      mg.font='800 26px Archivo Black'; mg.textAlign='center';
      mg.fillText(D.call,MW/2,MH*.30);
      mg.globalAlpha=1;
    }
    mg.fillStyle='rgba(247,239,225,.6)'; mg.font='700 11px Archivo'; mg.textAlign='center';
    mg.fillText('THROW '+Math.min(D.done+1,D.throws)+' OF '+D.throws,MW/2,MH*.16);
  }
  if(k==='bath'){
    for(const s of D.suds){ if(!s.alive) continue;
      const x=A.cx+s.dx, y=A.by+s.dy+Math.sin(t*2+s.w)*1.5;
      mg.fillStyle='rgba(244,250,252,.86)';
      mg.beginPath(); mg.arc(x,y,s.rad,0,7); mg.fill();
      mg.fillStyle='rgba(255,255,255,.55)';
      mg.beginPath(); mg.arc(x-s.rad*.3,y-s.rad*.3,s.rad*.34,0,7); mg.fill(); }
    mg.fillStyle='rgba(247,239,225,.55)'; mg.font='700 11px Archivo'; mg.textAlign='center';
    mg.fillText(Math.ceil(Math.max(0,D.left))+'s left',MW/2,MH*.165);
  }
  if(k==='pet'){
    /* The only guide is under your own finger: a ring that warms from pale to
       brass the closer you are. No markers on the dog — finding it is the game —
       but you are reading a gradient rather than guessing. */
    if(MG.down&&MG.ptr){
      const w=D.warm;
      const rr=34+w*16;
      const gl=mg.createRadialGradient(MG.ptr.x,MG.ptr.y,2,MG.ptr.x,MG.ptr.y,rr);
      gl.addColorStop(0,'rgba('+Math.round(226+20*w)+','+Math.round(183+40*w)+',106,'+(.16+w*.34).toFixed(3)+')');
      gl.addColorStop(1,'rgba(226,183,106,0)');
      mg.fillStyle=gl; mg.beginPath(); mg.arc(MG.ptr.x,MG.ptr.y,rr,0,7); mg.fill();
      mg.strokeStyle='rgba('+Math.round(200+55*w)+','+Math.round(170+60*w)+',120,'+(.35+w*.5).toFixed(3)+')';
      mg.lineWidth=2+w*2;
      mg.beginPath(); mg.arc(MG.ptr.x,MG.ptr.y,26+w*6,0,7); mg.stroke();
    }
    for(const s of D.spark){
      mg.globalAlpha=s.life; mg.fillStyle='#E8807E';
      mg.font=`${Math.round(14+10*(1-s.life))}px serif`; mg.textAlign='center';
      mg.fillText('♥',s.x,s.y-(1-s.life)*30); mg.globalAlpha=1; }
    if(D.found){
      mg.globalAlpha=Math.min(1,(D.bliss-.5)*2.4);
      mg.fillStyle='#E2B76A'; mg.font='800 21px Archivo Black'; mg.textAlign='center';
      mg.fillText(d.name+' loves '+PET_NAME[D.fav],MW/2,MH*.30);
      mg.globalAlpha=1;
    }
    mg.fillStyle='rgba(247,239,225,.55)'; mg.font='700 11px Archivo'; mg.textAlign='center';
    mg.fillText(Math.ceil(Math.max(0,D.left))+'s',MW/2,MH*.16);
  }
  if(k==='walk'){
    const D2=D;
    mg.strokeStyle='rgba(226,183,106,.28)'; mg.lineWidth=26; mg.lineCap='round';
    mg.beginPath();
    D2.pts.forEach((p,i)=>{ const x=p.x*MW,y=p.y*MH; i?mg.lineTo(x,y):mg.moveTo(x,y); });
    mg.stroke();
    mg.strokeStyle='rgba(226,183,106,.55)'; mg.lineWidth=3; mg.setLineDash([7,9]);
    mg.beginPath();
    D2.pts.forEach((p,i)=>{ const x=p.x*MW,y=p.y*MH; i?mg.lineTo(x,y):mg.moveTo(x,y); });
    mg.stroke(); mg.setLineDash([]); mg.lineCap='butt';
    if(D2.idx<D2.pts.length-1){
      const nx=D2.pts[D2.idx+1];
      mg.strokeStyle='#E2B76A'; mg.lineWidth=3;
      mg.beginPath(); mg.arc(nx.x*MW,nx.y*MH,26+Math.sin(t*6)*4,0,7); mg.stroke(); }
    mg.fillStyle='rgba(247,239,225,.55)'; mg.font='700 11px Archivo'; mg.textAlign='center';
    mg.fillText(Math.round(D2.idx/(D2.pts.length-1)*100)+'% ALONG',MW/2,MH*.16);
  }
  if(k==='trick'){
    mg.fillStyle=D.flash>0?'rgba(226,183,106,.9)':'rgba(247,239,225,.9)';
    mg.font='700 54px Archivo'; mg.textAlign='center';
    mg.fillText(D.dir.ar,MW/2,MH*.30);
    mg.font='700 15px Archivo'; mg.fillStyle='rgba(247,239,225,.75)';
    mg.fillText(D.dir.word,MW/2,MH*.35);
    mg.font='700 11px Archivo'; mg.fillStyle='rgba(247,239,225,.5)';
    mg.fillText('SWIPE '+D.dir.k.toUpperCase()+'   ·   '+(D.round+1)+' OF 4',MW/2,MH*.16);
  }
  if(k==='tug'){
    const bx=MW*.14, bw=MW*.72, by=MH*.84, bh=20;
    mg.fillStyle='rgba(255,255,255,.10)'; rr(mg,bx,by,bw,bh,10);
    mg.fillStyle='rgba(126,196,140,.55)';
    rr(mg,bx+bw*(D.band-.10),by,bw*.20,bh,10);
    mg.fillStyle='#E2B76A'; rr(mg,bx,by,bw*Math.min(1,D.pull),bh,10);
    if(D.pull>1.02){ mg.fillStyle='rgba(232,128,126,.8)';
      rr(mg,bx+bw,by-3,10,bh+6,4); }
    // the rope, stretching as you pull
    const rx=A.cx+70, ry=A.by-96;
    mg.strokeStyle='#C8B48A'; mg.lineWidth=9; mg.lineCap='round';
    mg.beginPath(); mg.moveTo(rx,ry);
    mg.quadraticCurveTo(rx+60+D.pull*70,ry+40,MW*.5,by-46); mg.stroke();
    mg.lineCap='butt';
    mg.fillStyle='rgba(247,239,225,.55)'; mg.font='700 11px Archivo'; mg.textAlign='center';
    mg.fillText('ROUND '+Math.min(D.hits.length+1,3)+' OF 3',MW/2,MH*.16);
  }
  if(k==='treat'){
    const nose={x:A.cx+58,y:A.by-88};
    mg.strokeStyle='rgba(226,183,106,.30)'; mg.lineWidth=2; mg.setLineDash([4,5]);
    mg.beginPath(); mg.arc(nose.x,nose.y,50,0,7); mg.stroke(); mg.setLineDash([]);
    if(D.hold>0){ mg.strokeStyle='#E2B76A'; mg.lineWidth=4;
      mg.beginPath(); mg.arc(nose.x,nose.y,50,-Math.PI/2,-Math.PI/2+D.hold*Math.PI*2); mg.stroke(); }
    const tp=MG.ptr&&MG.down?MG.ptr:{x:MW*.5,y:MH*.86};
    mg.save(); mg.translate(tp.x,tp.y); mg.rotate(-.25);
    mg.fillStyle='#E9D5A8'; rr(mg,-17,-7,34,14,7);
    mg.beginPath(); mg.arc(-17,-8,7,0,7); mg.arc(-17,8,7,0,7);
    mg.arc(17,-8,7,0,7); mg.arc(17,8,7,0,7); mg.fill(); mg.restore();
    mg.fillStyle='rgba(247,239,225,.55)'; mg.font='700 11px Archivo'; mg.textAlign='center';
    mg.fillText('TREAT '+Math.min(D.taken+1,3)+' OF 3',MW/2,MH*.16);
  }
}
let mgDown=null;
mc.addEventListener('pointerdown',e=>{
  mc.setPointerCapture(e.pointerId);
  MG.down=true; MG.ptr={x:e.clientX,y:e.clientY};
  mgDown={x:e.clientX,y:e.clientY};
  if(MG.kind==='ball') ballTap();
});
mc.addEventListener('pointermove',e=>{ MG.ptr={x:e.clientX,y:e.clientY}; });
mc.addEventListener('pointerup',e=>{
  MG.down=false;
  if(MG.kind==='tug') tugRelease();
  if(MG.kind==='trick'&&mgDown){
    const dx=e.clientX-mgDown.x, dy=e.clientY-mgDown.y;
    if(Math.hypot(dx,dy)>34) trickSwipe(dx,dy); }
  mgDown=null;
});
mc.addEventListener('pointercancel',()=>{ MG.down=false; });
document.getElementById('mX').onclick=()=>{ mini.classList.remove('on'); MG.on=false; };
